name: honeypot-ids-system-v1
# ============================================================================
# HONEYPOT LAYER: DATABASE PROXY LEVEL  (alternative to docker-compose.yml)
# ============================================================================
# docker-compose.yml is the default "reverse proxy level" honeypot: suspicious
# sessions are routed to separate honeypot WordPress containers (pools).
# THIS file is the "database proxy level" variant: ONE production_eshop serves
# every request, and wp-content/db.php connects it to the production OR the
# honeypot database per request, based on the proxy's X-Honeypot-Backend
# header. It isolates database-layer attacks only; see db_proxy/COVERAGE.md.
#
# Pick it in the dashboard (Services page -> "Honeypot layer"), or by hand:
#   docker compose -f docker-compose.db-proxy.yml up -d --remove-orphans
#
# Files that differ from the default layer live in db_proxy/ (same relative
# paths) and are bind-mounted OVER the shared copies below. Everything else is
# shared with docker-compose.yml, including the project name, so switching
# layers with `up -d --remove-orphans` swaps the services in place. The one
# volume that is NOT shared is the honeypot database
# (honeypot_database_proxy_data): this layer's databases are clones of
# production (scrubbed), not the default layer's seeded pool-1 database.
# ============================================================================
# Cap every container's json-file log so a runaway stdout log can't fill
# the disk (see also suricata.yaml + the log_capper sidecar for FILE logs).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The network namespace owner of a WordPress container, holding its iptables
# ruleset (images/container_firewall/container-firewall.php). The WordPress
# container joins it (network_mode: service:<name>_net), so every packet it
# sends or receives passes these rules, while WordPress itself gets no
# NET_ADMIN, no iptables binary, and no view of this container's processes
# or files: root inside WordPress cannot change the rules. The networks and
# the DNS name (alias) the edge connects to live here, on the firewall.
# The dashboard's Container Firewall page edits the rulesets (one per
# profile, in container_firewall_rules); every firewall re-reads its file,
# and re-resolves its peers, every 5 s.
# If this container restarts, its WordPress container is left with loopback
# only (fail closed) until recreated; compose does that for its own restarts
# (depends_on restart: true). It runs nothing but the rule loop.
x-container-firewall: &container-firewall
  logging: *default-logging
  image: presshaven/container-firewall:1
  pull_policy: never
  init: true
  restart: unless-stopped
  volumes:
    - container_firewall_rules:/var/lib/container-firewall
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - NET_ADMIN   # this network namespace's own iptables, nothing else
  read_only: true
  tmpfs:
    - /run
  mem_limit: 64m
  cpus: "0.25"
  pids_limit: 50
  healthcheck:
    test: ["CMD", "container-firewall", "health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
    start_interval: 1s

services:
  # ---------------------------------------------------------------------------
  # Initialization service
  # ---------------------------------------------------------------------------
  # Copies the committed production database data into its named volume and
  # generates self-signed SSL certificates. (No pool file/database copies in
  # this layer: there is one eshop, and the honeypot database is cloned from
  # production by honeypot_db_init below.)
  # ---------------------------------------------------------------------------
  init_setup:
    logging: *default-logging
    # alpine + rsync/openssl, built once (see images/init_setup/Dockerfile)
    # rather than `apk add`ed at the top of the command on every boot.
    build: ./images/init_setup
    volumes:
      - ./production_database_data:/source_db:ro
      # Production DB destination (named volume to avoid vmhgfs chown restriction)
      - production_mysql_data:/dest_prod_db
      - ./ssl_certificates:/ssl_certs
    command: |
      sh -c "
      set -x
      echo 'Starting initialization setup (single-eshop / two-database mode)...'

      # -----------------------------------------------------------------------
      # SINGLE-ESHOP TOPOLOGY: there is now ONE WordPress instance
      # (production_eshop) serving both production and honeypot traffic, its
      # code served straight from the ./production_eshop_files bind mount, so
      # there are no per-pool WordPress file volumes to sync any more. The
      # honeypot DATABASE is a runtime clone of production (see honeypot_db_init
      # below), so it doesn't need a pre-seeded data directory either -- it
      # starts empty and MySQL initialises it from its env. The one thing still
      # needed here is copying the committed production DB data directory into
      # production_mysql_data (a named volume), because the production MySQL
      # container must be able to chown its datadir and the vmhgfs bind mount
      # rejects chown at runtime.
      # -----------------------------------------------------------------------
      copy_files() {
        SRC=\$$1; DST=\$$2; LABEL=\$$3
        if [ -d \"\$$SRC\" ] && [ -n \"\$$(find \$$SRC -mindepth 1 -maxdepth 1 2>/dev/null)\" ]; then
          if [ -n \"\$$(find \$$DST -mindepth 1 -maxdepth 1 2>/dev/null)\" ]; then
            echo \"  Destination \$$DST already populated – skipping \$$LABEL copy\"
          else
            echo \"Copying \$$LABEL files to \$$DST...\"
            find \"\$$DST\" -mindepth 1 -delete 2>/dev/null || true
            tar -C \"\$$SRC\" -cf - . | tar -C \"\$$DST\" -xf - 2>/dev/null || echo \"  Warning: tar copy for \$$LABEL returned non-zero\"
            echo \"  Done: \$$LABEL\"
          fi
        else
          echo \"  Source \$$SRC empty or absent – skipping \$$LABEL\"
        fi
      }

      copy_files /source_db /dest_prod_db 'production database data'

      # -----------------------------------------------------------------------
      # Generate self-signed SSL certificates (shared across all services)
      # -----------------------------------------------------------------------
      echo 'Generating SSL certificates...'

      # Subject is deliberately bare (CN only): the old O=HoneypotOrg
      # gave the deception away to the blind pentest. Existing certs are
      # kept, so delete ssl_certificates/server.* (or use the dashboard
      # Certificates page) to pick this up. Keep in sync with
      # _gen_edge_nginx_cert() in dashboard/core/cert_ctl.py.
      if [ ! -f '/ssl_certs/server.crt' ] || [ ! -f '/ssl_certs/server.key' ]; then
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout /ssl_certs/server.key -out /ssl_certs/server.crt \
          -subj '/CN=localhost'
        chmod 600 /ssl_certs/server.key
        chmod 644 /ssl_certs/server.crt
        echo 'SSL certificates generated successfully'
      else
        echo 'SSL certificates already exist, skipping generation'
      fi

      echo 'Initialization setup completed successfully'
      set +x
      "

  # ---------------------------------------------------------------------------
  # Honeypot database initialiser  (clone-of-production + cleaning migrations)
  # ---------------------------------------------------------------------------
  # In the single-eshop / two-database topology there is no separate honeypot
  # WordPress install to `wp core install`. The honeypot database is instead a
  # CLONE of the already-seeded production database (identical schema, options,
  # theme/plugin state and content, so the honeypot renders exactly like the
  # real site) with sensitive data then scrubbed by the migrations in
  # honeypot_database_migrations/:
  #   01_clean-honeypot-data.sql  – replaces real customer/order data with dummy
  #   02_pool_tracking.sql        – honeynet metadata tables
  # honeypot_content_sync keeps the clone fresh afterwards. Runs once and exits.
  # ---------------------------------------------------------------------------
  honeypot_db_init:
    logging: *default-logging
    image: mysql:8.4.13
    depends_on:
      honeypot_database:
        condition: service_healthy
      production_database:
        condition: service_healthy
      # Clone only AFTER production has real WordPress schema+content, or the
      # honeypot would clone an empty database.
      production_db_seed:
        condition: service_completed_successfully
    volumes:
      - ./honeypot_database_migrations:/migrations:ro
      # db_proxy/ override: guarded DELETEs for the clone-of-production database.
      - ./db_proxy/honeypot_database_migrations/01_clean-honeypot-data.sql:/migrations/01_clean-honeypot-data.sql:ro
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      # Production's password reads production; the honeypot database has
      # its own (HONEYPOT_DB_PASSWORD) -- they never cross.
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - HP_PASSWORD=${HONEYPOT_DB_PASSWORD}
    command: |
      bash -c "
      set -e
      PROD=production_database
      HP=honeypot_database

      wait_for() {
        TRIES=0
        until mysqladmin ping -h\"\$$1\" -u\"\$$MYSQL_USER\" -p\"\$$2\" 2>/dev/null | grep -q 'mysqld is alive'; do
          TRIES=\$$((TRIES+1)); [ \"\$$TRIES\" -ge 60 ] && { echo \"  WARNING: \$$1 never became reachable\"; break; }
          sleep 2
        done
      }
      echo 'Waiting for production + honeypot databases to accept connections...'
      wait_for \"\$$PROD\" \"\$$MYSQL_PASSWORD\"; wait_for \"\$$HP\" \"\$$HP_PASSWORD\"

      # Clone production -> honeypot ONLY if the honeypot has no WordPress
      # schema yet (fresh volume). This never clobbers a honeypot that already
      # holds its own user-diverged state on a warm restart.
      HAS_SCHEMA=\$$(mysql --local-infile=0 -h\"\$$HP\" -u\"\$$MYSQL_USER\" -p\"\$$HP_PASSWORD\" -N -e \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='\$$MYSQL_DATABASE' AND table_name='wp_options'\" 2>/dev/null || echo 0)
      if [ \"\$$HAS_SCHEMA\" = '0' ]; then
        echo 'Cloning production database into the honeypot database...'
        mysqldump -h\"\$$PROD\" -u\"\$$MYSQL_USER\" -p\"\$$MYSQL_PASSWORD\" --single-transaction --no-tablespaces --skip-add-locks \"\$$MYSQL_DATABASE\" | mysql --local-infile=0 -h\"\$$HP\" -u\"\$$MYSQL_USER\" -p\"\$$HP_PASSWORD\" \"\$$MYSQL_DATABASE\"
        echo '  Clone complete.'
      else
        echo '  Honeypot database already has a WordPress schema -- skipping clone.'
      fi

      # Scrub sensitive data + add honeynet metadata tables (best-effort:
      # 01_clean-honeypot-data.sql documents its DELETEs as tolerant of
      # already-absent rows).
      if [ -d /migrations ]; then
        for m in \$$(ls /migrations/*.sql 2>/dev/null | sort); do
          echo \"  Applying \$$m ...\"
          mysql --local-infile=0 -h\"\$$HP\" -u\"\$$MYSQL_USER\" -p\"\$$HP_PASSWORD\" --force \"\$$MYSQL_DATABASE\" < \"\$$m\" || echo \"    (non-zero, continuing)\"
        done
      fi

      # Same site name as production. The honeypot used to rename itself
      # 'Demo Honeypot eShop', which told every diverted user they had been
      # diverted. Copied on every run (REPLACE of production's blogname row),
      # so a volume that still carries the old demo name is put right too;
      # honeypot_content_sync never touches wp_options.
      echo 'Copying the production site name into the honeypot database...'
      mysqldump -h\"\$$PROD\" -u\"\$$MYSQL_USER\" -p\"\$$MYSQL_PASSWORD\" --no-create-info --replace --skip-add-locks --no-tablespaces --skip-triggers --where=\"option_name='blogname'\" \"\$$MYSQL_DATABASE\" wp_options | mysql --local-infile=0 -h\"\$$HP\" -u\"\$$MYSQL_USER\" -p\"\$$HP_PASSWORD\" \"\$$MYSQL_DATABASE\" || echo '  (could not copy the site name, continuing)'

      echo 'Honeypot database initialisation complete.'
      "
    networks:
      - honeypot_network
      - production_network
    # On both networks: never a router between them. Its mysql clients of the
    # honeypot database send no local files (--local-infile=0): attackers end
    # up in that database, and this job holds production's password.
    sysctls:
      net.ipv4.ip_forward: 0

  # ---------------------------------------------------------------------------
  # Honeypot content replication (periodic production -> honeypot pool sync)
  # ---------------------------------------------------------------------------
  # Long-running loop (see scripts/replicate_content_to_honeypot.sh) that
  # keeps each honeypot pool's pages/posts/products in sync with production
  # every REPLICATION_INTERVAL_SECONDS, so a pool never silently goes stale
  # after its one-time initial seed (init_setup/honeypot_db_migration above).
  # Strict allow-list of content tables only -- never touches wp_users or any
  # WooCommerce order/customer/payment table; see the script's header comment
  # for the full non-destructive apply strategy and the pattern-gating
  # coordination with pool_router.lua's is_pool_healthy().
  #
  # Built from mysql:8.4 purely for its mysql/mysqldump client tools (same
  # image family as every other DB-touching service here); it never runs
  # mysqld itself. redis-cli isn't present on that image, so
  # images/content_sync/Dockerfile adds it once at build time; it's used to
  # set/clear the honeypot_pool_replicating:<N> flag pool_router.lua's
  # failover consults.
  # ---------------------------------------------------------------------------
  honeypot_content_sync:
    # tini as PID 1: it forwards SIGTERM. Without it the process (a shell
    # loop / bash script / Python with no SIGTERM handler) ignored the
    # signal as PID 1 and `down` killed it after the 10 s stop timeout.
    init: true
    logging: *default-logging
    build: ./images/content_sync
    depends_on:
      session_store:
        condition: service_healthy
      # The honeypot database must already exist as a clone-of-production
      # (schema + content) before the first scoped DELETE/INSERT sync cycle,
      # and production must already be seeded so there is real content to
      # mirror. honeypot_db_init guarantees both.
      production_db_seed:
        condition: service_completed_successfully
      honeypot_db_init:
        condition: service_completed_successfully
    volumes:
      # db_proxy/ version: syncs the single honeypot_database, not three pools.
      - ./db_proxy/scripts/replicate_content_to_honeypot.sh:/replicate_content_to_honeypot.sh:ro
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - HONEYPOT_DB_PASSWORD=${HONEYPOT_DB_PASSWORD}
      - REDIS_HOST=session_store
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REPLICATION_INTERVAL_SECONDS=${REPLICATION_INTERVAL_SECONDS:-300}
    command: ["bash", "/replicate_content_to_honeypot.sh"]
    restart: unless-stopped
    networks:
      - production_network
      - honeypot_network
      - session_network
    # On honeypot_network and the stack's other networks: never a router
    # between them (Docker leaves ip_forward on in every container namespace).
    sysctls:
      net.ipv4.ip_forward: 0

  # Production WordPress database
  # ---------------------------------------------------------------------------
  # Honeypot database pool manager
  # ---------------------------------------------------------------------------
  # One honeypot database per user: pool_router.lua gives each new user
  # IP a free ready database exclusively (the proxy names it in X-Honeypot-DB,
  # wp-content/db.php connects to it) and queues a wake-up on Redis; this service
  # then clones another database (honeypot_database_N, N > 1) from production so a
  # spare is waiting. With no spare (all owned, or POOL_MAX reached) the router
  # reuses the existing databases round-robin. `honeypot_database` above is pool 1.
  # Containers it creates carry no compose labels, so `up --remove-orphans`
  # leaves them alone.
  #
  # SECURITY: mounts the Docker socket (root-equivalent on the host); publishes no
  # ports and joins only session_network (Redis). See docker-compose.yml's
  # pool_manager for the same note.
  # ---------------------------------------------------------------------------
  pool_manager:
    # tini as PID 1: it forwards SIGTERM. Without it the process (a shell
    # loop / bash script / Python with no SIGTERM handler) ignored the
    # signal as PID 1 and `down` killed it after the 10 s stop timeout.
    init: true
    logging: *default-logging
    build: ./images/pool_manager
    depends_on:
      init_setup:
        condition: service_completed_successfully
      session_store:
        condition: service_healthy
      honeypot_db_init:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./honeypot_database_migrations:/migrations:ro
      - ./db_proxy/honeypot_database_migrations/01_clean-honeypot-data.sql:/migrations_override/01_clean-honeypot-data.sql:ro
    environment:
      - COMPOSE_PROJECT=honeypot-ids-system-v1
      - POOL_MODE=database
      - REDIS_HOST=session_store
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      # Every honeypot database's user password (db.php has one); each gets
      # its own random root password from pool_manager.
      - HONEYPOT_DB_PASSWORD=${HONEYPOT_DB_PASSWORD}
      - POOL_SPARES=${POOL_SPARES:-1}
      - POOL_MAX=${POOL_MAX:-10}
      # Resource budget for all pools together (by their containers' limits);
      # pools are built per user session until it is reached, then new
      # sessions share the ready pools round-robin. 0 = no budget.
      - POOL_MAX_MEMORY_MB=${POOL_MAX_MEMORY_MB:-12288}
      - POOL_MAX_CPUS=${POOL_MAX_CPUS:-12}
      - POOL_PARALLEL_BUILDS=${POOL_PARALLEL_BUILDS:-2}
      # What the budget charges per pool (empty = the containers' limits) and
      # how recently a waiting session must have sent a request to get the
      # next pool built for it.
      - POOL_RESERVE_MEM_MB=${POOL_RESERVE_MEM_MB:-}
      - POOL_RESERVE_CPUS=${POOL_RESERVE_CPUS:-}
      - POOL_WAITING_ACTIVE_SECONDS=${POOL_WAITING_ACTIVE_SECONDS:-60}
      # Fast clone: skip re-applying storefront config on a runtime pool that
      # cloned the already-configured production DB (~50s/pool saved). Opt-in.
      - POOL_FAST_CLONE=${POOL_FAST_CLONE:-0}
      # Scale down: pools no request has reached for this long are removed
      # (runtime ones) or freed (compose-declared ones). 0 = never, minimum 600.
      - POOL_IDLE_TIMEOUT_SECONDS=${POOL_IDLE_TIMEOUT_SECONDS:-1800}
      # Host limits for building another pool; below them the router reuses the
      # existing pools round-robin. Empty = the built-in default.
      - POOL_MIN_FREE_MEM_MB=${POOL_MIN_FREE_MEM_MB:-1024}
      - POOL_MAX_LOAD_PER_CPU=${POOL_MAX_LOAD_PER_CPU:-1.5}
      - POOL_MIN_FREE_DISK_GB=${POOL_MIN_FREE_DISK_GB:-5}
      - POOL_RECYCLE_IDLE=${POOL_RECYCLE_IDLE:-1}
    restart: unless-stopped
    networks:
      - session_network

  production_database:
    logging: *default-logging
    image: mysql:8.4.13
    depends_on:
      init_setup:
        condition: service_completed_successfully
    # The wrapper makes root@localhost and MYSQL_USER follow the passwords
    # below on every start and drops root@'%' (scripts/
    # mysql_credentials_entrypoint.sh) -- a copied data dir or a rotated
    # .env can't leave stale or shared credentials behind.
    command: ["bash", "/mysql_credentials_entrypoint.sh", "mysqld", "--mysql-native-password=ON", "--authentication-policy=mysql_native_password"]
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=localhost
    volumes:
      - ./scripts/mysql_credentials_entrypoint.sh:/mysql_credentials_entrypoint.sh:ro
      # Named volume avoids vmhgfs chown restriction; populated by init_setup.
      - production_mysql_data:/var/lib/mysql
    networks:
      - production_network
    # Same hardening as the honeypot pool databases (see honeypot_database_1),
    # which run this exact image and command: no-new-privileges, every
    # capability dropped but the ones mysqld's entrypoint needs to own its
    # data dir and drop to the mysql user, and limits so a runaway query
    # cannot starve the host. More memory than a pool: the real shop's data.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_NICE
    mem_limit: 1024m
    cpus: "1.0"
    pids_limit: 300
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]  # TCP, NOT the local socket: "healthy" must mean the NETWORKED server accepts connections. A `-h localhost` socket ping also answers the official image's temporary --skip-networking bootstrap server, so it goes green before TCP is up and releases service_healthy dependents too early. 127.0.0.1 forces TCP. Still no credentials: "alive" (exit 0) even on access denied, and no password in `docker inspect`
      interval: 30s
      timeout: 5s
      retries: 5
      # 420s, not 30s: only matters on a genuinely empty volume -- confirmed
      # live that mysqld's first-ever bootstrap (InnoDB init + SSL cert
      # generation) can take ~90s for ONE database in isolation, but this
      # container never actually starts alone: a purge + `docker compose
      # up` always bootstraps all 4 databases (this one + all 3 honeypot
      # pools) from scratch AT THE SAME TIME, and confirmed live that the
      # resulting I/O contention is severe enough to matter, not just
      # theoretical -- InnoDB's own page_cleaner logged "1000ms intended
      # loop took 40733ms" during a real 4-way-concurrent fresh init.
      # 240s was already one bump up from an original 30s for the
      # single-instance case (see the old note this replaced); confirmed
      # live even 240s wasn't always enough for the real 4-way-concurrent
      # case -- `docker compose up` gave up calling this container
      # "unhealthy" and aborted the whole dependency chain (every
      # container downstream of it left stuck in `created`, never
      # started) while it was still genuinely mid-bootstrap, not actually
      # broken. Failures during start_period don't count as "unhealthy",
      # they just don't count as healthy yet -- so this costs nothing on
      # a warm restart (which passes on the first check regardless).
      start_period: 420s
      # Probe every 1s (not every `interval`) until the FIRST success
      # during start_period, then fall back to `interval`. Without this
      # the first check only runs a full `interval` after start, so every
      # service_healthy dependent waited up to 10s (DBs) / 30s (eshops)
      # after the service was already up. Same on every healthcheck in
      # this file. Needs Docker Engine 25+.
      start_interval: 1s

  production_eshop_net:
    <<: *container-firewall
    # Built here only (the honeypot pools and pool_manager's runtime
    # pools reuse the tag); never pulled.
    build: ./images/container_firewall
    pull_policy: build
    environment:
      - FIREWALL_PROFILE=production
      - FIREWALL_LAYER=db-proxy
    networks:
      production_network:
        aliases: [production_eshop]
      honeypot_network:
        aliases: [production_eshop]
      monitoring_network:
        aliases: [production_eshop]

  # Production WordPress instance (clean, secure)
  production_eshop:
    logging: *default-logging
    # Same WordPress 6.8.3 / PHP 8.1.33, plus interim PHP2Shell mitigations
    # (see images/wordpress_hardened/Dockerfile). Built here only: the
    # honeypot pools and pool_manager's runtime pools reuse this local tag.
    # pull_policy build: the tag must never be pulled from Docker Hub, where
    # anyone can publish under that name.
    image: presshaven/wordpress:7.1.3-php8.4-hardened
    build: ./images/wordpress_hardened
    pull_policy: build
    depends_on:
      production_eshop_net:
        condition: service_healthy
        restart: true
      production_database:
        condition: service_healthy
      # NOT just "production_database healthy" -- mysqld being reachable
      # says nothing about whether WordPress's own schema exists yet.
      # Waiting on this completing successfully is what guarantees
      # production_eshop (and wp_install_state.lua's 30s health probe)
      # never sees a schemaless database -- see scripts/seed_wordpress_db.sh
      # and production_db_seed below for the full story (this was the root
      # cause of the recurring "Table 'production_database.wp_options'
      # doesn't exist" error).
      production_db_seed:
        condition: service_completed_successfully
      # The honeypot database must be cloned+scrubbed before this single
      # instance can serve honeypot-routed requests against it (see
      # wp-content/db.php and honeypot_db_init).
      honeypot_db_init:
        condition: service_completed_successfully
    environment:
      - WORDPRESS_DB_HOST=production_database:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      # Honeypot database connection, consumed per-request by the db drop-in
      # wp-content/db.php: when the reverse proxy diverts a request (trusted
      # X-Honeypot-Backend: honeypot header), db.php connects $wpdb to THIS
      # database (a scrubbed clone of production) instead of the production one
      # above. Same user name, but its own password: a diverted attacker who
      # reads it (it is the honeypot WordPress' DB password) learns nothing
      # that opens production_database.
      - HONEYPOT_DB_HOST=honeypot_database
      - HONEYPOT_DB_NAME=production_database
      - HONEYPOT_DB_USER=production_user
      - HONEYPOT_DB_PASSWORD=${HONEYPOT_DB_PASSWORD}
      # Shared secret gating the honeypot-db-backend-header mu-plugin's
      # X-DB-Backend/X-DB-Host/X-DB-Probe response headers (which prove, via a
      # real SELECT, which database container served the request). Same secret
      # the reverse proxy uses for its own debug headers; never emitted without
      # it, so a real user never learns which database they hit.
      - INTERNAL_TEST_SECRET=${INTERNAL_TEST_SECRET:-}
      # Turns on wp-content/db.php and the honeypot-db-backend-header
      # mu-plugin. Both are shared files that stay inert without this, so the
      # default layer (and its pool containers) never switch databases.
      - HONEYPOT_LAYER=database
      # Cookie-signing keys/salts from .env (see docker-compose.yml
      # production_eshop). One WordPress serves both databases here, so the
      # honeypot side shares them -- but it never holds production users.
      - WORDPRESS_AUTH_KEY=${WORDPRESS_AUTH_KEY:-}
      - WORDPRESS_SECURE_AUTH_KEY=${WORDPRESS_SECURE_AUTH_KEY:-}
      - WORDPRESS_LOGGED_IN_KEY=${WORDPRESS_LOGGED_IN_KEY:-}
      - WORDPRESS_NONCE_KEY=${WORDPRESS_NONCE_KEY:-}
      - WORDPRESS_AUTH_SALT=${WORDPRESS_AUTH_SALT:-}
      - WORDPRESS_SECURE_AUTH_SALT=${WORDPRESS_SECURE_AUTH_SALT:-}
      - WORDPRESS_LOGGED_IN_SALT=${WORDPRESS_LOGGED_IN_SALT:-}
      - WORDPRESS_NONCE_SALT=${WORDPRESS_NONCE_SALT:-}
      # No WORDPRESS_DEBUG: debug.log would land in the webroot. db.php does
      # not log through WP_DEBUG.
    # ports:
    #   - "80:80" # temporary port for direct access
    volumes:
      - ./production_eshop_files:/var/www/html
    # No networks of its own: it lives in production_eshop_net's network namespace,
    # which holds the networks, the DNS name and the firewall (see
    # x-container-firewall at the top).
    network_mode: service:production_eshop_net
    # -------------------------------------------------------------------------
    # Container hardening -- added this session. Every other service in this
    # compose file (honeypot_eshop_1/2/3, both database families,
    # backup_service) already had cap_drop/security_opt/resource limits;
    # production_eshop was the one exception, running with full default
    # Docker capabilities and no memory/CPU/pids ceiling at all. That's
    # backwards for a container serving real customer traffic and running a
    # large, third-party-plugin-heavy PHP application -- a compromise here
    # (a supply-chain issue in an installed plugin, a real unpatched CVE)
    # deserves the same containment as the honeypot side, and an unbounded
    # container can take down the whole host on its own even without being
    # compromised (a runaway request, a plugin bug).
    #
    # Same minimal capability set as honeypot_eshop_1 (Apache+PHP needs the
    # same things regardless of which side it's on); mem_limit/cpus set
    # higher than the honeypot pools (1024m/1.0 vs 512m/0.5) since this
    # instance is expected to carry real traffic and was already observed
    # comfortably using ~640MB unconstrained.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - KILL
    mem_limit: 1024m
    cpus: "1.0"
    pids_limit: 300
    # WordPress writes (Font Library cache under wp-content/fonts, plugin/
    # theme auto-updates, wp-content/upgrade, debug.log, etc.) all happen
    # from apache WORKER processes running as www-data, not from the
    # container's root master process -- and confirmed live via
    # /proc/<worker-pid>/status that a plain setuid() to www-data drops
    # EVERY capability (CapEff 0000000000000000), including the
    # DAC_OVERRIDE granted above. That cap_add only ever helps things the
    # root master does; it can never bypass a permission check for
    # anything PHP itself writes.
    #
    # First attempt here was `chown -R www-data:www-data /var/www/html/
    # wp-content` -- WRONG for a bind mount: that chown doesn't stay
    # inside the container, it directly reassigns the HOST files (this is
    # ./production_eshop_files, a git-tracked directory) to uid/gid 33,
    # which on THIS host resolves to the unrelated system account `http`,
    # not the host user that owns the rest of the repo -- confirmed live,
    # broke `git add`/`git status` with "Permission denied" reading those
    # files from the host side afterward.
    #
    # Fixed the other way around instead: remap the CONTAINER's www-data
    # user/group to whatever uid/gid the bind mount is ALREADY owned by
    # (read via `stat` on the mount root itself, /var/www/html, which this
    # command never touches -- only wp-content underneath it gets
    # chowned), via usermod/groupmod, before apache ever starts. Apache
    # resolves its worker identity by NAME (`User www-data`, see
    # /etc/apache2/envvars) via getpwnam(), so remapping what uid that
    # name points to is enough -- no apache/wordpress config changes
    # needed. This means apache's workers end up running as the SAME
    # uid/gid that already owns the bind mount (the host user), so they
    # get write access via plain ownership with zero host-side ownership
    # change at all, and every file PHP creates going forward is owned by
    # that same uid too -- git keeps working indefinitely, not just once.
    # The one remaining chown (now a no-op / correctness net, not the
    # actual fix) re-claims anything still numerically owned by the OLD
    # www-data (33) from before this fix, or from a stale image layer.
    #
    # Left as the default ENTRYPOINT (docker-entrypoint.sh, unmodified --
    # still does its normal wp-config/DB-wait/core-file setup as root)
    # with only the final CMD replaced, so all of this runs after that
    # setup and before apache starts serving requests.
    command:
      - sh
      - -c
      - |
        HOST_UID=$$(stat -c '%u' /var/www/html)
        HOST_GID=$$(stat -c '%g' /var/www/html)
        usermod -u "$$HOST_UID" www-data
        groupmod -g "$$HOST_GID" www-data
        chown -R www-data:www-data /var/www/html/wp-content
        exec apache2-foreground -D PRODUCTION_HARDENING
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # ---------------------------------------------------------------------------
  # One-shot WordPress + WooCommerce + Elementor bootstrap for
  # production_eshop -- see scripts/seed_wordpress_db.sh for the full
  # rationale. A freshly-cloned repo already ships the entire WordPress
  # codebase (core/plugins/themes/uploads, all git-tracked under
  # production_eshop_files/), but production_database starts with ZERO
  # tables until something runs `wp core install` -- nothing ever did,
  # which is why "Table 'production_database.wp_options' doesn't exist"
  # kept recurring (WordPress core itself failing, not Elementor
  # specifically, on every request that touches options -- including
  # wp_install_state.lua's own 30s health probe). production_eshop now
  # depends on this completing successfully (not just on
  # production_database being reachable) so that can never happen again.
  #
  # honeypot_db_seed_1/2/3 below are the exact same idea applied to each
  # honeypot pool's own database -- those had NEVER had WordPress schema
  # either (confirmed live: honeypot_database/2/3 only ever had the
  # pool_router bookkeeping tables -- honeypot_ip_assignments/
  # honeypot_pool_events/honeypot_pool_registry -- never any wp_* table),
  # which meant honeypot_content_sync's own scoped DELETE/INSERT
  # replication (it creates content ROWS into EXISTING tables, never
  # schema) had nothing to write into either. Same root cause, same fix,
  # applied four times over -- once per WordPress database this stack has.
  #
  # Deliberately a plain-text WP-CLI script, not a committed SQL dump /
  # git-lfs binary: a few KB, reviewable in a normal `git diff`,
  # regenerable from the already-git-tracked plugin/theme code -- not a
  # large opaque blob that would eat GitHub's free LFS quota. See the
  # script's own header comment for the full reasoning.
  #
  # Runs as root (unlike production_eshop's own hardened, non-root
  # container) specifically to avoid needing the same host-uid/gid-remap
  # dance production_eshop's command performs -- reasonable here because
  # this container does one job and exits, it never serves live traffic.
  # ---------------------------------------------------------------------------
  production_db_seed:
    logging: *default-logging
    image: wordpress:cli-2.12.0-php8.4
    user: root
    depends_on:
      production_database:
        condition: service_healthy
    environment:
      - WORDPRESS_DB_HOST=production_database:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      - WP_ADMIN_USER=${WP_ADMIN_USER:-admin}
      - WP_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD:-change_this_wp_admin_password}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL:-admin@example.com}
      - WP_SITE_URL=${WP_SITE_URL:-http://localhost}
      - WP_SITE_TITLE=${WP_SITE_TITLE:-Fernhill Coffee Roasters}
      # Set to 1 to wipe and rebuild the storefront from scratch on the
      # next `docker compose up` instead of the normal idempotent no-op --
      # see the dashboard's Backups page "Reset demo store" action /
      # manage_backups.sh, or export it in the shell before `up`.
      - FORCE_RESEED=${FORCE_RESEED:-0}
      # Optional Stripe sandbox keys -- see scripts/seed_wordpress_db.sh's
      # configure_storefront(). Empty = Stripe gateway stays off, offline
      # gateways (cash on delivery / bank transfer) still make checkout work.
      - STRIPE_TEST_PUBLISHABLE_KEY=${STRIPE_TEST_PUBLISHABLE_KEY:-}
      - STRIPE_TEST_SECRET_KEY=${STRIPE_TEST_SECRET_KEY:-}
      # Production is the one real source of content -- see
      # scripts/seed_wordpress_db.sh's IMPORT_SAMPLE_CONTENT note.
      - IMPORT_SAMPLE_CONTENT=1
    volumes:
      - ./production_eshop_files:/var/www/html
      - ./scripts/seed_wordpress_db.sh:/seed_wordpress_db.sh:ro
      # On-demand WordPress core + WooCommerce upgrade (dashboard "WordPress
      # Update" page). The --apply path snapshots + restores wp-content/db.php,
      # which in THIS layer is the live database router, so an upgrade can never
      # drop the drop-in -- see scripts/update_wordpress.sh PRESERVE_FILES.
      - ./scripts/update_wordpress.sh:/update_wordpress.sh:ro
      - ./scripts/seed_elementor_pages.sh:/seed_elementor_pages.sh:ro
      # Storefront catalog/pages/journal (Fernhill Coffee Roasters) and its images.
      - ./scripts/seed_storefront_content.php:/seed_storefront_content.php:ro
      - ./eshop_seed:/eshop_seed:ro
    networks:
      - production_network
    # Only the CMD is overridden (matching production_eshop's own command
    # override just below) -- ENTRYPOINT stays docker-entrypoint.sh, which
    # is what actually generates wp-config.php from the WORDPRESS_DB_*
    # env vars above on a fresh checkout (no wp-config.php committed to
    # git -- it holds live DB credentials/salts). Bypassing the
    # entrypoint entirely would skip that and leave wp-cli with no DB
    # config to run against on a genuinely first-ever boot.
    command: ["sh", "/seed_wordpress_db.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Same DAC_OVERRIDE reasoning as backup_service: this bind mount is
    # host-owned, and root here still needs to bypass that ownership to
    # write wp-config.php/wp-content/the database schema on first boot.
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 512m
    # 1.0, not 0.5: every wp-cli call here boots all of WordPress +
    # WooCommerce + Elementor, which is CPU-bound -- measured ~1.2-2s per
    # boot at 0.5 vs ~0.6s at 1.0 (no further gain at 2.0). One-shot
    # container on the critical startup path, same ceiling as the eshops.
    cpus: "1.0"
    pids_limit: 100

  # Sets the decoy admin account in the honeypot database. honeypot_db_init's
  # scrub replaces wp_users with placeholder accounts, so without this the
  # honeypot side had an admin password nobody knew. Same user name and e-mail
  # as production, but HONEYPOT_WP_ADMIN_PASSWORD -- never production's (see
  # .env). ADMIN_ONLY=1: nothing else is seeded or reconfigured. HONEYPOT_LAYER
  # is deliberately unset, so wp-content/db.php stays inactive and wp-cli talks
  # to WORDPRESS_DB_HOST below rather than routing to production.
  honeypot_admin_seed:
    logging: *default-logging
    image: wordpress:cli-2.12.0-php8.4
    user: root
    depends_on:
      honeypot_db_init:
        condition: service_completed_successfully
    environment:
      - WORDPRESS_DB_HOST=honeypot_database:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${HONEYPOT_DB_PASSWORD}
      - WP_ADMIN_USER=${WP_ADMIN_USER:-admin}
      - WP_ADMIN_PASSWORD=${HONEYPOT_WP_ADMIN_PASSWORD:-change_this_honeypot_wp_admin_password}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL:-admin@example.com}
      - WP_SITE_URL=${WP_SITE_URL:-http://localhost}
      - WP_SITE_TITLE=${WP_SITE_TITLE:-Fernhill Coffee Roasters}
      - ADMIN_ONLY=1
    volumes:
      - ./production_eshop_files:/var/www/html:ro
      - ./scripts/seed_wordpress_db.sh:/seed_wordpress_db.sh:ro
    networks:
      - honeypot_network
    command: ["sh", "/seed_wordpress_db.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 100

  # The single honeypot database's firewall (x-container-firewall, profile
  # honeypot_database): MySQL in from honeypot_network, nothing out.
  honeypot_database_net:
    <<: *container-firewall
    environment:
      - FIREWALL_PROFILE=honeypot_database
      - FIREWALL_LAYER=db-proxy
    networks:
      honeypot_network:
        aliases: [honeypot_database]

  # The single honeypot database (a scrubbed clone of production, see
  # honeypot_db_init). Own volume, not shared with the default layer's pools.
  honeypot_database:
    logging: *default-logging
    image: mysql:8.4.13
    depends_on:
      honeypot_database_net:
        condition: service_healthy
        restart: true
      init_setup:
        condition: service_completed_successfully
    # The wrapper makes root@localhost and MYSQL_USER follow the passwords
    # below on every start and drops root@'%' (scripts/
    # mysql_credentials_entrypoint.sh) -- a copied data dir or a rotated
    # .env can't leave stale or shared credentials behind.
    command: ["bash", "/mysql_credentials_entrypoint.sh", "mysqld", "--mysql-native-password=ON", "--authentication-policy=mysql_native_password"]
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${HONEYPOT_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${HONEYPOT_MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=localhost
    volumes:
      - ./scripts/mysql_credentials_entrypoint.sh:/mysql_credentials_entrypoint.sh:ro
      # Named volume avoids vmhgfs chown restriction; populated by init_setup.
      - honeypot_database_proxy_data:/var/lib/mysql
    # No networks of its own: it lives in honeypot_database_net's network
    # namespace. Diverted sessions' SQL injections run here, so it must be a
    # dead end: it cannot open a connection to the edge, Redis or production.
    network_mode: service:honeypot_database_net
    # -------------------------------------------------------------------------
    # Container hardening – defence-in-depth so that a SQL injection or
    # database-level exploit cannot be used to pivot beyond this container.
    #
    # no-new-privileges: prevents setuid binaries from gaining additional
    #   capabilities at runtime (e.g. a SUID shell dropped by an adversary).
    # cap_drop ALL / cap_add minimal set: MySQL only needs CHOWN (own its data
    #   directory), DAC_OVERRIDE (read/write across uid boundaries),
    #   FOWNER (ignore ownership checks for its own files), SETGID/SETUID
    #   (drop to the 'mysql' user on start) and SYS_NICE (adjust scheduling
    #   priority via nice()).  All other Linux capabilities are removed.
    # mem_limit / cpus / pids_limit: prevent a runaway query (e.g. triggered by
    #   a time-based blind SQLi payload) from starving the host or other containers.
    # -------------------------------------------------------------------------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_NICE
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]  # TCP, NOT the local socket: "healthy" must mean the NETWORKED server accepts connections. A `-h localhost` socket ping also answers the official image's temporary --skip-networking bootstrap server, so it goes green before TCP is up and releases service_healthy dependents too early. 127.0.0.1 forces TCP. Still no credentials: "alive" (exit 0) even on access denied, and no password in `docker inspect`
      interval: 30s
      timeout: 5s
      retries: 5
      # See production_database's healthcheck comment above for why 420s.
      start_period: 420s
      start_interval: 1s

  # Redis for session management and threat intelligence
  session_store:
    logging: *default-logging
    # Needs vm.overcommit_memory=1 on the HOST: without it Redis logs
    # "WARNING Memory overcommit must be enabled!" at every start, and a
    # background save can fail -- after which Redis refuses writes (sessions,
    # threat state, the pool registry). It is a host-level kernel setting
    # (not namespaced per container, so compose's `sysctls:` can't set it).
    # The dashboard checks it on every host that runs this stack and shows
    # the fix in a banner and in the Services start report
    # (dashboard/core/host_settings.py).
    image: redis:8.10.2-alpine
    depends_on:
      init_setup:
        condition: service_completed_successfully
    volumes:
      - redis_data:/data
      - ./redis_config:/usr/local/etc/redis
    networks:
      - session_network
    command: |
      sh -c "
      echo 'Starting Redis with fresh data...'
      rm -rf /data/*
      exec redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
      "
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s

  # Suricata IDS for traffic analysis
  # ---------------------------------------------------------------------------
  # Runs in af-packet mode on the Docker bridge interface (eth0 inside the
  # container) so it can inspect all honeynet and production traffic that
  # passes through the monitoring_network.
  #
  # Capabilities:
  #   NET_ADMIN  – required for packet capture via AF_PACKET sockets
  #   SYS_NICE   – allows Suricata to adjust its scheduling priority
  #
  # The ids_network is a dedicated bridge used solely to give Suricata a
  # network attachment point with visibility into honeynet traffic.
  # ---------------------------------------------------------------------------
  suricata_ids:
    logging: *default-logging
    image: jasonish/suricata:8.0.7
    depends_on:
      init_setup:
        condition: service_completed_successfully
    volumes:
      - ./suricata_config:/etc/suricata
      - ./suricata_logs:/var/log/suricata
      - ./suricata_rules:/var/lib/suricata/rules
    environment:
      - ELK_ENABLED=${ELK_ENABLED:-false}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - ELASTICSEARCH_USER=${ELASTICSEARCH_USER:-}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
    # network_mode: host -- NOT the usual `networks:` list. Confirmed live
    # (attack-test-2026-08-05.log, repo root) that plain bridge-network
    # *membership* (this container was on ids_network, same as
    # reverse_proxy) does not mean shared traffic *visibility*: each
    # container's virtual NIC only ever receives frames addressed to
    # itself, not a copy of everything else on the bridge. A full mixed
    # attack run against the stack produced zero http/alert events in
    # eve.json -- only background flow/stats noise on this container's own
    # otherwise-idle interface. Real client traffic reaches reverse_proxy
    # via published-port DNAT and its own backend traffic flows over
    # production_network/honeypot_network -- neither path ever touched
    # ids_network. Host networking gives this container the same view of
    # traffic as the Docker host itself (including the actual bridge
    # interfaces those other networks use), which is what
    # suricata_config/suricata.yaml's af-packet `interface: any` (see that
    # file) is written to capture across. `networks:` and `network_mode:`
    # are mutually exclusive in Compose, hence the removal below.
    network_mode: host
    # NET_ADMIN: required for AF_PACKET socket-based capture.
    # SYS_NICE: allows Suricata to manage its own thread scheduling priority.
    # privileged: required for AF_PACKET socket creation on some systems.
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    cap_drop:
      - ALL
    # entrypoint override: the jasonish/suricata image's own
    # /docker-entrypoint.sh does `exec $@` (UNQUOTED) to pass through a
    # custom command. Since `command:` below is a single multi-line shell
    # script string, Compose passes it to that entrypoint as ONE argument --
    # but the unquoted `$@` in the image's entrypoint re-splits it on
    # whitespace/newlines, shredding the script into dozens of separate
    # arguments. `sh -c` then only sees the first fragment ("echo") as its
    # actual script; everything else silently becomes discarded positional
    # parameters. Net effect: the container ran essentially `sh -c echo`,
    # producing no real output and exiting in well under a second --
    # confirmed live: `docker compose ps -a` showed suricata_ids exiting
    # with code 0 immediately after every start, with completely empty logs
    # even for a trivial `echo` test command, and the same script worked
    # correctly the moment the image's entrypoint was bypassed. This is a
    # bug in the upstream image, not this project's script. Fixed by
    # overriding the entrypoint so our command reaches `sh -c` directly,
    # without going through the image's broken passthrough logic at all.
    #
    # `command` MUST be a YAML list with exactly one element (the script, as
    # a single block-scalar string) rather than a bare multi-line scalar.
    # A bare scalar is parsed by Compose in "shell form" and gets
    # shell-word-split into a *separate* array element per token before
    # being appended after the exec-form `entrypoint` -- so `/bin/sh -c`
    # ended up receiving "echo" as its `-c` script and every other word as a
    # discarded positional parameter, reproducing the exact same
    # word-splitting corruption this override was meant to fix, just one
    # layer up (in Compose's own command parsing instead of the image
    # entrypoint's). Wrapping it as a one-item list forces Compose to treat
    # the whole block as a single opaque string.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 'Starting Suricata IDS...'

        # Ensure log directory exists and is writable
        mkdir -p /var/log/suricata

        # Copy custom rules into the rules directory Suricata expects.
        # The local.rules file is mounted at /var/lib/suricata/rules/local.rules
        # which matches the rule-files path in suricata.yaml.
        if [ -f /var/lib/suricata/rules/local.rules ]; then
          echo '  Custom rules found at /var/lib/suricata/rules/local.rules'
        else
          echo '  Warning: local.rules not found - Suricata will use built-in rules only'
        fi

        # Start Suricata in AF_PACKET mode, in the FOREGROUND (no -D/daemonize)
        # so the suricata process itself is the container's main process --
        # this also removes the need for a separate `tail -f /dev/null`
        # keep-alive trick, whose behavior with BusyBox's tail implementation
        # on /dev/null was never actually verified to block indefinitely on
        # this image's base OS.
        #
        # `--pcap` is used bare (no interface value), reading the capture
        # config from suricata_config/suricata.yaml's `pcap:` section
        # instead (interface: any) -- see that file's comment for why PCAP
        # capture mode was chosen over AF_PACKET (AF_PACKET has no working
        # equivalent of libpcap's "any" pseudo-device, and this container's
        # network_mode: host setup means the real interface to listen on is
        # one of several dynamically-named, unpredictable docker bridge
        # interfaces rather than a single fixed name).
        #
        # Note for posterity: an earlier version of this line used
        # `--af-packet eth0` (space-separated), which is invalid CLI syntax
        # -- Suricata's real syntax is `--af-packet[=<dev>]`, requiring an
        # *equals sign* to attach an interface value. The space-separated
        # form gets parsed as two separate arguments, and the bare "eth0"
        # is then treated as an ad-hoc BPF filter expression to compile,
        # producing `failed to compile BPF "eth0": can't parse filter
        # expression: syntax error`. Confirmed live, and confirmed via
        # `suricata --help`. The same equals-sign requirement applies to
        # `--pcap[=<dev>]` -- passing a bare flag (no value at all, as done
        # here) sidesteps the whole issue by deferring entirely to the
        # config file, which is also the more maintainable form regardless.
        exec suricata -c /etc/suricata/suricata.yaml --pcap -l /var/log/suricata
    healthcheck:
      test: ["CMD", "test", "-f", "/var/log/suricata/fast.log"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 2s

  # Vector for shipping logs to ELK SIEM (on OpenStack SIEM VM 147.175.151.193)
  # ---------------------------------------------------------------------------
  # Automated backup service
  # ---------------------------------------------------------------------------
  # Runs on a 24-hour loop, dumping the production MySQL database and archiving
  # the production WordPress files into the ./backups/ directory on the host.
  #
  # Retention: the backup script keeps only the last 7 daily archives; older
  # files are pruned automatically to prevent unbounded disk growth.
  #
  # The service is intentionally isolated from honeypot networks and has no
  # access to honeypot data – backups are production-only.
  #
  # Security hardening: runs with no-new-privileges, drops all capabilities
  # (a backup process needs only filesystem read access, not Linux capabilities),
  # and is limited in memory and CPU to avoid interfering with live traffic.
  # ---------------------------------------------------------------------------
  backup_service:
    # tini as PID 1: it forwards SIGTERM. Without it the process (a shell
    # loop / bash script / Python with no SIGTERM handler) ignored the
    # signal as PID 1 and `down` killed it after the 10 s stop timeout.
    init: true
    logging: *default-logging
    # alpine + mysql-client, built once (see images/backup_service/Dockerfile)
    # rather than `apk add`ed on every container start.
    build: ./images/backup_service
    depends_on:
      production_database:
        condition: service_healthy
      production_eshop:
        condition: service_healthy
    volumes:
      - ./production_eshop_files:/source_wp:ro
      - ./backups:/backups
      - ./backups/backup.sh:/backup.sh:ro
      - ./backups/restore_db.sh:/restore_db.sh:ro
    networks:
      - production_network
    environment:
      - MYSQL_HOST=production_database
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - BACKUP_RETENTION_DAYS=7
    command: |
      sh -c "
        echo 'Backup service started. First backup in 5 minutes...'
        sleep 300
        while true; do
          /backup.sh
          echo 'Next backup in 24 hours...'
          sleep 86400
        done
      "
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # DAC_OVERRIDE: ./backups/ is a host bind mount owned by the host user
    # (not root), and this container otherwise runs as root (the alpine
    # base image's default) with every other capability dropped. Without
    # DAC_OVERRIDE, root inside the container can no longer bypass a
    # directory's Unix permission bits -- confirmed live: backup.sh's very
    # first `mkdir "${DB_BACKUP_DIR}"` failed with "Permission denied" every
    # single run, so backup_service had been running for hours without ever
    # producing one actual backup file, silently. This is the one
    # capability that specifically restores "root can write into a
    # directory it doesn't own", which is exactly what's needed here and
    # nothing more.
    cap_add:
      - DAC_OVERRIDE
    mem_limit: 256m
    cpus: "0.25"
    pids_limit: 50
    restart: unless-stopped

  vector_outbound:
    logging: *default-logging
    image: timberio/vector:0.60.0-debian
    profiles:
      - elk
    user: root
    depends_on:
      reverse_proxy:
        condition: service_started
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./vector/certs:/etc/vector/certs:ro
      - ./suricata_logs:/var/log/suricata:ro
      - ./nginx_logs:/var/log/nginx:ro
      - ./vector/data:/var/lib/vector
      - ./vector/logs:/var/log/vector
      # Docker socket and container logs for monitoring all containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Redis logs (if available) – named volume (vmhgfs bind-mount does not support chown)
      - redis_data:/var/log/redis:ro
    environment:
      # Vector 0.50+ no longer expands ${VAR} in its config unless asked to:
      # without this, vector.yaml's docker_logs filter stays the literal
      # "com.docker.compose.project=${COMPOSE_PROJECT_NAME:-...}" (matches no
      # container) and the SIEM address is unresolved -- it validates and
      # then ships nothing. Every variable it reads is set here, by us.
      - VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
      - ELK_ENABLED=${ELK_ENABLED:-true}
      - VECTOR_HOST=${VECTOR_HOST:-147.175.151.193}
      - VECTOR_PORT=${VECTOR_PORT:-6000}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-147.175.151.193}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - ELASTICSEARCH_PROTOCOL=${ELASTICSEARCH_PROTOCOL:-https}
      - ELASTICSEARCH_USER=${ELASTICSEARCH_USER:-elastic}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
      - ELASTICSEARCH_SSL_ENABLED=${ELASTICSEARCH_SSL_ENABLED:-true}
      - ELASTICSEARCH_SSL_VERIFY=${ELASTICSEARCH_SSL_VERIFY:-certificate}
      - KIBANA_HOST=${KIBANA_HOST:-147.175.151.193}
      - KIBANA_PORT=${KIBANA_PORT:-5601}
      - KIBANA_PROTOCOL=${KIBANA_PROTOCOL:-https}
      - KIBANA_SSL_ENABLED=${KIBANA_SSL_ENABLED:-true}
      - KIBANA_SSL_VERIFY=${KIBANA_SSL_VERIFY:-certificate}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-honeypot-ids-system-v1}
    networks:
      - monitoring_network
    # Lets this container resolve "host.docker.internal" to the Docker
    # host's own gateway IP (Docker Engine 20.10+; Docker Desktop has this
    # built in, native Linux Engine needs it declared explicitly). This is
    # what makes single-host testing/development work: this project and
    # siem are two INDEPENDENT compose
    # projects with no shared network, by design (see README's two-host
    # split note) -- but the SIEM's vector_inbound aggregator already publishes its
    # port to 0.0.0.0 on the host, so setting VECTOR_HOST=host.docker.internal
    # (instead of the real remote SIEM VM's IP) reaches it without needing
    # any change to the SIEM stack's own network topology or joining the
    # two projects onto a shared network. Harmless in the real two-host
    # deployment: VECTOR_HOST there is still the real remote IP, and an
    # unused DNS alias doesn't affect anything.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: --config /etc/vector/vector.yaml
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Enhanced reverse proxy with Lua-based honeynet routing
  # ---------------------------------------------------------------------------
  # Waits for ALL three honeypot pool instances to be healthy before accepting
  # traffic so that pool_router.lua never routes to a pool that is still starting.
  # ---------------------------------------------------------------------------
  reverse_proxy:
    logging: *default-logging
    build:
      context: ./reverse_proxy_enhanced
      dockerfile: Dockerfile
    depends_on:
      # Single-eshop topology: there is only production_eshop now. It serves
      # both production and honeypot traffic, switching database per request
      # via wp-content/db.php based on the X-Honeypot-Backend header this proxy
      # sets. There are no honeypot_eshop_N backends to wait on any more.
      production_eshop:
        condition: service_healthy
      session_store:
        condition: service_healthy
      # suricata_ids is optional - it can run but doesn't block other services
      # suricata_ids:
      #   condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse_proxy_enhanced:/etc/nginx
      # db_proxy/ overrides: no pool upstreams, X-Honeypot-Backend header,
      # no pool health checks / pre-warming.
      - ./db_proxy/reverse_proxy_enhanced/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./db_proxy/reverse_proxy_enhanced/proxy_params:/etc/nginx/proxy_params:ro
      - ./db_proxy/reverse_proxy_enhanced/lua/health_check.lua:/etc/nginx/lua/health_check.lua:ro
      - ./db_proxy/reverse_proxy_enhanced/lua/init_worker.lua:/etc/nginx/lua/init_worker.lua:ro
      - ./ssl_certificates:/etc/ssl/certs:ro
      - ./nginx_logs:/var/log/nginx
      # Read access to Suricata's eve.json -- init_worker.lua's
      # parse_suricata_logs() tails this to feed threat_intel.threat_ips
      # (see suricata_rules.lua). This mount was missing entirely before:
      # the parser's io.open() silently returned nil every 30s (no log
      # line either way, since a genuinely-absent file and "nothing new to
      # process" look the same to that code path) -- Suricata alerts have
      # never actually reached router.lua's IP-reputation gate, regardless
      # of the eve.json-vs-fast.log parsing format. suricata_ids is not a
      # hard startup dependency (commented out above) so this may not
      # exist for the first few seconds after a fresh `docker compose up`;
      # parse_suricata_logs() already tolerates that (io.open returns nil,
      # skipped, tried again next timer tick).
      - ./suricata_logs:/var/log/suricata:ro
    networks:
      - production_network
      - honeypot_network
      - session_network
      - monitoring_network
      - ids_network
    # On honeypot_network and the stack's other networks: never a router
    # between them (Docker leaves ip_forward on in every container namespace).
    sysctls:
      net.ipv4.ip_forward: 0
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ELK_ENABLED=${ELK_ENABLED:-false}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - ELASTICSEARCH_PROTOCOL=${ELASTICSEARCH_PROTOCOL:-https}
      - ELASTICSEARCH_USER=${ELASTICSEARCH_USER:-}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
      - ELASTICSEARCH_SSL_VERIFY=${ELASTICSEARCH_SSL_VERIFY:-certificate}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - ABUSEIPDB_CONFIDENCE_MINIMUM=${ABUSEIPDB_CONFIDENCE_MINIMUM:-90}
      - ABUSEIPDB_DAILY_CHECK_LIMIT=${ABUSEIPDB_DAILY_CHECK_LIMIT:-1000}
      - ABUSEIPDB_BLACKLIST_ENABLED=${ABUSEIPDB_BLACKLIST_ENABLED:-false}
      - ABUSEIPDB_BLACKLIST_REFRESH_HOURS=${ABUSEIPDB_BLACKLIST_REFRESH_HOURS:-24}
      - INTERNAL_TEST_SECRET=${INTERNAL_TEST_SECRET:-}
      # Signed session cookie + session recovery (lua/session_identity_rules.lua).
      - SESSION_SIGNING_KEY=${SESSION_SIGNING_KEY:-}
      - SESSION_RECOVERY_USES_IP=${SESSION_RECOVERY_USES_IP:-true}
      - SESSION_RECOVERY_WINDOW=${SESSION_RECOVERY_WINDOW:-900}
      - IP_REPUTATION_CAP=${IP_REPUTATION_CAP:-10}
      - SHARED_IP_SESSIONS=${SHARED_IP_SESSIONS:-2}
      - SHARED_IP_WINDOW=${SHARED_IP_WINDOW:-3600}
      # Threat decay: set THREAT_DECAY_ENABLED=false to make session/IP threat
      # scores persist indefinitely (no decay); half-life tunes the fade rate.
      - THREAT_DECAY_ENABLED=${THREAT_DECAY_ENABLED:-true}
      - SCORE_DECAY_HALF_LIFE_SECONDS=${SCORE_DECAY_HALF_LIFE_SECONDS:-300}
      # Request body guard (PHP2Shell interim layer): enforce | observe | off
      - BODY_GUARD_MODE=${BODY_GUARD_MODE:-enforce}
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s

  # ---------------------------------------------------------------------------
  # log_capper -- hard cap on FILE logs so no single log can fill the disk.
  # ---------------------------------------------------------------------------
  # The x-logging json-file limits above only bound each container's STDOUT
  # log. Logs written to FILES in the bind-mounted log dirs -- Suricata's
  # eve.json/fast.log, nginx's access/security/error.log, Vector's own logs --
  # are NOT covered by that, and a runaway 20 GB eve.json is exactly what
  # filled the disk. This tiny sidecar truncates any *.log/*.json under the
  # mounted log dirs that grows past LOG_CAP_MB, every LOG_CAP_INTERVAL
  # seconds, IN PLACE (`: > file`) so the writer's open fd keeps working.
  # Recent history is still shipped to Elasticsearch by Vector, so truncating
  # the local copy loses nothing important.
  log_capper:
    # tini as PID 1: it forwards SIGTERM. Without it the process (a shell
    # loop / bash script / Python with no SIGTERM handler) ignored the
    # signal as PID 1 and `down` killed it after the 10 s stop timeout.
    init: true
    image: alpine:3.24.3
    container_name: log_capper
    restart: unless-stopped
    logging: *default-logging
    environment:
      LOG_CAP_MB: "50"
      LOG_CAP_INTERVAL: "20"
    volumes:
      - ./suricata_logs:/logs/suricata
      - ./nginx_logs:/logs/nginx
      - ./vector/logs:/logs/vector
    command:
      - sh
      - -c
      - |
        cap_kb=$$(( $${LOG_CAP_MB} * 1024 ))
        echo "log_capper: capping *.log/*.json over $${LOG_CAP_MB}MB (>$${cap_kb}k) every $${LOG_CAP_INTERVAL}s under /logs"
        while true; do
          find /logs -type f \( -name '*.log' -o -name '*.json' \) -size +$${cap_kb}k 2>/dev/null | while IFS= read -r f; do
            : > "$$f" && echo "log_capper: truncated $$f (exceeded $${LOG_CAP_MB}MB)"
          done
          sleep "$${LOG_CAP_INTERVAL}"
        done
    networks:
      - monitoring_network

networks:
  production_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  # internal: no route off the host and no DNS forwarding for outside names
  # (so no DNS tunnelling either) -- a compromised pool cannot reach the
  # internet whatever its firewall says. The host's gateway address stays
  # reachable on an internal network; the honeypot firewall profile blocks it.
  honeypot_network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24
  monitoring_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
  session_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
  ids_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/24

volumes:
  # The Container Firewall rulesets (one file per profile), shared by every
  # *_net firewall container and pool_manager's runtime pool firewalls.
  container_firewall_rules:
    driver: local
  # production_mysql_data: named volume for the production MySQL instance.
  # Populated by init_setup from ./production_database_data (vmhgfs, read-only).
  # Using a named volume (not a bind mount) so that MySQL's chown on startup
  # succeeds – vmhgfs does not support chown and MySQL 5.7's entrypoint requires it.
  production_mysql_data:
    driver: local
  # Pool 1 database data (named volume, populated by init_setup)
  honeypot_database_proxy_data:
    driver: local
  redis_data:
    driver: local
  suricata_logs:
    driver: local
  nginx_logs:
    driver: local
  ssl_certificates:
    driver: local
  # Backup archives written by backup_service – production data only.
  # The directory is bind-mounted (not a named volume) so backups survive
  # 'docker compose down -v' and are accessible directly on the host filesystem.