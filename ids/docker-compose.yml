  # Each database lives in the network namespace of its own firewall,
  # honeypot_database_N_net (x-container-firewall, profile honeypot_database):
  # MySQL in from honeypot_network, nothing out. Since a pool's database is
  # as attacker-reachable as its WordPress, it is as much a dead end.
