    <<: *container-firewall
    environment:
      - FIREWALL_PROFILE=honeypot_database
      - FIREWALL_LAYER=default
    networks:
      honeypot_network:
        aliases: [honeypot_database_1]

  # Pool 1 – uses the original honeypot_database_data directory (backward compat)
