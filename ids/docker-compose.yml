name: honeypot-ids-system-v1
# Cap every container's json-file log so a runaway stdout log can't fill
# the disk (see also suricata.yaml + the log_capper sidecar for FILE logs).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The network namespace owner of a WordPress container, holding its iptables
# ruleset (images/container_firewall/container-firewall.php). The WordPress
# container joins it (network_mode: service:<name>_net), so every packet it
# sends or receives passes these rules, while WordPress itself gets no
# NET_ADMIN, no iptables binary, and no view of this container's processes
# or files: root inside WordPress cannot change the rules. The networks and
# the DNS name (alias) the edge connects to live here, on the firewall.
# The dashboard's Container Firewall page edits the rulesets (one per
# profile, in container_firewall_rules); every firewall re-reads its file,
# and re-resolves its peers, every 5 s.
# If this container restarts, its WordPress container is left with loopback
# only (fail closed) until recreated; compose does that for its own restarts
# (depends_on restart: true). It runs nothing but the rule loop.
x-container-firewall: &container-firewall
  logging: *default-logging
  image: presshaven/container-firewall:1
  pull_policy: never
  init: true
  restart: unless-stopped
  volumes:
    - container_firewall_rules:/var/lib/container-firewall
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - NET_ADMIN   # this network namespace's own iptables, nothing else
  read_only: true
  tmpfs:
    - /run
  mem_limit: 64m
  cpus: "0.25"
  pids_limit: 50
  healthcheck:
    test: ["CMD", "container-firewall", "health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
    start_interval: 1s

services:
  # ---------------------------------------------------------------------------
  # Initialization service
  # ---------------------------------------------------------------------------
  # Copies production WordPress files and database data into each of the three
  # honeypot pool directories, then generates self-signed SSL certificates.
  #
  # POOLING NOTE:
  #   Pool 1 reuses the original honeypot_eshop_files / honeypot_database_data
  #   directories for backward compatibility.  Pools 2 and 3 use new sibling
  #   directories (honeypot_eshop_files_2/3, honeypot_database_data_2/3).
  #   All three pools start from an identical copy of the production data; they
  #   diverge as individual users interact with their assigned instance.
  # ---------------------------------------------------------------------------
  init_setup:
    logging: *default-logging
    # alpine + rsync/openssl, built once (see images/init_setup/Dockerfile)
    # rather than `apk add`ed at the top of the command on every boot.
    build: ./images/init_setup
    # Its memory is almost all page cache: on a first boot rsync writes the
    # ~550 MB WordPress tree into all three pools, and the kernel charged all
    # of it to this container (measured 1.8-2.3 GB peak). A cap makes the
    # kernel write it back and reclaim it as it goes; measured the same
    # ~19 s copy time at 256m, and rsync's own memory is a few MB.
    mem_limit: 256m
    volumes:
      - ./production_eshop_files:/source_files:ro
      - ./production_database_data:/source_db:ro
      # Pool 1 destinations (original paths kept for backward compat)
      - honeypot_eshop_files:/dest_files_1
      - honeypot_database_data:/dest_db_1
      # Pool 2 destinations
      - honeypot_eshop_files_2:/dest_files_2
      - honeypot_database_data_2:/dest_db_2
      # Pool 3 destinations
      - honeypot_eshop_files_3:/dest_files_3
      - honeypot_database_data_3:/dest_db_3
      # Production DB destination (named volume to avoid vmhgfs chown restriction)
      - production_mysql_data:/dest_prod_db
      - ./ssl_certificates:/ssl_certs
    command: |
      sh -c "
      set -x
      echo 'Starting initialization setup (honeynet pool mode)...'

      # -----------------------------------------------------------------------
      # Helper: idempotently SYNC source code files into a destination
      # directory. Runs on EVERY \`docker compose up\`, not just first
      # provisioning -- this is what keeps honeypot pool volumes from
      # silently drifting from production_eshop_files/ when files are
      # added/changed after the pools were first created (previously this
      # used a one-shot copy_files() that skipped entirely once the
      # destination had any content at all, so post-provisioning additions
      # -- e.g. a new theme or mu-plugin -- never propagated and had to be
      # \`docker cp\`'d in by hand).
      #
      # rsync -a with no --delete: this is a one-directional add/update from
      # source, not a mirror. Anything that exists ONLY in the destination
      # (adversary-uploaded webshells under wp-content/uploads, other
      # honeypot-side forensic artifacts left by a real session) is
      # deliberately left untouched -- syncing new production files must
      # never destroy evidence of what a user did to a pool.
      # -----------------------------------------------------------------------
      sync_files() {
        SRC=\$$1; DST=\$$2; LABEL=\$$3
        if [ -d \"\$$SRC\" ] && [ -n \"\$$(find \$$SRC -mindepth 1 -maxdepth 1 2>/dev/null)\" ]; then
          echo \"Syncing \$$LABEL into \$$DST...\"
          rsync -a \"\$$SRC/\" \"\$$DST/\" || echo \"  Warning: rsync for \$$LABEL returned non-zero\"
          echo \"  Done: \$$LABEL\"
        else
          echo \"  Source \$$SRC empty or absent – skipping \$$LABEL\"
        fi
      }

      # -----------------------------------------------------------------------
      # Helper: copy source data into a destination directory ONCE, skipping
      # entirely if the destination is already populated. Used ONLY for
      # stateful database data directories, where re-syncing on every startup
      # would overwrite live, mutable database state (including a pool's own
      # divergent history) -- unlike code files, an always-resync policy is
      # actively wrong here, not just unnecessary.
      # -----------------------------------------------------------------------
      copy_files() {
        SRC=\$$1; DST=\$$2; LABEL=\$$3
        if [ -d \"\$$SRC\" ] && [ -n \"\$$(find \$$SRC -mindepth 1 -maxdepth 1 2>/dev/null)\" ]; then
          if [ -n \"\$$(find \$$DST -mindepth 1 -maxdepth 1 2>/dev/null)\" ]; then
            echo \"  Destination \$$DST already populated – skipping \$$LABEL copy\"
          else
            echo \"Copying \$$LABEL files to \$$DST...\"
            find \"\$$DST\" -mindepth 1 -delete 2>/dev/null || true
            tar -C \"\$$SRC\" -cf - . | tar -C \"\$$DST\" -xf - 2>/dev/null || echo \"  Warning: tar copy for \$$LABEL returned non-zero\"
            echo \"  Done: \$$LABEL\"
          fi
        else
          echo \"  Source \$$SRC empty or absent – skipping \$$LABEL\"
        fi
      }

      # -----------------------------------------------------------------------
      # Sync WordPress files for each pool instance.
      # After syncing, remove production-hardening.php from every honeypot
      # destination.  That mu-plugin disables XML-RPC, strips version strings,
      # and closes other attack vectors on the production instance.  Honeypot
      # instances MUST NOT have it: users need to see realistic fingerprints
      # and reach the intentionally vulnerable endpoints (including xmlrpc.php).
      # Since sync_files() re-copies from source every run, this rm -f must
      # also run every time (a prior run's removal doesn't stick otherwise).
      #
      # The three pools are synced in PARALLEL (& + wait): each rsync is
      # dominated by per-file stat() latency over a ~38k-file tree, not
      # bandwidth, and all three read the same source (hot in page cache
      # after the first), so running them concurrently cuts this step to
      # roughly the time of one -- and this step gates every other service.
      # -----------------------------------------------------------------------
      for N in 1 2 3; do
        (
          sync_files /source_files /dest_files_\$$N \"honeypot pool-\$$N WordPress files\"
          rm -f /dest_files_\$$N/wp-content/mu-plugins/production-hardening.php
          echo \"  Removed production-hardening.php from pool-\$$N (honeypot retains attack surface)\"
          # rsync never deletes, so files retired from production_eshop_files/
          # would live on in the pools. Remove them explicitly. These two
          # (SQL-proxy leftovers) named the production/honeypot split.
          rm -f /dest_files_\$$N/wp-content/sql-routing.log /dest_files_\$$N/wp-content/db.php.backup
        ) &
      done
      wait

      # -----------------------------------------------------------------------
      # Copy database data directory for each pool instance, ONCE (see
      # copy_files above). Each pool gets its own isolated MySQL data
      # directory so that user writes to one pool's database do not
      # affect the others. Also copy to production_mysql_data (named volume)
      # so that the production MySQL container can own it – vmhgfs bind
      # mounts reject chown at runtime.
      # Parallel for the same reason as the file sync above (only does real
      # work on first provisioning; a no-op check otherwise).
      # -----------------------------------------------------------------------
      copy_files /source_db /dest_prod_db 'production database data' &
      copy_files /source_db /dest_db_1 'honeypot pool-1 database data' &
      copy_files /source_db /dest_db_2 'honeypot pool-2 database data' &
      copy_files /source_db /dest_db_3 'honeypot pool-3 database data' &
      wait

      # -----------------------------------------------------------------------
      # Generate self-signed SSL certificates (shared across all services)
      # -----------------------------------------------------------------------
      echo 'Generating SSL certificates...'

      # Subject is deliberately bare (CN only): the old O=HoneypotOrg
      # gave the deception away to the blind pentest. Existing certs are
      # kept, so delete ssl_certificates/server.* (or use the dashboard
      # Certificates page) to pick this up. Keep in sync with
      # _gen_edge_nginx_cert() in dashboard/core/cert_ctl.py.
      #
      # One line on purpose: compose splits this string into argv itself,
      # and inside the double quotes it keeps the newline after a trailing
      # backslash, so a continued command ran as three separate ones and
      # server.crt was never written (reverse_proxy then exits on a fresh
      # checkout).
      if [ ! -f '/ssl_certs/server.crt' ] || [ ! -f '/ssl_certs/server.key' ]; then
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /ssl_certs/server.key -out /ssl_certs/server.crt -subj '/CN=localhost'
        chmod 600 /ssl_certs/server.key
        chmod 644 /ssl_certs/server.crt
        echo 'SSL certificates generated successfully'
      else
        echo 'SSL certificates already exist, skipping generation'
      fi

      echo 'Initialization setup completed successfully'
      set +x
      "

  # ---------------------------------------------------------------------------
  # Database migration applier for honeypot pools
  # ---------------------------------------------------------------------------
  # Applies every SQL file in honeypot_database_migrations/ (in lexicographic
  # order) to ALL three pool databases.  Running migrations on all pools ensures
  # they stay schema-identical so pool_router.lua can assign any IP to any pool
  # without compatibility issues.
  #
  # Migration files included:
  #   01_clean-honeypot-data.sql  – replaces real data with dummy data
  #   02_pool_tracking.sql        – creates honeynet pooling metadata tables
  # ---------------------------------------------------------------------------
  honeypot_db_migration:
    logging: *default-logging
    image: mysql:8.4.13
    depends_on:
      init_setup:
        condition: service_completed_successfully
      honeypot_database_1:
        condition: service_healthy
      honeypot_database_2:
        condition: service_healthy
      honeypot_database_3:
        condition: service_healthy
    volumes:
      - ./honeypot_database_migrations:/migrations:ro
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD_POOL_1=${MYSQL_PASSWORD_POOL_1}
      - MYSQL_PASSWORD_POOL_2=${MYSQL_PASSWORD_POOL_2}
      - MYSQL_PASSWORD_POOL_3=${MYSQL_PASSWORD_POOL_3}
    command: |
      bash -c "
      # -----------------------------------------------------------------------
      # Helper: block until a host's MySQL server actually accepts a
      # connection over TCP, not just until Docker reports its healthcheck
      # as healthy -- confirmed live that right after init_setup's tar copy
      # of a large data directory, mysqld can still be mid crash-recovery/
      # InnoDB startup for a few seconds after \`mysqladmin ping\` over the
      # local socket (the healthcheck) starts succeeding, especially under
      # the extra load of multiple pools starting at once. This replaces a
      # blind 'sleep 5', which was too short under that load and produced
      # 'ERROR 2003: Can't connect to MySQL server ... (111)' (errno 111 =
      # ECONNREFUSED) bursts below.
      #
      # Probes with \`mysqladmin ping\` over TCP using real credentials, NOT
      # a raw TCP connect (bash's /dev/tcp) as before -- confirmed live
      # that a connect-then-close with no MySQL handshake makes mysqld log
      # '[Note] Got an error reading communication packets' on every
      # probe, one per pool per boot. An 'Access denied' answer also proves
      # the server is up and is left for apply_migrations to report; only a
      # failed connect (ECONNREFUSED / server still starting) keeps waiting.
      # -----------------------------------------------------------------------
      db_ready() {
        HOST=\$$1
        shift
        OUT=\$$(mysqladmin ping -h\"\$$HOST\" -u\"\$$MYSQL_USER\" -p\"\$$2\" 2>&1)
        case \"\$$OUT\" in
          *'mysqld is alive'*|*'Access denied'*) return 0 ;;
          *) return 1 ;;
        esac
      }

      wait_for_db() {
        HOST=\$$1
        shift
        TRIES=0
        MAX_TRIES=30
        until db_ready \"\$$HOST\" \"\$$@\"; do
          TRIES=\$$((TRIES + 1))
          if [ \"\$$TRIES\" -ge \"\$$MAX_TRIES\" ]; then
            echo \"  WARNING: \$$HOST:3306 still not accepting connections after \$$((MAX_TRIES * 2))s -- proceeding anyway\"
            return 1
          fi
          sleep 2
        done
        if [ \"\$$TRIES\" -gt 0 ]; then
          echo \"  \$$HOST:3306 is accepting connections (after \$$((TRIES * 2))s)\"
        fi
      }

      echo 'Waiting for all honeypot pool databases to actually accept connections...'
      wait_for_db honeypot_database_1 \"\$$MYSQL_PASSWORD_POOL_1\"
      wait_for_db honeypot_database_2 \"\$$MYSQL_PASSWORD_POOL_2\"
      wait_for_db honeypot_database_3 \"\$$MYSQL_PASSWORD_POOL_3\"

      # Each pool database has its OWN user password (and root password)
      # from its own environment: its data directory starts as a copy of
      # production's, but mysql_credentials_entrypoint.sh resets the accounts
      # to the pool's values on every start, so no pool shares a credential
      # with production or with another pool -- and this job needs nothing
      # but the three pool passwords (see test_pool_isolation.sh).

      # -----------------------------------------------------------------------
      # Helper: apply all migrations to a single database host. Each pool has
      # its own DB password (see above), so the password to
      # use is passed in per call, not read from a single shared MYSQL_PASSWORD.
      # Sets MIGRATION_FAILED=1 if any migration OTHER than
      # 01_clean-honeypot-data.sql fails, so the script exits 1 at the end
      # and Docker marks the service as failed (dependent services --
      # honeypot_eshop_N -- then never start on an incomplete schema).
      # 01_clean-honeypot-data.sql's own header already documents its
      # DELETEs as expected to fail with 'table doesn't exist' on a
      # freshly-copied pool -- that pool's wp_* tables don't exist yet at
      # this point (honeypot_db_seed_N's \`wp core install\` runs AFTER this
      # service, see its depends_on comment below), so this is the ONE
      # migration file that's genuinely best-effort, not a real failure.
      # -----------------------------------------------------------------------
      MIGRATION_FAILED=0

      apply_migrations() {
        HOST=\$$1
        PASS=\$$2
        echo \"\"
        echo \"=== Applying migrations to \$$HOST ===\"

        if [ -d '/migrations' ] && [ -n \"\$$(find /migrations -name '*.sql' -type f)\" ]; then
          for migration in \$$(ls /migrations/*.sql | sort); do
            if [ -f \"\$$migration\" ]; then
              echo \"  Applying: \$$migration\"
              if [ \"\$$(basename \"\$$migration\")\" = '01_clean-honeypot-data.sql' ]; then
                mysql --local-infile=0 -h\"\$$HOST\" -u\"\$$MYSQL_USER\" -p\"\$$PASS\" \"\$$MYSQL_DATABASE\" --force < \"\$$migration\" 2>/dev/null
                echo \"  [OK] \$$migration applied to \$$HOST (best-effort -- table-not-found errors here are expected on a fresh pool, silenced)\"
              elif mysql --local-infile=0 -h\"\$$HOST\" -u\"\$$MYSQL_USER\" -p\"\$$PASS\" \"\$$MYSQL_DATABASE\" --force < \"\$$migration\"; then
                echo \"  [OK] \$$migration applied to \$$HOST\"
              else
                echo \"  [FAILED] \$$migration failed on \$$HOST\"
                MIGRATION_FAILED=1
              fi
            fi
          done
          echo \"=== All migrations applied to \$$HOST ===\"
        else
          echo \"  No migrations found in /migrations – skipping \$$HOST\"
        fi
      }

      # Apply to every pool database in turn, each with its own password.
      apply_migrations honeypot_database_1 \"\$$MYSQL_PASSWORD_POOL_1\"
      apply_migrations honeypot_database_2 \"\$$MYSQL_PASSWORD_POOL_2\"
      apply_migrations honeypot_database_3 \"\$$MYSQL_PASSWORD_POOL_3\"

      if [ \"\$$MIGRATION_FAILED\" = '1' ]; then
        echo ''
        echo 'FATAL: one or more honeypot pool database migrations failed -- see [FAILED] lines above.'
        exit 1
      fi

      echo ''
      echo 'All honeypot pool database migrations completed successfully.'
      "
    networks:
      - honeypot_network

  # ---------------------------------------------------------------------------
  # Honeypot content replication (periodic production -> honeypot pool sync)
  # ---------------------------------------------------------------------------
  # Long-running loop (see scripts/replicate_content_to_honeypot.sh) that
  # keeps each honeypot pool's pages/posts/products in sync with production
  # every REPLICATION_INTERVAL_SECONDS, so a pool never silently goes stale
  # after its one-time initial seed (init_setup/honeypot_db_migration above).
  # Strict allow-list of content tables only -- never touches wp_users or any
  # WooCommerce order/customer/payment table; see the script's header comment
  # for the full non-destructive apply strategy and the pattern-gating
  # coordination with pool_router.lua's is_pool_healthy().
  #
  # Built from mysql:8.4 purely for its mysql/mysqldump client tools (same
  # image family as every other DB-touching service here); it never runs
  # mysqld itself. redis-cli isn't present on that image, so
  # images/content_sync/Dockerfile adds it once at build time; it's used to
  # set/clear the honeypot_pool_replicating:<N> flag pool_router.lua's
  # failover consults.
  # ---------------------------------------------------------------------------
  honeypot_content_sync:
    # tini as PID 1: it forwards SIGTERM. Without it the process (a shell
    # loop / bash script / Python with no SIGTERM handler) ignored the
    # signal as PID 1 and `down` killed it after the 10 s stop timeout.
    init: true
    logging: *default-logging
    build: ./images/content_sync
    depends_on:
      honeypot_db_migration:
        condition: service_completed_successfully
      session_store:
        condition: service_healthy
      # Without this, this service's very first sync_cycle (it runs one
      # immediately on startup, not just on the REPLICATION_INTERVAL_SECONDS
      # timer) can race production_db_seed on a fresh `docker compose up`:
      # production_database would still be schemaless/empty at that
      # instant, so build_sync_sql() correctly takes its "production has
      # no content yet -- skipping this cycle" early-return (see
      # scripts/replicate_content_to_honeypot.sh) -- but that means the
      # honeypot pools would then sit on stale/no content for a full
      # REPLICATION_INTERVAL_SECONDS (default 300s) before the next cycle
      # picks up what production_db_seed just created. Waiting on this
      # completing first means the FIRST cycle already sees the real seeded
      # catalog, not an empty one. Same reasoning applies to each honeypot
      # pool's OWN schema (honeypot_database_1/2/3 never had wp_* tables
      # either, confirmed live -- only the pool_router bookkeeping ones) --
      # this service's replication is a scoped DELETE/INSERT into EXISTING
      # tables, never schema creation, so without honeypot_db_seed_1/2/3
      # having run first, every cycle would fail against all three pools
      # regardless of production's own state.
      production_db_seed:
        condition: service_completed_successfully
      honeypot_db_seed_1:
        condition: service_completed_successfully
      honeypot_db_seed_2:
        condition: service_completed_successfully
      honeypot_db_seed_3:
        condition: service_completed_successfully
    volumes:
      - ./scripts/replicate_content_to_honeypot.sh:/replicate_content_to_honeypot.sh:ro
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_PASSWORD_POOL_1=${MYSQL_PASSWORD_POOL_1}
      - MYSQL_PASSWORD_POOL_2=${MYSQL_PASSWORD_POOL_2}
      - MYSQL_PASSWORD_POOL_3=${MYSQL_PASSWORD_POOL_3}
      - REDIS_HOST=session_store
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REPLICATION_INTERVAL_SECONDS=${REPLICATION_INTERVAL_SECONDS:-300}
    command: ["bash", "/replicate_content_to_honeypot.sh"]
    restart: unless-stopped
    networks:
      - production_network
      - honeypot_network
      - session_network
    # On honeypot_network and the stack's other networks: never a router
    # between them (Docker leaves ip_forward on in every container namespace).
    sysctls:
      net.ipv4.ip_forward: 0

  # ---------------------------------------------------------------------------
  # Honeypot pool manager (one user per pool, spare pool always ready)
  # ---------------------------------------------------------------------------
  # pool_router.lua gives each new user IP a free ready pool exclusively and
  # queues a wake-up on Redis; this service then builds an additional
  # honeypot_eshop_N + honeypot_database_N pair (N > 3) through the Docker API,
  # so one is waiting for the next user. Pools 1-3 above are only adopted.
  # Containers it creates carry no compose labels, so `up --remove-orphans`
  # leaves them alone (they are found by their `honeypot.pool` label).
  #
  # SECURITY: mounts the Docker socket, which is root-equivalent on the host.
  # It publishes no ports and joins only session_network (Redis); it never
  # handles user traffic. Remove this service to run a fixed 3-pool setup
  # (the router then reuses the 3 pools round-robin).
  # ---------------------------------------------------------------------------
  pool_manager:
    # tini as PID 1: it forwards SIGTERM. Without it the process (a shell
    # loop / bash script / Python with no SIGTERM handler) ignored the
    # signal as PID 1 and `down` killed it after the 10 s stop timeout.
    init: true
    logging: *default-logging
    build: ./images/pool_manager
    depends_on:
      init_setup:
        condition: service_completed_successfully
      session_store:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./production_eshop_files:/source_files:ro
      - ./production_database_data:/source_db:ro
      - ./honeypot_database_migrations:/migrations:ro
      - ./scripts:/scripts:ro
    environment:
      - COMPOSE_PROJECT=honeypot-ids-system-v1
      - REDIS_HOST=session_store
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Production's password: the clone / content-sync helpers read
      # production with it. No root password: every pool database gets its
      # own random one, and no pool its user password from this.
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - WP_ADMIN_USER=${WP_ADMIN_USER:-admin}
      # Runtime pools are decoys: their admin gets this password, not production's
      # (which pool_manager therefore isn't given at all).
      - HONEYPOT_WP_ADMIN_PASSWORD=${HONEYPOT_WP_ADMIN_PASSWORD:-change_this_honeypot_wp_admin_password}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL:-admin@example.com}
      - WP_SITE_URL=${WP_SITE_URL:-http://localhost}
      - WP_SITE_TITLE=${WP_SITE_TITLE:-Fernhill Coffee Roasters}
      - STRIPE_TEST_PUBLISHABLE_KEY=${STRIPE_TEST_PUBLISHABLE_KEY:-}
      - STRIPE_TEST_SECRET_KEY=${STRIPE_TEST_SECRET_KEY:-}
      # Unowned pools kept ready, and the hard ceiling on total pools.
      - POOL_SPARES=${POOL_SPARES:-1}
      - POOL_MAX=${POOL_MAX:-10}
      # Resource budget for all pools together (by their containers' limits);
      # pools are built per user session until it is reached, then new
      # sessions share the ready pools round-robin. 0 = no budget.
      - POOL_MAX_MEMORY_MB=${POOL_MAX_MEMORY_MB:-12288}
      - POOL_MAX_CPUS=${POOL_MAX_CPUS:-12}
      - POOL_PARALLEL_BUILDS=${POOL_PARALLEL_BUILDS:-2}
      # What the budget charges per pool (empty = the containers' limits) and
      # how recently a waiting session must have sent a request to get the
      # next pool built for it.
      - POOL_RESERVE_MEM_MB=${POOL_RESERVE_MEM_MB:-}
      - POOL_RESERVE_CPUS=${POOL_RESERVE_CPUS:-}
      - POOL_WAITING_ACTIVE_SECONDS=${POOL_WAITING_ACTIVE_SECONDS:-60}
      # Fast clone: skip re-applying storefront config on a runtime pool that
      # cloned the already-configured production DB (~50s/pool saved). Opt-in.
      - POOL_FAST_CLONE=${POOL_FAST_CLONE:-0}
      # Scale down: pools no request has reached for this long are removed
      # (runtime ones) or freed (compose-declared ones). 0 = never, minimum 600.
      - POOL_IDLE_TIMEOUT_SECONDS=${POOL_IDLE_TIMEOUT_SECONDS:-1800}
      # Host limits for building another pool; below them the router reuses the
      # existing pools round-robin. Empty = the built-in default.
      - POOL_MIN_FREE_MEM_MB=${POOL_MIN_FREE_MEM_MB:-2560}
      - POOL_MAX_LOAD_PER_CPU=${POOL_MAX_LOAD_PER_CPU:-1.5}
      - POOL_MIN_FREE_DISK_GB=${POOL_MIN_FREE_DISK_GB:-5}
      - POOL_RECYCLE_IDLE=${POOL_RECYCLE_IDLE:-1}
    restart: unless-stopped
    networks:
      - session_network

  # Production WordPress database
  # ---------------------------------------------------------------------------
  # MySQL 8.4 LTS (upgraded in place from 5.7 via 8.0, 2026-10). Every server
  # here runs with mysql_native_password enabled and as the default for new
  # users: the MariaDB-based clients in wordpress:cli and backup_service
  # (Alpine mysql-client) ship no caching_sha2_password plugin, so with 8.4's
  # default they can't log in at all (confirmed against mysql:8.4.13: "Plugin
  # caching_sha2_password could not be loaded"). 8.4 is the last series with
  # native auth; moving off it means giving those clients the plugin first.
  # ---------------------------------------------------------------------------
  production_database:
    logging: *default-logging
    image: mysql:8.4.13
    depends_on:
      init_setup:
        condition: service_completed_successfully
    # The wrapper makes root@localhost and MYSQL_USER follow the passwords
    # below on every start and drops root@'%' (scripts/
    # mysql_credentials_entrypoint.sh) -- a copied data dir or a rotated
    # .env can't leave stale or shared credentials behind.
    command: ["bash", "/mysql_credentials_entrypoint.sh", "mysqld", "--mysql-native-password=ON", "--authentication-policy=mysql_native_password"]
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=localhost
    volumes:
      - ./scripts/mysql_credentials_entrypoint.sh:/mysql_credentials_entrypoint.sh:ro
      # Named volume avoids vmhgfs chown restriction; populated by init_setup.
      - production_mysql_data:/var/lib/mysql
    networks:
      - production_network
    # Same hardening as the honeypot pool databases (see honeypot_database_1),
    # which run this exact image and command: no-new-privileges, every
    # capability dropped but the ones mysqld's entrypoint needs to own its
    # data dir and drop to the mysql user, and limits so a runaway query
    # cannot starve the host. More memory than a pool: the real shop's data.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_NICE
    mem_limit: 1024m
    cpus: "1.0"
    pids_limit: 300
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]  # TCP, NOT the local socket: "healthy" must mean the NETWORKED server accepts connections. A `-h localhost` socket ping also answers the official image's temporary --skip-networking bootstrap server, so it goes green before TCP is up and releases service_healthy dependents (e.g. production_db_seed) too early -- they then fail to connect over TCP and exit. 127.0.0.1 forces TCP. Still no credentials: "alive" (exit 0) even on access denied, and no password in `docker inspect`
      interval: 30s
      timeout: 5s
      retries: 5
      # 420s, not 30s: only matters on a genuinely empty volume -- confirmed
      # live that mysqld's first-ever bootstrap (InnoDB init + SSL cert
      # generation) can take ~90s for ONE database in isolation, but this
      # container never actually starts alone: a purge + `docker compose
      # up` always bootstraps all 4 databases (this one + all 3 honeypot
      # pools) from scratch AT THE SAME TIME, and confirmed live that the
      # resulting I/O contention is severe enough to matter, not just
      # theoretical -- InnoDB's own page_cleaner logged "1000ms intended
      # loop took 40733ms" during a real 4-way-concurrent fresh init.
      # 240s was already one bump up from an original 30s for the
      # single-instance case (see the old note this replaced); confirmed
      # live even 240s wasn't always enough for the real 4-way-concurrent
      # case -- `docker compose up` gave up calling this container
      # "unhealthy" and aborted the whole dependency chain (every
      # container downstream of it left stuck in `created`, never
      # started) while it was still genuinely mid-bootstrap, not actually
      # broken. Failures during start_period don't count as "unhealthy",
      # they just don't count as healthy yet -- so this costs nothing on
      # a warm restart (which passes on the first check regardless).
      start_period: 420s
      # Probe every 1s (not every `interval`) until the FIRST success
      # during start_period, then fall back to `interval`. Without this
      # the first check only runs a full `interval` after start, so every
      # service_healthy dependent waited up to 10s (DBs) / 30s (eshops)
      # after the service was already up. Same on every healthcheck in
      # this file. Needs Docker Engine 25+.
      start_interval: 1s

  production_eshop_net:
    <<: *container-firewall
    # Built here only (the honeypot pools and pool_manager's runtime
    # pools reuse the tag); never pulled.
    build: ./images/container_firewall
    pull_policy: build
    environment:
      - FIREWALL_PROFILE=production
      - FIREWALL_LAYER=default
    networks:
      production_network:
        aliases: [production_eshop]

  # Production WordPress instance (clean, secure)
  production_eshop:
    logging: *default-logging
    # Same WordPress 6.8.3 / PHP 8.1.33, plus interim PHP2Shell mitigations
    # (see images/wordpress_hardened/Dockerfile). Built here only: the
    # honeypot pools and pool_manager's runtime pools reuse this local tag.
    # pull_policy build: the tag must never be pulled from Docker Hub, where
    # anyone can publish under that name.
    image: presshaven/wordpress:7.1.3-php8.4-hardened
    build: ./images/wordpress_hardened
    pull_policy: build
    depends_on:
      production_eshop_net:
        condition: service_healthy
        restart: true
      production_database:
        condition: service_healthy
      # NOT just "production_database healthy" -- mysqld being reachable
      # says nothing about whether WordPress's own schema exists yet.
      # Waiting on this completing successfully is what guarantees
      # production_eshop (and wp_install_state.lua's 30s health probe)
      # never sees a schemaless database -- see scripts/seed_wordpress_db.sh
      # and production_db_seed below for the full story (this was the root
      # cause of the recurring "Table 'production_database.wp_options'
      # doesn't exist" error).
      production_db_seed:
        condition: service_completed_successfully
    environment:
      - WORDPRESS_DB_HOST=production_database:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      # Cookie-signing keys/salts from .env. wp-config.php is in git, so it
      # carries no defaults; unset, WordPress generates its own and stores
      # them in wp_options (scrubbed from every honeypot clone).
      - WORDPRESS_AUTH_KEY=${WORDPRESS_AUTH_KEY:-}
      - WORDPRESS_SECURE_AUTH_KEY=${WORDPRESS_SECURE_AUTH_KEY:-}
      - WORDPRESS_LOGGED_IN_KEY=${WORDPRESS_LOGGED_IN_KEY:-}
      - WORDPRESS_NONCE_KEY=${WORDPRESS_NONCE_KEY:-}
      - WORDPRESS_AUTH_SALT=${WORDPRESS_AUTH_SALT:-}
      - WORDPRESS_SECURE_AUTH_SALT=${WORDPRESS_SECURE_AUTH_SALT:-}
      - WORDPRESS_LOGGED_IN_SALT=${WORDPRESS_LOGGED_IN_SALT:-}
      - WORDPRESS_NONCE_SALT=${WORDPRESS_NONCE_SALT:-}
      # No WORDPRESS_DEBUG / WORDPRESS_DEBUG_LOG: debug.log lands in the
      # webroot (wp-content/debug.log) and notices leak paths and plugin
      # versions. db.php's routing does not log through WP_DEBUG. The honeypot
      # pools keep debug on as bait.
    # ports:
    #   - "80:80" # temporary port for direct access
    volumes:
      - ./production_eshop_files:/var/www/html
    # production_network ONLY. It used to join honeypot_network and
    # monitoring_network too, which put production's PHP one hop from every
    # honeypot container -- built to be compromised -- bypassing the edge.
    # Nothing needs it: db.php's per-request routing is the db-proxy layer
    # (docker-compose.db-proxy.yml), inert here; Suricata captures on the host
    # and Vector reads container logs from the Docker socket. The edge reaches
    # production over production_network.
    # No networks of its own: it lives in production_eshop_net's network namespace,
    # which holds the networks, the DNS name and the firewall (see
    # x-container-firewall at the top).
    network_mode: service:production_eshop_net
    # -------------------------------------------------------------------------
    # Container hardening -- added this session. Every other service in this
    # compose file (honeypot_eshop_1/2/3, both database families,
    # backup_service) already had cap_drop/security_opt/resource limits;
    # production_eshop was the one exception, running with full default
    # Docker capabilities and no memory/CPU/pids ceiling at all. That's
    # backwards for a container serving real customer traffic and running a
    # large, third-party-plugin-heavy PHP application -- a compromise here
    # (a supply-chain issue in an installed plugin, a real unpatched CVE)
    # deserves the same containment as the honeypot side, and an unbounded
    # container can take down the whole host on its own even without being
    # compromised (a runaway request, a plugin bug).
    #
    # Same minimal capability set as honeypot_eshop_1 (Apache+PHP needs the
    # same things regardless of which side it's on); mem_limit/cpus set
    # higher than the honeypot pools (1024m/1.0 vs 512m/0.5) since this
    # instance is expected to carry real traffic and was already observed
    # comfortably using ~640MB unconstrained.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - KILL
    mem_limit: 1024m
    cpus: "1.0"
    pids_limit: 300
    # WordPress writes (Font Library cache under wp-content/fonts, plugin/
    # theme auto-updates, wp-content/upgrade, debug.log, etc.) all happen
    # from apache WORKER processes running as www-data, not from the
    # container's root master process -- and confirmed live via
    # /proc/<worker-pid>/status that a plain setuid() to www-data drops
    # EVERY capability (CapEff 0000000000000000), including the
    # DAC_OVERRIDE granted above. That cap_add only ever helps things the
    # root master does; it can never bypass a permission check for
    # anything PHP itself writes.
    #
    # First attempt here was `chown -R www-data:www-data /var/www/html/
    # wp-content` -- WRONG for a bind mount: that chown doesn't stay
    # inside the container, it directly reassigns the HOST files (this is
    # ./production_eshop_files, a git-tracked directory) to uid/gid 33,
    # which on THIS host resolves to the unrelated system account `http`,
    # not the host user that owns the rest of the repo -- confirmed live,
    # broke `git add`/`git status` with "Permission denied" reading those
    # files from the host side afterward.
    #
    # Fixed the other way around instead: remap the CONTAINER's www-data
    # user/group to whatever uid/gid the bind mount is ALREADY owned by
    # (read via `stat` on the mount root itself, /var/www/html, which this
    # command never touches -- only wp-content underneath it gets
    # chowned), via usermod/groupmod, before apache ever starts. Apache
    # resolves its worker identity by NAME (`User www-data`, see
    # /etc/apache2/envvars) via getpwnam(), so remapping what uid that
    # name points to is enough -- no apache/wordpress config changes
    # needed. This means apache's workers end up running as the SAME
    # uid/gid that already owns the bind mount (the host user), so they
    # get write access via plain ownership with zero host-side ownership
    # change at all, and every file PHP creates going forward is owned by
    # that same uid too -- git keeps working indefinitely, not just once.
    # The one remaining chown (now a no-op / correctness net, not the
    # actual fix) re-claims anything still numerically owned by the OLD
    # www-data (33) from before this fix, or from a stale image layer.
    #
    # Left as the default ENTRYPOINT (docker-entrypoint.sh, unmodified --
    # still does its normal wp-config/DB-wait/core-file setup as root)
    # with only the final CMD replaced, so all of this runs after that
    # setup and before apache starts serving requests.
    #
    # -D PRODUCTION_HARDENING switches on the production-only Apache rules
    # (images/wordpress_hardened/zz-production-hardening.conf); the honeypot
    # pools run the same image without it.
    command:
      - sh
      - -c
      - |
        HOST_UID=$$(stat -c '%u' /var/www/html)
        HOST_GID=$$(stat -c '%g' /var/www/html)
        usermod -u "$$HOST_UID" www-data
        groupmod -g "$$HOST_GID" www-data
        chown -R www-data:www-data /var/www/html/wp-content
        exec apache2-foreground -D PRODUCTION_HARDENING
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # ---------------------------------------------------------------------------
  # One-shot WordPress + WooCommerce + Elementor bootstrap for
  # production_eshop -- see scripts/seed_wordpress_db.sh for the full
  # rationale. A freshly-cloned repo already ships the entire WordPress
  # codebase (core/plugins/themes/uploads, all git-tracked under
  # production_eshop_files/), but production_database starts with ZERO
  # tables until something runs `wp core install` -- nothing ever did,
  # which is why "Table 'production_database.wp_options' doesn't exist"
  # kept recurring (WordPress core itself failing, not Elementor
  # specifically, on every request that touches options -- including
  # wp_install_state.lua's own 30s health probe). production_eshop now
  # depends on this completing successfully (not just on
  # production_database being reachable) so that can never happen again.
  #
  # honeypot_db_seed_1/2/3 below are the exact same idea applied to each
  # honeypot pool's own database -- those had NEVER had WordPress schema
  # either (confirmed live: honeypot_database_1/2/3 only ever had the
  # pool_router bookkeeping tables -- honeypot_ip_assignments/
  # honeypot_pool_events/honeypot_pool_registry -- never any wp_* table),
  # which meant honeypot_content_sync's own scoped DELETE/INSERT
  # replication (it creates content ROWS into EXISTING tables, never
  # schema) had nothing to write into either. Same root cause, same fix,
  # applied four times over -- once per WordPress database this stack has.
  #
  # Deliberately a plain-text WP-CLI script, not a committed SQL dump /
  # git-lfs binary: a few KB, reviewable in a normal `git diff`,
  # regenerable from the already-git-tracked plugin/theme code -- not a
  # large opaque blob that would eat GitHub's free LFS quota. See the
  # script's own header comment for the full reasoning.
  #
  # Runs as root (unlike production_eshop's own hardened, non-root
  # container) specifically to avoid needing the same host-uid/gid-remap
  # dance production_eshop's command performs -- reasonable here because
  # this container does one job and exits, it never serves live traffic.
  # ---------------------------------------------------------------------------
  production_db_seed:
    logging: *default-logging
    image: wordpress:cli-2.12.0-php8.4
    user: root
    depends_on:
      production_database:
        condition: service_healthy
    environment:
      - WORDPRESS_DB_HOST=production_database:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      - WP_ADMIN_USER=${WP_ADMIN_USER:-admin}
      - WP_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD:-change_this_wp_admin_password}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL:-admin@example.com}
      - WP_SITE_URL=${WP_SITE_URL:-http://localhost}
      - WP_SITE_TITLE=${WP_SITE_TITLE:-Fernhill Coffee Roasters}
      # Set to 1 to wipe and rebuild the storefront from scratch on the
      # next `docker compose up` instead of the normal idempotent no-op --
      # see the dashboard's Backups page "Reset demo store" action /
      # manage_backups.sh, or export it in the shell before `up`.
      - FORCE_RESEED=${FORCE_RESEED:-0}
      # Optional Stripe sandbox keys -- see scripts/seed_wordpress_db.sh's
      # configure_storefront(). Empty = Stripe gateway stays off, offline
      # gateways (cash on delivery / bank transfer) still make checkout work.
      - STRIPE_TEST_PUBLISHABLE_KEY=${STRIPE_TEST_PUBLISHABLE_KEY:-}
      - STRIPE_TEST_SECRET_KEY=${STRIPE_TEST_SECRET_KEY:-}
      # Production is the one real source of content -- see
      # scripts/seed_wordpress_db.sh's IMPORT_SAMPLE_CONTENT note.
      - IMPORT_SAMPLE_CONTENT=1
    volumes:
      - ./production_eshop_files:/var/www/html
      - ./scripts/seed_wordpress_db.sh:/seed_wordpress_db.sh:ro
      # On-demand WordPress core + WooCommerce upgrade (dashboard "WordPress
      # Update" page runs `docker compose run --rm --no-deps <this service>
      # sh /update_wordpress.sh <mode>`). Same wp-cli image + /var/www/html
      # mount + WORDPRESS_DB_* env as the seed above, so it targets exactly
      # this instance's files and database.
      - ./scripts/update_wordpress.sh:/update_wordpress.sh:ro
      - ./scripts/seed_elementor_pages.sh:/seed_elementor_pages.sh:ro
      # Storefront catalog/pages/journal (Fernhill Coffee Roasters) and its images.
      - ./scripts/seed_storefront_content.php:/seed_storefront_content.php:ro
      - ./eshop_seed:/eshop_seed:ro
    networks:
      - production_network
    # Only the CMD is overridden (matching production_eshop's own command
    # override just below) -- ENTRYPOINT stays docker-entrypoint.sh, which
    # is what actually generates wp-config.php from the WORDPRESS_DB_*
    # env vars above on a fresh checkout (no wp-config.php committed to
    # git -- it holds live DB credentials/salts). Bypassing the
    # entrypoint entirely would skip that and leave wp-cli with no DB
    # config to run against on a genuinely first-ever boot.
    command: ["sh", "/seed_wordpress_db.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Same DAC_OVERRIDE reasoning as backup_service: this bind mount is
    # host-owned, and root here still needs to bypass that ownership to
    # write wp-config.php/wp-content/the database schema on first boot.
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 512m
    # 1.0, not 0.5: every wp-cli call here boots all of WordPress +
    # WooCommerce + Elementor, which is CPU-bound -- measured ~1.2-2s per
    # boot at 0.5 vs ~0.6s at 1.0 (no further gain at 2.0). One-shot
    # container on the critical startup path, same ceiling as the eshops.
    cpus: "1.0"
    pids_limit: 100

  honeypot_db_seed_1:
    logging: *default-logging
    image: wordpress:cli-2.12.0-php8.4
    user: root
    depends_on:
      honeypot_eshop_1_net:
        condition: service_healthy
      honeypot_database_1:
        condition: service_healthy
      # honeypot_eshop_files needs init_setup's rsync to have actually put
      # the WooCommerce/Elementor/theme files there first -- otherwise
      # `wp plugin activate` below has nothing to activate.
      init_setup:
        condition: service_completed_successfully
      # Never run concurrently with honeypot_db_migration's own schema
      # migrations against the same database (wp core install below
      # creates the wp_* tables those migrations clean up).
      honeypot_db_migration:
        condition: service_completed_successfully
    environment:
      - WORDPRESS_DB_HOST=honeypot_database_1:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD_POOL_1}
      - WP_ADMIN_USER=${WP_ADMIN_USER:-admin}
      # Decoy admin password, deliberately different from production's (see .env).
      - WP_ADMIN_PASSWORD=${HONEYPOT_WP_ADMIN_PASSWORD:-change_this_honeypot_wp_admin_password}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL:-admin@example.com}
      # Deliberately identical to production_db_seed's WP_SITE_URL, not a
      # pool-specific one -- pool_router.lua's whole premise is that an
      # user transparently lands on the same public fingerprint
      # (theme/plugins/site identity) regardless of which pool they're
      # routed to, so this must match production exactly.
      - WP_SITE_URL=${WP_SITE_URL:-http://localhost}
      - WP_SITE_TITLE=${WP_SITE_TITLE:-Fernhill Coffee Roasters}
      - FORCE_RESEED=${FORCE_RESEED:-0}
      # Optional Stripe sandbox keys -- see scripts/seed_wordpress_db.sh's
      # configure_storefront(). Empty = Stripe gateway stays off, offline
      # gateways (cash on delivery / bank transfer) still make checkout work.
      - STRIPE_TEST_PUBLISHABLE_KEY=${STRIPE_TEST_PUBLISHABLE_KEY:-}
      - STRIPE_TEST_SECRET_KEY=${STRIPE_TEST_SECRET_KEY:-}
      - IMPORT_SAMPLE_CONTENT=0
    volumes:
      - honeypot_eshop_files:/var/www/html
      - ./scripts/seed_wordpress_db.sh:/seed_wordpress_db.sh:ro
      # On-demand WordPress core + WooCommerce upgrade -- see production_db_seed.
      # For a pool the dashboard runs this with --apply-db-only (files are
      # rsynced from production by init_setup; only this pool's DB schema is
      # migrated here).
      - ./scripts/update_wordpress.sh:/update_wordpress.sh:ro
    # In honeypot_eshop_1_net's network namespace, under the pool's own
    # firewall: wp-cli runs the pool's WordPress and plugin PHP, which an
    # attacker may have rewritten in honeypot_eshop_files -- so this
    # reaches exactly what honeypot_eshop_1 reaches (its own database), no more.
    network_mode: service:honeypot_eshop_1_net
    command: ["sh", "/seed_wordpress_db.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 100

  honeypot_db_seed_2:
    logging: *default-logging
    image: wordpress:cli-2.12.0-php8.4
    user: root
    depends_on:
      honeypot_eshop_2_net:
        condition: service_healthy
      honeypot_database_2:
        condition: service_healthy
      init_setup:
        condition: service_completed_successfully
      # Same as honeypot_db_seed_1: never concurrently with the migrations.
      honeypot_db_migration:
        condition: service_completed_successfully
    environment:
      - WORDPRESS_DB_HOST=honeypot_database_2:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD_POOL_2}
      - WP_ADMIN_USER=${WP_ADMIN_USER:-admin}
      # Decoy admin password, deliberately different from production's (see .env).
      - WP_ADMIN_PASSWORD=${HONEYPOT_WP_ADMIN_PASSWORD:-change_this_honeypot_wp_admin_password}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL:-admin@example.com}
      - WP_SITE_URL=${WP_SITE_URL:-http://localhost}
      - WP_SITE_TITLE=${WP_SITE_TITLE:-Fernhill Coffee Roasters}
      - FORCE_RESEED=${FORCE_RESEED:-0}
      # Optional Stripe sandbox keys -- see scripts/seed_wordpress_db.sh's
      # configure_storefront(). Empty = Stripe gateway stays off, offline
      # gateways (cash on delivery / bank transfer) still make checkout work.
      - STRIPE_TEST_PUBLISHABLE_KEY=${STRIPE_TEST_PUBLISHABLE_KEY:-}
      - STRIPE_TEST_SECRET_KEY=${STRIPE_TEST_SECRET_KEY:-}
      - IMPORT_SAMPLE_CONTENT=0
    volumes:
      - honeypot_eshop_files_2:/var/www/html
      - ./scripts/seed_wordpress_db.sh:/seed_wordpress_db.sh:ro
      # On-demand WordPress core + WooCommerce upgrade -- see production_db_seed.
      # For a pool the dashboard runs this with --apply-db-only (files are
      # rsynced from production by init_setup; only this pool's DB schema is
      # migrated here).
      - ./scripts/update_wordpress.sh:/update_wordpress.sh:ro
    # In honeypot_eshop_2_net's network namespace, under the pool's own
    # firewall: wp-cli runs the pool's WordPress and plugin PHP, which an
    # attacker may have rewritten in honeypot_eshop_files_2 -- so this
    # reaches exactly what honeypot_eshop_2 reaches (its own database), no more.
    network_mode: service:honeypot_eshop_2_net
    command: ["sh", "/seed_wordpress_db.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 100

  honeypot_db_seed_3:
    logging: *default-logging
    image: wordpress:cli-2.12.0-php8.4
    user: root
    depends_on:
      honeypot_eshop_3_net:
        condition: service_healthy
      honeypot_database_3:
        condition: service_healthy
      init_setup:
        condition: service_completed_successfully
      # Same as honeypot_db_seed_1: never concurrently with the migrations.
      honeypot_db_migration:
        condition: service_completed_successfully
    environment:
      - WORDPRESS_DB_HOST=honeypot_database_3:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD_POOL_3}
      - WP_ADMIN_USER=${WP_ADMIN_USER:-admin}
      # Decoy admin password, deliberately different from production's (see .env).
      - WP_ADMIN_PASSWORD=${HONEYPOT_WP_ADMIN_PASSWORD:-change_this_honeypot_wp_admin_password}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL:-admin@example.com}
      - WP_SITE_URL=${WP_SITE_URL:-http://localhost}
      - WP_SITE_TITLE=${WP_SITE_TITLE:-Fernhill Coffee Roasters}
      - FORCE_RESEED=${FORCE_RESEED:-0}
