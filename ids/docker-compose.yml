  # ---------------------------------------------------------------------------
  # Honeypot WordPress instances (pool 1, 2, 3)
  # ---------------------------------------------------------------------------
  # Each pool runs a full WordPress+WooCommerce stack with the vulnerable plugins
  # installed.  They are intentionally identical at startup; divergence happens
  # as users interact with their assigned instance.
  #
  # IMPORTANT: honeypot_db_migration must complete before any eshop starts so
  # that dummy data is in place and no real customer data is ever served.
  #
  # Networks: each pool instance joins honeypot_network only (its own DB and
  # the edge). Never production_network: see honeypot_eshop_1.
  # ---------------------------------------------------------------------------

  honeypot_eshop_1_net:
    <<: *container-firewall
    environment:
      - FIREWALL_PROFILE=honeypot
      - FIREWALL_LAYER=default
      - FIREWALL_DB_HOST=honeypot_database_1:3306
    networks:
      honeypot_network:
        aliases: [honeypot_eshop_1]

  # Pool 1 – uses the original honeypot_eshop_files directory (backward compat)
  honeypot_eshop_1:
    logging: *default-logging
    # The hardened image built by production_eshop (see the note there).
    # pull_policy never: run only the local build, never a Docker Hub image
    # of the same name.
    image: presshaven/wordpress:7.1.3-php8.4-hardened
    pull_policy: never
    depends_on:
      honeypot_eshop_1_net:
        condition: service_healthy
        restart: true
      honeypot_database_1:
        condition: service_healthy
      honeypot_db_migration:
        condition: service_completed_successfully
      # Same reasoning as production_eshop's own production_db_seed
      # dependency -- see honeypot_db_seed_1 above and
      # scripts/seed_wordpress_db.sh.
      honeypot_db_seed_1:
        condition: service_completed_successfully
    environment:
      - WORDPRESS_DB_HOST=honeypot_database_1:3306
      - WORDPRESS_DB_NAME=production_database
      - WORDPRESS_DB_USER=production_user
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD_POOL_1}
      # Enable WordPress debugging for SQL routing logs
      - WORDPRESS_DEBUG=1
      - WORDPRESS_DEBUG_LOG=1
      # Pool identifier exposed to PHP code for logging / X-Honeypot-Pool header
      - HONEYPOT_POOL_ID=1
    # ports:
    #   - "8081:80" # temporary port for direct pool-1 access
    volumes:
      - honeypot_eshop_files:/var/www/html
    # honeypot_network ONLY. A pool used to also join production_network
    # ("for SQL routing") and monitoring_network -- an attacker with code
    # execution here could then log into production_database as
    # production_user (ALL PRIVILEGES) and reach production's PHP directly.
    # The pool's own WordPress only talks to honeypot_database_N; the
    # production->pool copies (honeypot_db_init, honeypot_content_sync,
    # pool_manager's clone helpers) run in their own short-lived/sidecar
    # containers, which keep production_network.
    # No networks of its own: it lives in honeypot_eshop_1_net's network namespace,
    # which holds the networks, the DNS name and the firewall (see
    # x-container-firewall at the top).
    network_mode: service:honeypot_eshop_1_net
    # -------------------------------------------------------------------------
    # Container hardening for honeypot WordPress instances.
    #
    # Goal: contain any adversary who achieves code execution (e.g. via RCE
    # through one of the intentionally vulnerable plugins) inside this single
    # container so they cannot pivot to the host or other containers.
    #
    # no-new-privileges: blocks privilege escalation via SUID/SGID binaries.
    #   An adversary who drops a SUID shell via an upload exploit cannot gain
    #   root with it.
    # cap_drop ALL / cap_add minimal: Apache+PHP only needs CHOWN, DAC_OVERRIDE,
    #   FOWNER (filesystem operations), SETGID/SETUID (drop to www-data) and
    #   NET_BIND_SERVICE (bind port 80).  KILL is added so Apache's parent
    #   process can terminate worker children.  All other capabilities
    #   (NET_RAW, SYS_ADMIN, SYS_PTRACE, etc.) are removed, preventing common
    #   container-escape techniques that rely on those capabilities.
    # mem_limit / cpus: prevents a resource-exhaustion DoS from one honeypot
    #   instance consuming all host resources (e.g. triggered by a fork-bomb
    #   or a CPU-intensive exploit payload).
    # pids_limit: caps the process tree so fork-bomb payloads cannot exhaust
    #   the host PID namespace.
    # Note: read_only is NOT set because WordPress/Apache must write to the
    #   filesystem (/tmp, wp-content/uploads, debug.log etc.).  The adversary's
    #   ability to write files is intentional — it is part of the honeypot's
    #   attack surface and is monitored via Suricata and ELK.
    # -------------------------------------------------------------------------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - KILL
    # mem_limit/cpus bumped 512m/0.5 -> 1024m/1.0 this session: confirmed
    # live via `docker stats` that all three pools were sitting at
    # ~434-436MB *idle* against the old 512m cap (near-zero headroom) after
    # the new plugin roster (Wordfence, Elementor, etc. -- see docs/MANUAL.md §3.4)
    # pushed the per-instance footprint up by several hundred MB. One pool
    # was observed pegged at 300%+ CPU and its own Docker healthcheck
    # timing out -- cgroup memory pressure thrashing, not an application
    # bug. Matches production_eshop's own newly-added ceiling (see that
    # service's comment) so honeypot pools aren't now the *more*
    # resource-starved side, which would undermine realism (a user
    # who fingerprints response latency shouldn't see the honeypot
    # struggling under routine load that production handles fine).
    mem_limit: 1024m
    cpus: "1.0"
    pids_limit: 300
    # Same wp-content ownership fix as production_eshop above, same reason:
    # apache workers run as www-data and lose DAC_OVERRIDE (and every other
    # capability) on setuid(), so cap_add above can't help PHP's own
    # writes -- confirmed the same "Permission denied" write failure
    # reproduces here too (e.g. Font Library cache under wp-content/fonts)
    # once a font combination not already cached gets requested. This is a
    # named volume rather than production's bind mount, so a flat `chown
    # -R www-data:www-data` doesn't corrupt any host-tracked git files the
    # way it did there -- but it's remapped the same way regardless (see
    # production_eshop's comment for the full reasoning), both for
    # consistency and because this volume was itself seeded by an rsync
    # init step running as the host user, so it starts out owned by that
    # host uid/gid too, not www-data.
    command:
      - sh
      - -c
      - |
        HOST_UID=$$(stat -c '%u' /var/www/html)
        HOST_GID=$$(stat -c '%g' /var/www/html)
        usermod -u "$$HOST_UID" www-data
        groupmod -g "$$HOST_GID" www-data
        chown -R www-data:www-data /var/www/html/wp-content
        exec apache2-foreground
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s

