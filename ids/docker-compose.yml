    logging: *default-logging
    image: mysql:8.4.13
    depends_on:
      honeypot_database_1_net:
        condition: service_healthy
        restart: true
      init_setup:
        condition: service_completed_successfully
    # The wrapper makes root@localhost and MYSQL_USER follow the passwords
    # below on every start and drops root@'%' (scripts/
    # mysql_credentials_entrypoint.sh) -- a copied data dir or a rotated
    # .env can't leave stale or shared credentials behind.
    command: ["bash", "/mysql_credentials_entrypoint.sh", "mysqld", "--mysql-native-password=ON", "--authentication-policy=mysql_native_password"]
    environment:
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD_POOL_1}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD_POOL_1}
      - MYSQL_ROOT_HOST=localhost
    volumes:
      - ./scripts/mysql_credentials_entrypoint.sh:/mysql_credentials_entrypoint.sh:ro
