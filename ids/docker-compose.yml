    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - KILL
    # mem_limit/cpus bumped 512m/0.5 -> 1024m/1.0 this session: confirmed
    # live via `docker stats` that all three pools were sitting at
    # ~434-436MB *idle* against the old 512m cap (near-zero headroom) after
    # the new plugin roster (Wordfence, Elementor, etc. -- see docs/MANUAL.md §3.4)
    # pushed the per-instance footprint up by several hundred MB. One pool
    # was observed pegged at 300%+ CPU and its own Docker healthcheck
    # timing out -- cgroup memory pressure thrashing, not an application
    # bug. Matches production_eshop's own newly-added ceiling (see that
    # service's comment) so honeypot pools aren't now the *more*
    # resource-starved side, which would undermine realism (a user
    # who fingerprints response latency shouldn't see the honeypot
    # struggling under routine load that production handles fine).
    mem_limit: 1024m
    cpus: "1.0"
    pids_limit: 300
    # Same wp-content ownership fix as production_eshop above, same reason:
    # apache workers run as www-data and lose DAC_OVERRIDE (and every other
    # capability) on setuid(), so cap_add above can't help PHP's own
    # writes -- confirmed the same "Permission denied" write failure
    # reproduces here too (e.g. Font Library cache under wp-content/fonts)
    # once a font combination not already cached gets requested. This is a
    # named volume rather than production's bind mount, so a flat `chown
    # -R www-data:www-data` doesn't corrupt any host-tracked git files the
    # way it did there -- but it's remapped the same way regardless (see
    # production_eshop's comment for the full reasoning), both for
    # consistency and because this volume was itself seeded by an rsync
    # init step running as the host user, so it starts out owned by that
    # host uid/gid too, not www-data.
    command:
      - sh
      - -c
      - |
        HOST_UID=$$(stat -c '%u' /var/www/html)
        HOST_GID=$$(stat -c '%g' /var/www/html)
        usermod -u "$$HOST_UID" www-data
        groupmod -g "$$HOST_GID" www-data
        chown -R www-data:www-data /var/www/html/wp-content
        exec apache2-foreground
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # Redis for session management and threat intelligence
  session_store:
    logging: *default-logging
    # Needs vm.overcommit_memory=1 on the HOST: without it Redis logs
    # "WARNING Memory overcommit must be enabled!" at every start, and a
    # background save can fail -- after which Redis refuses writes (sessions,
    # threat state, the pool registry). It is a host-level kernel setting
    # (not namespaced per container, so compose's `sysctls:` can't set it).
    # The dashboard checks it on every host that runs this stack and shows
    # the fix in a banner and in the Services start report
    # (dashboard/core/host_settings.py).
    image: redis:8.10.2-alpine
    depends_on:
      init_setup:
        condition: service_completed_successfully
    volumes:
      - redis_data:/data
      - ./redis_config:/usr/local/etc/redis
    networks:
      - session_network
    command: |
      sh -c "
      echo 'Starting Redis with fresh data...'
      rm -rf /data/*
      exec redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
      "
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s

  # Suricata IDS for traffic analysis
  # ---------------------------------------------------------------------------
  # Runs in af-packet mode on the Docker bridge interface (eth0 inside the
  # container) so it can inspect all honeynet and production traffic that
  # passes through the monitoring_network.
  #
  # Capabilities:
  #   NET_ADMIN  – required for packet capture via AF_PACKET sockets
  #   SYS_NICE   – allows Suricata to adjust its scheduling priority
  #
  # The ids_network is a dedicated bridge used solely to give Suricata a
  # network attachment point with visibility into honeynet traffic.
  # ---------------------------------------------------------------------------
  suricata_ids:
    logging: *default-logging
    image: jasonish/suricata:8.0.7
    depends_on:
      init_setup:
        condition: service_completed_successfully
    volumes:
      - ./suricata_config:/etc/suricata
      - ./suricata_logs:/var/log/suricata
      - ./suricata_rules:/var/lib/suricata/rules
    environment:
      - ELK_ENABLED=${ELK_ENABLED:-false}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - ELASTICSEARCH_USER=${ELASTICSEARCH_USER:-}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
      # Clear Suricata's own logs at the start of each ids run (default on);
      # set SURICATA_AUTO_CLEANUP=false in .env to keep them across runs.
      - SURICATA_AUTO_CLEANUP=${SURICATA_AUTO_CLEANUP:-true}
    # network_mode: host -- NOT the usual `networks:` list. Confirmed live
    # (attack-test-2026-08-05.log, repo root) that plain bridge-network
    # *membership* (this container was on ids_network, same as
    # reverse_proxy) does not mean shared traffic *visibility*: each
    # container's virtual NIC only ever receives frames addressed to
    # itself, not a copy of everything else on the bridge. A full mixed
    # attack run against the stack produced zero http/alert events in
    # eve.json -- only background flow/stats noise on this container's own
    # otherwise-idle interface. Real client traffic reaches reverse_proxy
    # via published-port DNAT and its own backend traffic flows over
    # production_network/honeypot_network -- neither path ever touched
    # ids_network. Host networking gives this container the same view of
    # traffic as the Docker host itself (including the actual bridge
    # interfaces those other networks use), which is what
    # suricata_config/suricata.yaml's af-packet `interface: any` (see that
    # file) is written to capture across. `networks:` and `network_mode:`
    # are mutually exclusive in Compose, hence the removal below.
    network_mode: host
    # NET_ADMIN: required for AF_PACKET socket-based capture.
    # SYS_NICE: allows Suricata to manage its own thread scheduling priority.
    # privileged: required for AF_PACKET socket creation on some systems.
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    cap_drop:
      - ALL
    # entrypoint override: the jasonish/suricata image's own
    # /docker-entrypoint.sh does `exec $@` (UNQUOTED) to pass through a
    # custom command. Since `command:` below is a single multi-line shell
    # script string, Compose passes it to that entrypoint as ONE argument --
    # but the unquoted `$@` in the image's entrypoint re-splits it on
    # whitespace/newlines, shredding the script into dozens of separate
    # arguments. `sh -c` then only sees the first fragment ("echo") as its
    # actual script; everything else silently becomes discarded positional
    # parameters. Net effect: the container ran essentially `sh -c echo`,
    # producing no real output and exiting in well under a second --
    # confirmed live: `docker compose ps -a` showed suricata_ids exiting
    # with code 0 immediately after every start, with completely empty logs
    # even for a trivial `echo` test command, and the same script worked
    # correctly the moment the image's entrypoint was bypassed. This is a
    # bug in the upstream image, not this project's script. Fixed by
    # overriding the entrypoint so our command reaches `sh -c` directly,
    # without going through the image's broken passthrough logic at all.
    #
    # `command` MUST be a YAML list with exactly one element (the script, as
    # a single block-scalar string) rather than a bare multi-line scalar.
    # A bare scalar is parsed by Compose in "shell form" and gets
    # shell-word-split into a *separate* array element per token before
    # being appended after the exec-form `entrypoint` -- so `/bin/sh -c`
    # ended up receiving "echo" as its `-c` script and every other word as a
    # discarded positional parameter, reproducing the exact same
    # word-splitting corruption this override was meant to fix, just one
    # layer up (in Compose's own command parsing instead of the image
    # entrypoint's). Wrapping it as a one-item list forces Compose to treat
    # the whole block as a single opaque string.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 'Starting Suricata IDS...'

        # Ensure log directory exists and is writable
        mkdir -p /var/log/suricata

        # Clear the previous run's Suricata logs so each ids run starts
        # clean, instead of eve.json/fast.log/stats.log/suricata.log (and
        # any rotated files or pcaps) accumulating across restarts -- the
        # dashboard's Network IDS page and the log_capper read these, and a
        # fresh start keeps "recent alerts" actually recent. On by default;
        # set SURICATA_AUTO_CLEANUP=false in .env to retain logs across runs.
        # ($$VAR, not $VAR: Compose consumes a single $ before passing the
        # script to the shell, same as $$sc_pid/$$FILTER_FIFO below.)
        if [ "$${SURICATA_AUTO_CLEANUP:-true}" = "true" ]; then
          echo '  SURICATA_AUTO_CLEANUP=true -- clearing previous run logs in /var/log/suricata'
          rm -f /var/log/suricata/eve.json /var/log/suricata/fast.log \
                /var/log/suricata/stats.log /var/log/suricata/suricata.log
          rm -f /var/log/suricata/*.pcap /var/log/suricata/eve.json.* \
                /var/log/suricata/fast.log.* 2>/dev/null || true
        else
          echo "  SURICATA_AUTO_CLEANUP=$${SURICATA_AUTO_CLEANUP} -- keeping previous run logs"
        fi

        # Copy custom rules into the rules directory Suricata expects.
        # The local.rules file is mounted at /var/lib/suricata/rules/local.rules
        # which matches the rule-files path in suricata.yaml.
        if [ -f /var/lib/suricata/rules/local.rules ]; then
          echo '  Custom rules found at /var/lib/suricata/rules/local.rules'
        else
          echo '  Warning: local.rules not found - Suricata will use built-in rules only'
        fi

        # Start Suricata in AF_PACKET mode, in the FOREGROUND (no -D/daemonize)
        # so the suricata process itself is the container's main process --
        # this also removes the need for a separate `tail -f /dev/null`
        # keep-alive trick, whose behavior with BusyBox's tail implementation
        # on /dev/null was never actually verified to block indefinitely on
        # this image's base OS.
        #
        # `--pcap` is used bare (no interface value), reading the capture
        # config from suricata_config/suricata.yaml's `pcap:` section
        # instead (interface: any) -- see that file's comment for why PCAP
        # capture mode was chosen over AF_PACKET (AF_PACKET has no working
        # equivalent of libpcap's "any" pseudo-device, and this container's
        # network_mode: host setup means the real interface to listen on is
        # one of several dynamically-named, unpredictable docker bridge
        # interfaces rather than a single fixed name).
        #
        # Note for posterity: an earlier version of this line used
        # `--af-packet eth0` (space-separated), which is invalid CLI syntax
        # -- Suricata's real syntax is `--af-packet[=<dev>]`, requiring an
        # *equals sign* to attach an interface value. The space-separated
        # form gets parsed as two separate arguments, and the bare "eth0"
        # is then treated as an ad-hoc BPF filter expression to compile,
        # producing `failed to compile BPF "eth0": can't parse filter
        # expression: syntax error`. Confirmed live, and confirmed via
        # `suricata --help`. The same equals-sign requirement applies to
        # `--pcap[=<dev>]` -- passing a bare flag (no value at all, as done
        # here) sidesteps the whole issue by deferring entirely to the
        # config file, which is also the more maintainable form regardless.
        #
        # No longer a bare `exec suricata ...`: stdout/stderr now go
        # through a filter that drops the two specific known-harmless
        # startup warnings documented in suricata_config/suricata.yaml's
        # KNOWN-HARMLESS STARTUP WARNINGS comment (the "any" pseudo-device
        # ioctl probes) from what reaches `docker compose logs` -- every
        # other message, current or future, still reaches stdout
        # unfiltered. Tried first: Suricata's own per-output
        # logging.outputs.console.level config key -- confirmed LIVE that
        # Suricata 8.0.6 parses that key (--dump-config shows it set) but
        # does not actually enforce it on the console output: messages
        # below the configured level (even plain "i:" info lines) kept
        # printing regardless. Raising the GLOBAL default-log-level
        # instead would work, but was already rejected (see the other
        # file's comment) since that also silences genuinely useful
        # warnings from the persisted suricata.log file, not just the
        # cosmetic ones from this console stream.
        #
        # Can't just pipe into grep under `exec`, though: `exec suricata
        # ... | grep -v ...` makes grep, not suricata, the pipeline's last
        # process, so `$$!` after backgrounding it would capture grep's PID
        # -- with no handle on suricata's own PID, a `docker stop`/
        # `restart` SIGTERM would only reach grep, and suricata would run
        # on unsignaled until Docker's stop-grace-period expires and force-
        # kills it, losing its graceful-shutdown stats line. A FIFO avoids
        # that: suricata writes into one end, grep reads the other, and
        # `$$!` right after backgrounding suricata (not the grep job)
        # captures the PID the trap below actually needs to signal.
        FILTER_FIFO=/tmp/suricata_stdout.fifo
        rm -f "$$FILTER_FIFO"
        mkfifo "$$FILTER_FIFO"

        grep -v --line-buffered -E \
          "ioctl: (Failure when trying to get MTU via ioctl for 'any'|any: failed to get SIOCETHTOOL ioctl): No such device" \
          < "$$FILTER_FIFO" &

        suricata -c /etc/suricata/suricata.yaml --pcap -l /var/log/suricata > "$$FILTER_FIFO" 2>&1 &
        sc_pid=$$!

        # Forward docker stop/restart's SIGTERM (and SIGINT, for a manual
        # Ctrl-C) to suricata so it shuts down gracefully -- writing its
        # final device/stats line, same as it always did under `exec` --
        # instead of being force-killed once this wrapper shell, not
        # suricata, is the direct child Docker actually signals.
        trap 'kill -TERM "$$sc_pid" 2>/dev/null; wait "$$sc_pid"; exit $$?' TERM INT

        wait "$$sc_pid"
        exit_code=$$?
        rm -f "$$FILTER_FIFO"
        exit "$$exit_code"
    healthcheck:
      test: ["CMD", "test", "-f", "/var/log/suricata/fast.log"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 2s

  # Vector for shipping logs to ELK SIEM (on OpenStack SIEM VM 147.175.151.193)
  # ---------------------------------------------------------------------------
  # Automated backup service
  # ---------------------------------------------------------------------------
  # Runs on a 24-hour loop, dumping the production MySQL database and archiving
  # the production WordPress files into the ./backups/ directory on the host.
  #
  # Retention: the backup script keeps only the last 7 daily archives; older
  # files are pruned automatically to prevent unbounded disk growth.
  #
  # The service is intentionally isolated from honeypot networks and has no
  # access to honeypot data – backups are production-only.
  #
  # Security hardening: runs with no-new-privileges, drops all capabilities
  # (a backup process needs only filesystem read access, not Linux capabilities),
  # and is limited in memory and CPU to avoid interfering with live traffic.
  # ---------------------------------------------------------------------------
  backup_service:
    # tini as PID 1: it forwards SIGTERM. Without it the process (a shell
    # loop / bash script / Python with no SIGTERM handler) ignored the
    # signal as PID 1 and `down` killed it after the 10 s stop timeout.
    init: true
    logging: *default-logging
    # alpine + mysql-client, built once (see images/backup_service/Dockerfile)
    # rather than `apk add`ed on every container start.
    build: ./images/backup_service
    depends_on:
      production_database:
        condition: service_healthy
      production_eshop:
        condition: service_healthy
    volumes:
      - ./production_eshop_files:/source_wp:ro
      - ./backups:/backups
      - ./backups/backup.sh:/backup.sh:ro
      - ./backups/restore_db.sh:/restore_db.sh:ro
    networks:
      - production_network
    environment:
      - MYSQL_HOST=production_database
      - MYSQL_DATABASE=production_database
      - MYSQL_USER=production_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - BACKUP_RETENTION_DAYS=7
    command: |
      sh -c "
        echo 'Backup service started. First backup in 5 minutes...'
        sleep 300
        while true; do
          /backup.sh
          echo 'Next backup in 24 hours...'
          sleep 86400
        done
      "
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # DAC_OVERRIDE: ./backups/ is a host bind mount owned by the host user
    # (not root), and this container otherwise runs as root (the alpine
    # base image's default) with every other capability dropped. Without
    # DAC_OVERRIDE, root inside the container can no longer bypass a
    # directory's Unix permission bits -- confirmed live: backup.sh's very
    # first `mkdir "${DB_BACKUP_DIR}"` failed with "Permission denied" every
    # single run, so backup_service had been running for hours without ever
    # producing one actual backup file, silently. This is the one
    # capability that specifically restores "root can write into a
    # directory it doesn't own", which is exactly what's needed here and
    # nothing more.
    cap_add:
      - DAC_OVERRIDE
    mem_limit: 256m
    cpus: "0.25"
    pids_limit: 50
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Read-only Docker API proxy for Vector's container-log collection.
  # ---------------------------------------------------------------------------
  # vector_outbound ships logs OUT to the SIEM, so it is egress-capable. Giving
  # an egress-capable container the raw /var/run/docker.sock would make a
  # compromise of it a full host takeover (a `:ro` bind-mount on a *socket* is
  # cosmetic -- it does not restrict the Docker API, which is request/response
  # over that socket). Instead, this proxy holds the socket and exposes only a
  # least-privilege, READ-ONLY slice of the API: listing/inspecting containers
  # and the event stream (what Vector's docker_logs source needs), nothing that
  # can create, exec into, or modify a container. It publishes no host port and
  # lives only on monitoring_network, so only vector_outbound can reach it.
  docker_socket_proxy:
    logging: *default-logging
    image: tecnativa/docker-socket-proxy:0.3.0
    profiles:
      - elk
    environment:
      # Default-deny: every API section below is off unless set to 1.
      - CONTAINERS=1   # GET /containers/json, /containers/{id}/json, .../logs
      - EVENTS=1       # GET /events  (docker_logs watches for new containers)
      - PING=1         # GET /_ping   (client health check)
      - POST=0         # no mutating calls at all (create/exec/start/stop/...)
    volumes:
      # The ONLY container that touches the real socket. :ro here is defence in
      # depth; the actual restriction is the API gating above.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring_network
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: "0.10"
    pids_limit: 50
    restart: unless-stopped

  vector_outbound:
    logging: *default-logging
    image: timberio/vector:0.60.0-debian
    profiles:
      - elk
    user: root
    depends_on:
      reverse_proxy:
        condition: service_started
      docker_socket_proxy:
        condition: service_started
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./vector/certs:/etc/vector/certs:ro
      - ./suricata_logs:/var/log/suricata:ro
      - ./nginx_logs:/var/log/nginx:ro
      - ./vector/data:/var/lib/vector
      - ./vector/logs:/var/log/vector
      # Container logs are collected over the read-only docker_socket_proxy
      # (see its service above and vector.yaml's docker_in source) -- NOT by
      # mounting the Docker socket or the raw container log tree here.
      # Redis logs (if available) – named volume (vmhgfs bind-mount does not support chown)
      - redis_data:/var/log/redis:ro
    environment:
      # Vector 0.50+ no longer expands ${VAR} in its config unless asked to:
      # without this, vector.yaml's docker_logs filter stays the literal
      # "com.docker.compose.project=${COMPOSE_PROJECT_NAME:-...}" (matches no
      # container) and the SIEM address is unresolved -- it validates and
      # then ships nothing. Every variable it reads is set here, by us.
      - VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
      - ELK_ENABLED=${ELK_ENABLED:-true}
      - VECTOR_HOST=${VECTOR_HOST:-147.175.151.193}
      - VECTOR_PORT=${VECTOR_PORT:-6000}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-147.175.151.193}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - ELASTICSEARCH_PROTOCOL=${ELASTICSEARCH_PROTOCOL:-https}
      - ELASTICSEARCH_USER=${ELASTICSEARCH_USER:-elastic}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
      - ELASTICSEARCH_SSL_ENABLED=${ELASTICSEARCH_SSL_ENABLED:-true}
      - ELASTICSEARCH_SSL_VERIFY=${ELASTICSEARCH_SSL_VERIFY:-certificate}
      - KIBANA_HOST=${KIBANA_HOST:-147.175.151.193}
      - KIBANA_PORT=${KIBANA_PORT:-5601}
      - KIBANA_PROTOCOL=${KIBANA_PROTOCOL:-https}
      - KIBANA_SSL_ENABLED=${KIBANA_SSL_ENABLED:-true}
      - KIBANA_SSL_VERIFY=${KIBANA_SSL_VERIFY:-certificate}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-honeypot-ids-system-v1}
    networks:
      - monitoring_network
    # Lets this container resolve "host.docker.internal" to the Docker
    # host's own gateway IP (Docker Engine 20.10+; Docker Desktop has this
    # built in, native Linux Engine needs it declared explicitly). This is
    # what makes single-host testing/development work: this project and
    # siem are two INDEPENDENT compose
    # projects with no shared network, by design (see README's two-host
    # split note) -- but the SIEM's vector_inbound aggregator already publishes its
    # port to 0.0.0.0 on the host, so setting VECTOR_HOST=host.docker.internal
    # (instead of the real remote SIEM VM's IP) reaches it without needing
    # any change to the SIEM stack's own network topology or joining the
    # two projects onto a shared network. Harmless in the real two-host
    # deployment: VECTOR_HOST there is still the real remote IP, and an
    # unused DNS alias doesn't affect anything.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: --config /etc/vector/vector.yaml
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Enhanced reverse proxy with Lua-based honeynet routing
  # ---------------------------------------------------------------------------
  # Waits for ALL three honeypot pool instances to be healthy before accepting
  # traffic so that pool_router.lua never routes to a pool that is still starting.
  # ---------------------------------------------------------------------------
  reverse_proxy:
    logging: *default-logging
    build:
      context: ./reverse_proxy_enhanced
      dockerfile: Dockerfile
    depends_on:
      production_eshop:
        condition: service_healthy
      honeypot_eshop_1:
        condition: service_healthy
      honeypot_eshop_2:
        condition: service_healthy
      honeypot_eshop_3:
        condition: service_healthy
      session_store:
        condition: service_healthy
      # suricata_ids is optional - it can run but doesn't block other services
      # suricata_ids:
      #   condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse_proxy_enhanced:/etc/nginx
      - ./ssl_certificates:/etc/ssl/certs:ro
      - ./nginx_logs:/var/log/nginx
      # Read access to Suricata's eve.json -- init_worker.lua's
      # parse_suricata_logs() tails this to feed threat_intel.threat_ips
      # (see suricata_rules.lua). This mount was missing entirely before:
      # the parser's io.open() silently returned nil every 30s (no log
      # line either way, since a genuinely-absent file and "nothing new to
      # process" look the same to that code path) -- Suricata alerts have
      # never actually reached router.lua's IP-reputation gate, regardless
      # of the eve.json-vs-fast.log parsing format. suricata_ids is not a
      # hard startup dependency (commented out above) so this may not
      # exist for the first few seconds after a fresh `docker compose up`;
      # parse_suricata_logs() already tolerates that (io.open returns nil,
      # skipped, tried again next timer tick).
      - ./suricata_logs:/var/log/suricata:ro
    networks:
      - production_network
      - honeypot_network
      - session_network
      - monitoring_network
      - ids_network
    # On honeypot_network and the stack's other networks: never a router
    # between them (Docker leaves ip_forward on in every container namespace).
    sysctls:
      net.ipv4.ip_forward: 0
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ELK_ENABLED=${ELK_ENABLED:-false}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - ELASTICSEARCH_PROTOCOL=${ELASTICSEARCH_PROTOCOL:-https}
      - ELASTICSEARCH_USER=${ELASTICSEARCH_USER:-}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
      - ELASTICSEARCH_SSL_VERIFY=${ELASTICSEARCH_SSL_VERIFY:-certificate}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - ABUSEIPDB_CONFIDENCE_MINIMUM=${ABUSEIPDB_CONFIDENCE_MINIMUM:-90}
      - ABUSEIPDB_DAILY_CHECK_LIMIT=${ABUSEIPDB_DAILY_CHECK_LIMIT:-1000}
      - ABUSEIPDB_BLACKLIST_ENABLED=${ABUSEIPDB_BLACKLIST_ENABLED:-false}
      - ABUSEIPDB_BLACKLIST_REFRESH_HOURS=${ABUSEIPDB_BLACKLIST_REFRESH_HOURS:-24}
      - INTERNAL_TEST_SECRET=${INTERNAL_TEST_SECRET:-}
      # Signed session cookie + session recovery (lua/session_identity_rules.lua).
      - SESSION_SIGNING_KEY=${SESSION_SIGNING_KEY:-}
      - SESSION_RECOVERY_USES_IP=${SESSION_RECOVERY_USES_IP:-true}
      - SESSION_RECOVERY_WINDOW=${SESSION_RECOVERY_WINDOW:-900}
      - IP_REPUTATION_CAP=${IP_REPUTATION_CAP:-10}
      - SHARED_IP_SESSIONS=${SHARED_IP_SESSIONS:-2}
      - SHARED_IP_WINDOW=${SHARED_IP_WINDOW:-3600}
      # Trusted payment/OAuth callback allowlist (lua/pattern_rules.lua). The
      # shop's own host is auto-derived from WP_SITE_URL; TRUSTED_CALLBACK_DOMAINS
      # is an optional comma-separated list of extra gateway/bank domains to add
      # to the baked-in default set. Absolute URLs in a request URI pointing
      # anywhere else (RFI/open-redirect/SSRF) are blocked outright with a 403.
      - WP_SITE_URL=${WP_SITE_URL:-http://localhost}
      - TRUSTED_CALLBACK_DOMAINS=${TRUSTED_CALLBACK_DOMAINS:-}
      # Threat decay: set THREAT_DECAY_ENABLED=false to make session/IP threat
      # scores persist indefinitely (no decay); half-life tunes the fade rate.
      - THREAT_DECAY_ENABLED=${THREAT_DECAY_ENABLED:-true}
      - SCORE_DECAY_HALF_LIFE_SECONDS=${SCORE_DECAY_HALF_LIFE_SECONDS:-300}
      # Request body guard (PHP2Shell interim layer): enforce | observe | off
      - BODY_GUARD_MODE=${BODY_GUARD_MODE:-enforce}
      # Consent-gated gdpr_signature identity (lua/gdpr_handler.lua, ids/GDPR.md).
      # GDPR_PRIVATE_KEY is the ONLY secret (base64 DER RSA private key); the
      # public key served to browsers is derived from it. Never reaches clients.
      - GDPR_ENABLED=${GDPR_ENABLED:-true}
      - GDPR_PRIVATE_KEY=${GDPR_PRIVATE_KEY:-}
      - GDPR_TIMESTAMP_WINDOW=${GDPR_TIMESTAMP_WINDOW:-300}
      - GDPR_BINDING_TTL=${GDPR_BINDING_TTL:-3600}
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s

  # ---------------------------------------------------------------------------
  # log_capper -- hard cap on FILE logs so no single log can fill the disk.
  # ---------------------------------------------------------------------------
  # The x-logging json-file limits above only bound each container's STDOUT
  # log. Logs written to FILES in the bind-mounted log dirs -- Suricata's
  # eve.json/fast.log, nginx's access/security/error.log, Vector's own logs --
  # are NOT covered by that, and a runaway 20 GB eve.json is exactly what
  # filled the disk. This tiny sidecar truncates any *.log/*.json under the
  # mounted log dirs that grows past LOG_CAP_MB, every LOG_CAP_INTERVAL
  # seconds, IN PLACE (`: > file`) so the writer's open fd keeps working.
  # Recent history is still shipped to Elasticsearch by Vector, so truncating
  # the local copy loses nothing important.
  log_capper:
    # tini as PID 1: it forwards SIGTERM. Without it the process (a shell
    # loop / bash script / Python with no SIGTERM handler) ignored the
    # signal as PID 1 and `down` killed it after the 10 s stop timeout.
    init: true
    image: alpine:3.24.3
    container_name: log_capper
    restart: unless-stopped
    logging: *default-logging
    environment:
      LOG_CAP_MB: "50"
      LOG_CAP_INTERVAL: "20"
    volumes:
      - ./suricata_logs:/logs/suricata
      - ./nginx_logs:/logs/nginx
      - ./vector/logs:/logs/vector
    command:
      - sh
      - -c
      - |
        cap_kb=$$(( $${LOG_CAP_MB} * 1024 ))
        echo "log_capper: capping *.log/*.json over $${LOG_CAP_MB}MB (>$${cap_kb}k) every $${LOG_CAP_INTERVAL}s under /logs"
        while true; do
          find /logs -type f \( -name '*.log' -o -name '*.json' \) -size +$${cap_kb}k 2>/dev/null | while IFS= read -r f; do
            : > "$$f" && echo "log_capper: truncated $$f (exceeded $${LOG_CAP_MB}MB)"
          done
          sleep "$${LOG_CAP_INTERVAL}"
        done
    networks:
      - monitoring_network

networks:
  production_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  # internal: no route off the host and no DNS forwarding for outside names
  # (so no DNS tunnelling either) -- a compromised pool cannot reach the
  # internet whatever its firewall says. The host's gateway address stays
  # reachable on an internal network; the honeypot firewall profile blocks it.
  honeypot_network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24
  monitoring_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
  session_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
  ids_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/24

volumes:
  # The Container Firewall rulesets (one file per profile), shared by every
  # *_net firewall container and pool_manager's runtime pool firewalls.
  container_firewall_rules:
    driver: local
  # production_mysql_data: named volume for the production MySQL instance.
  # Populated by init_setup from ./production_database_data (vmhgfs, read-only).
  # Using a named volume (not a bind mount) so that MySQL's chown on startup
  # succeeds – vmhgfs does not support chown and MySQL 5.7's entrypoint requires it.
  production_mysql_data:
    driver: local
  # Pool 1 database data (named volume, populated by init_setup)
  honeypot_database_data:
    driver: local
  # Pool 2 and 3 database data directories (named volumes, populated by init_setup)
  honeypot_database_data_2:
    driver: local
  honeypot_database_data_3:
    driver: local
  honeypot_eshop_files:
    driver: local
  honeypot_eshop_files_2:
    driver: local
  honeypot_eshop_files_3:
    driver: local
  redis_data:
    driver: local
  suricata_logs:
    driver: local
  nginx_logs:
    driver: local
  ssl_certificates:
    driver: local
  # Backup archives written by backup_service – production data only.
  # The directory is bind-mounted (not a named volume) so backups survive
  # 'docker compose down -v' and are accessible directly on the host filesystem.