      - SETUID
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 100

  # ---------------------------------------------------------------------------
  # Honeypot pool databases (pool 1, 2, 3)
  # ---------------------------------------------------------------------------
  # Each pool has its own MySQL instance backed by an independent data directory
  # so that adversary writes (SQL injections, data exfiltration, etc.) are
  # isolated per-pool and never affect other pools or production.
  #
  # All three use identical SCHEMA (enforced by migrations) so pool_router.lua
  # can assign any new IP to any pool interchangeably. Credentials, however,
  # are deliberately DIFFERENT per pool (MYSQL_PASSWORD / MYSQL_PASSWORD_POOL_2
  # / MYSQL_PASSWORD_POOL_3): all honeypot_eshop_N containers share one flat
  # honeypot_network and can reach every honeypot_database_N over TCP, so
  # without distinct credentials a compromised pool could authenticate
  # directly into another user's pool database. See
  # ids/testing/test_pool_isolation.sh.
