    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_NICE
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]  # TCP, NOT the local socket: "healthy" must mean the NETWORKED server accepts connections. A `-h localhost` socket ping also answers the official image's temporary --skip-networking bootstrap server, so it goes green before TCP is up and releases service_healthy dependents (e.g. production_db_seed) too early -- they then fail to connect over TCP and exit. 127.0.0.1 forces TCP. Still no credentials: "alive" (exit 0) even on access denied, and no password in `docker inspect`
      interval: 30s
      timeout: 5s
      retries: 5
      # See production_database's healthcheck comment above for why 420s.
      start_period: 420s
      start_interval: 1s

