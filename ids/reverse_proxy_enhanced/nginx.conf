worker_processes auto;
error_log /var/log/nginx/error.log info;
error_log /dev/stdout info;
pid /var/run/nginx.pid;

# Make environment variables available to Lua
env REDIS_PASSWORD;
env ABUSEIPDB_API_KEY;
env ABUSEIPDB_CONFIDENCE_MINIMUM;
env ABUSEIPDB_DAILY_CHECK_LIMIT;
env INTERNAL_TEST_SECRET;
env SESSION_SIGNING_KEY;
env SESSION_RECOVERY_USES_IP;
env SESSION_RECOVERY_WINDOW;
env IP_REPUTATION_CAP;
env SHARED_IP_SESSIONS;
env SHARED_IP_WINDOW;
env THREAT_DECAY_ENABLED;
env SCORE_DECAY_HALF_LIFE_SECONDS;
# Request body guard mode: enforce | observe | off (lua/body_guard.lua).
env BODY_GUARD_MODE;
# Consent-gated gdpr_signature identity (lua/gdpr_handler.lua, ids/GDPR.md).
# GDPR_PRIVATE_KEY is the RSA private key (base64 DER, PKCS#8); the public key
# handed to browsers is derived from it, so it is the only secret here and it
# never reaches the client.
env GDPR_ENABLED;
env GDPR_PRIVATE_KEY;
env GDPR_TIMESTAMP_WINDOW;
env GDPR_BINDING_TTL;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';

    # session_id was $cookie_PHPSESSID until this fix -- that's WordPress's
    # OWN incidental PHP session cookie (only ever set once a real PHP
    # session starts server-side, e.g. login/cart), completely unrelated to
    # this system's actual session tracking. session_handler.lua/init.lua's
    # _G.config.session.cookie_name sets and reads a DIFFERENT cookie,
    # "SERVERID" (must match that setting) -- the one every session_id this system's own code
    # actually generates, stores in Redis, and logs via log_security_event()
    # is keyed on (see §3.5). Confirmed live: $cookie_PHPSESSID was empty
    # ("-") on essentially every request, including ones the honeypot had
    # already assigned a real, stable session cookie to -- meaning
    # this log's session_id field was silently disconnected from the rest
    # of the system's session tracking for as long as this line existed.
    # request_score .. reason explain the routing decision (router_rules.lua's
    # decision_trace(): this request's own score, the session's decayed
    # carry-over, offenses, decay state, whether the URI matched an attack
    # pattern and which, and the honeypot reason) -- parsed by
    # siem/vector/vector.yaml for the Kibana "Threat Decisions & Decay"
    # dashboard. Defaults are set in every server block below.
    log_format security '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'session_id="$session_id" route="$route_decision" '
                       'risk_score="$risk_score" suspicious="$suspicious_activity" '
                       'request_score="$request_score" decayed_score="$decayed_score" '
                       'offenses="$offenses" decay_state="$decay_state" '
                       'uri_class="$uri_class" patterns="$threat_patterns" '
                       'reason="$route_reason" cache_status="$upstream_cache_status"';

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/security.log security;
    access_log /dev/stdout main;

    # Hide nginx version in error pages and Server header.
    # OpenResty's more_set_headers module rewrites the Server header to a
    # generic string so that automated scanners (Shodan, WPScan, Nuclei) cannot
    # determine the exact Nginx or OpenResty release from HTTP responses alone.
    server_tokens off;
    more_set_headers "Server: nginx";

    # Strip X-Powered-By that PHP/Apache/WordPress may inject into proxied
    # responses before we forward them to the client.  Exposing "PHP/8.1.x"
    # lets users target known PHP CVEs without any additional recon.
    more_clear_headers "X-Powered-By";
    more_clear_headers "X-Generator";
    more_clear_headers "X-Pingback";

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 128M;
    client_body_timeout 60s;
    # body_guard.lua reads every request body before it is proxied; keep
    # ordinary form posts in memory instead of a temp file per request.
    client_body_buffer_size 1m;
    client_header_timeout 60s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # DNS resolver for Docker service names
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Per-IP request-rate limiting. Previously there was NO rate limiting
    # anywhere in this file -- confirmed live by firing 40 fully-concurrent
    # requests from one IP and observing all 40 return 200 with zero
    # throttling (attack-test log, repo root). The Lua-level risk scoring
    # (Stage 9, "rapid automation detected") is a *detection* signal that
    # affects routing, not a request-blocking mechanism -- a request that
    # trips it still gets fully processed by a real backend either way, so
    # it provides no actual resource protection against a request flood.
    # 20r/s with a burst of 60 is deliberately generous: a real WooCommerce
    # page load can legitimately fire 30+ near-simultaneous static-asset
    # requests (confirmed in check-me.log, repo root), and this must not
    # throttle that. It's meant to catch genuinely excessive, sustained
    # per-IP request rates (flooding/brute-force), not normal browsing.
    # NOTE: this zone does not currently exempt whitelisted IPs
    # (_G.utils.is_ip_whitelisted in init.lua) -- that whitelist is
    # Lua/session-level and doesn't automatically extend to this separate,
    # lower-level nginx mechanism. Flagged as a follow-up if trusted
    # high-volume sources (monitoring, load testing) need an explicit
    # `geo`/`map`-based exemption.
    # Keyed on the session id (the id part of the SERVERID cookie) when the
    # request carries one, and on the address otherwise, so every user
    # behind one carrier-grade NAT address doesn't share a single 20 r/s
    # bucket with the user next to them. The cookie isn't verified at
    # this phase; a client inventing cookies to get more buckets fails the
    # HMAC in Lua and is scored as tampering on its recovered session.
    map $cookie_SERVERID $rate_limit_key {
        "~^(?<rl_sid>[0-9a-f]{32})\." $rl_sid;
        default $binary_remote_addr;
    }
    limit_req_zone $rate_limit_key zone=general_limit:10m rate=20r/s;
    # Static assets get a far larger bucket of their own (the static location
    # below sets it, which replaces the inherited general_limit -- nginx has no
    # "limit_req off"). A WooCommerce block cart alone pulls ~70 scripts, styles
    # and images in one go; under general_limit (20 r/s, burst 60) the rest were
    # answered 429, its block scripts never loaded and the cart never rendered,
    # for every visitor. They are served from the proxy cache and cost little.
    limit_req_zone $rate_limit_key zone=static_limit:10m rate=200r/s;
    limit_req_status 429;

    # Proxy cache configuration for static assets
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:50m max_size=1g inactive=7d use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 304 1d;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;

    # Rate limiting disabled for end users

    # Lua shared dictionaries
    lua_shared_dict sessions 10m;
    lua_shared_dict threat_intel 10m;
    lua_shared_dict rate_limit 10m;
    lua_shared_dict honeypot_routes 1m;

    # Lua modules path
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Every cosocket user in lua/ (health_check.lua's backend HEAD probes,
    # wp_install_state.lua, abuseipdb_client.lua, init.lua's Redis pool)
    # already checks the returned error and logs it with context (which
    # backend, which task, what was being attempted). With this left at
    # its default, OpenResty ALSO logs the bare kernel-level failure for
    # the same event at [error] -- "lua tcp socket read timed out,
    # upstream: session_store:6379(...), context: ngx.timer" -- with no
    # indication of which timer or call hit it, right above the module's
    # own [warn]/[error] line that says exactly that. Turning it off is the
    # documented recommendation for code that handles its own cosocket
    # errors; nothing is lost, the duplicate context-free line goes away.
    lua_socket_log_errors off;

    # Trust the system CA bundle for outbound HTTPS cosockets opened via
    # lua-resty-http (abuseipdb_client.lua). ssl_verify=true on those calls
    # does NOT fall back to the OS trust store automatically like curl does --
    # OpenResty cosockets only trust what's named here. The bundle lives
    # under /usr/local/openresty (see Dockerfile) rather than the usual
    # /etc/ssl/certs, because docker-compose.yml bind-mounts a host
    # directory over /etc/ssl/certs at runtime, which would otherwise
    # shadow the CA bundle apk installed there at build time.
    lua_ssl_trusted_certificate /usr/local/openresty/ca-certificates.crt;
    lua_ssl_verify_depth 2;

    # Initialize Lua components
    init_by_lua_file /etc/nginx/lua/init.lua;
    init_worker_by_lua_file /etc/nginx/lua/init_worker.lua;

    # Upstream definitions
    upstream production_backend {
        server production_eshop:80 max_fails=5 fail_timeout=10s weight=100;
        keepalive 512;
        keepalive_requests 10000;
        keepalive_timeout 120s;
    }

    # ---------------------------------------------------------------------------
    # Honeypot pool upstreams
    #
    # Each pool_N upstream points to a dedicated WordPress + MySQL pair so that
    # every attacking IP gets its own isolated fake environment.  pool_router.lua
    # selects the upstream name at request time based on the IP's sticky assignment
    # stored in Redis (key: honeypot_pool_session:<IP>).
    #
    # The number of pool blocks here MUST match POOL_COUNT in pool_router.lua and
    # the number of honeypot_eshop_N services defined in docker-compose.yml.
    # ---------------------------------------------------------------------------

    # Pool 1 – primary honeypot instance (uses the original honeypot_eshop_1 service)
    upstream honeypot_backend_1 {
        server honeypot_eshop_1:80 max_fails=5 fail_timeout=10s weight=100;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 120s;
    }

    # Pool 2 – second isolated honeypot instance
    upstream honeypot_backend_2 {
        server honeypot_eshop_2:80 max_fails=5 fail_timeout=10s weight=100;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 120s;
    }

    # Pool 3 – third isolated honeypot instance
    upstream honeypot_backend_3 {
        server honeypot_eshop_3:80 max_fails=5 fail_timeout=10s weight=100;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 120s;
    }

    # Generic honeypot_backend alias kept for backward compatibility with any
    # code paths that still reference the old name (e.g. legacy Lua branches that
    # have not yet been updated to pool-based routing).  Routes to pool 1.
    upstream honeypot_backend {
        server honeypot_eshop_1:80 max_fails=5 fail_timeout=10s weight=100;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 120s;
    }

    # Security headers map
    map $sent_http_content_type $security_headers {
        default "X-Frame-Options: SAMEORIGIN; X-Content-Type-Options: nosniff; X-XSS-Protection: 1; mode=block; Referrer-Policy: strict-origin-when-cross-origin";
    }

    # Connection upgrade map for WebSockets and keepalive
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' "";
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name localhost *.localhost;

        # The global `security` access_log format (http{} block above)
        # references $route_decision/$risk_score/$suspicious_activity,
        # but this block never runs any Lua that would set them -- every
        # request through here is a plain redirect (or malformed/scanning
        # traffic nginx rejects outright, e.g. a raw TLS ClientHello sent to
        # the HTTP port). Without these defaults nginx logs three
        # "using uninitialized variable" warnings per request on top of the
        # access-log line itself -- confirmed as real, current log noise
        # (see check-me.log, repo root) that would spam heavily under real
        # background internet scan traffic, exactly the kind of thing this
        # port sees. Matches the same defaults set in the main server block.
        set $route_decision "production";
        set $session_id "-";
        set $risk_score "0";
        set $suspicious_activity "false";
        set $request_score "0";
        set $decayed_score "0";
        set $offenses "0";
        set $decay_state "none";
        set $uri_class "safe";
        set $threat_patterns "-";
        set $route_reason "-";

        return 301 https://$host$request_uri;
    }
    
    # Main server block
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost *.localhost;
    
        ssl_certificate /etc/ssl/certs/server.crt;
        ssl_certificate_key /etc/ssl/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
    
        # HSTS header
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

        # Set routing headers for all responses (server level)
        header_filter_by_lua_block {
            if ngx.var.is_static_asset ~= "1" then
                local route_decision = ngx.var.route_decision
                ngx.log(ngx.INFO, "[HEADER_FILTER] route_decision='", route_decision or "nil", "' risk_score='", ngx.var.risk_score or "nil", "'")
                -- X-Route-Target / X-Risk-Score exist for testing/validation
                -- (testing/scenario_*.sh read them externally) -- gated behind
                -- a shared secret so they don't leak the routing decision and
                -- risk score to every real client / user. See
                -- BLIND_PENTEST_PROTOCOL.md §8.2.
                local secret = _G.config.internal_test_secret
                if route_decision and route_decision ~= "" and
                   secret and secret ~= "" and ngx.var.http_x_internal_test_auth == secret then
                    ngx.header["X-Route-Target"] = route_decision
                    ngx.header["X-Risk-Score"] = ngx.var.risk_score or "0"
                    ngx.log(ngx.INFO, "[HEADER_FILTER] Setting X-Route-Target=", route_decision)
                else
                    ngx.log(ngx.INFO, "[HEADER_FILTER] Not setting X-Route-Target (empty decision or missing/invalid internal test auth)")
                end
                
                -- Set session cookie if this is a new session
                if ngx.var.new_session_id and ngx.var.new_session_id ~= "" then
                    local cookie_value = require("session_handler").cookie_value(ngx.var.new_session_id) .. "; Path=/; HttpOnly; SameSite=Lax; Secure"
                    -- Append: assigning the header would drop every Set-Cookie the upstream
                    -- sent in this same response (e.g. WooCommerce's cart session).
                    local sid_cookie = _G.config.session.cookie_name .. "=" .. cookie_value
                    local upstream_cookies = ngx.header["Set-Cookie"]
                    if type(upstream_cookies) == "table" then
                        upstream_cookies[#upstream_cookies + 1] = sid_cookie
                        ngx.header["Set-Cookie"] = upstream_cookies
                    elseif upstream_cookies then
                        ngx.header["Set-Cookie"] = { upstream_cookies, sid_cookie }
                    else
                        ngx.header["Set-Cookie"] = sid_cookie
                    end
                    ngx.log(ngx.INFO, "[SESSION] 🍪 Setting session cookie in server header_filter: ", ngx.var.new_session_id)
                end
            else
                ngx.log(ngx.INFO, "[HEADER_FILTER] Static asset, skipping headers")
            end
        }

        # Access control - allow all IPs (Lua routing handles threats)
        # allow 127.0.0.1; # Localhost
        # allow 100.64.0.0/10; # Tailscale access
        # allow 10.0.0.0/8; # Local network access
        # allow 172.16.0.0/12; # Docker networks
        # allow 147.175.0.0/16; # STUBA
        # deny all;  -- REMOVED: Lua routing handles all threat detection

        # Per-session (else per-IP) request-rate limit -- see the limit_req_zone definition
        # (http{} block above) for why this exists and how the numbers were
        # chosen. nodelay: requests within the burst are served immediately
        # rather than artificially queued/delayed; only requests beyond the
        # burst get a 429.
        limit_req zone=general_limit burst=60 nodelay;

        # Variables for routing decision
        set $route_decision "production";
        set $session_id "-";
        set $risk_score "0";
        set $suspicious_activity "false";
        set $request_score "0";
        set $decayed_score "0";
        set $offenses "0";
        set $decay_state "none";
        set $uri_class "safe";
        set $threat_patterns "-";
        set $route_reason "-";
        set $backend_upstream "production_backend";
        set $is_static_asset "0";
        set $new_session_id "";

        # ------------------------------------------------------------------
        # Block WordPress information-disclosure files.
        # readme.html and license.txt contain the exact WordPress version in
        # plain text. Sensitive files like readme.html are handled by Lua
        # routing so that user probes are captured in the honeypot
        # instead of being flatly denied. The Lua code routes based on
        # risk score.
        #
        # xmlrpc.php is handled differently, in the access_by_lua_block
        # below (search "XML-RPC block") rather than a location here --
        # this used to be a comment claiming a proxy-layer block existed
        # with no actual directive backing it (dead documentation, found
        # while working on production hardening). Blocking it needs to
        # happen AFTER the routing decision is known (production vs.
        # honeypot), which is only available once access_by_lua_block has
        # run; a plain nginx `location`+`if` here would fire during the
        # rewrite phase, before that decision exists.
        # ------------------------------------------------------------------

        # Static assets - HIGHEST PRIORITY - always route to production, bypass ALL security checks
        # Match any static file extension with or without query parameters
        location ~* ^\/((wp-content|wp-includes)\/)?.+\.(css|js|jpg|jpeg|png|gif|svg|woff|woff2|ttf|eot|otf|ico|webp|webm|mp4|mp3|pdf)(\?.*)?$ {
            set $is_static_asset "1";
            expires 1d;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            limit_req zone=static_limit burst=400 nodelay;

            # ------------------------------------------------------------------
            # Hotlink protection for image and media assets.
            #
            # Rationale: hotlinking (embedding production images on third-party
            # sites) consumes bandwidth, can be used for canvas fingerprinting,
            # and leaks information about the production file structure.
            #
            # Policy:
            #   * Requests with NO referer are allowed (direct browser navigation,
            #     curl, search-engine crawlers, RSS readers).
            #   * Requests whose Referer matches our own hostname are allowed
            #     (images loaded by our own pages, lazy-loaded assets, etc.).
            #   * Requests from any other external domain are denied with 403.
            #
            # Only applied to images/media (jpg|jpeg|png|gif|svg|webp|webm|mp4|
            # mp3|pdf), NOT to CSS/JS/fonts because those are commonly embedded
            # by legitimate third-party pages or CDN-served stylesheets.
            # ------------------------------------------------------------------
            location ~* \.(jpg|jpeg|png|gif|svg|webp|webm|mp4|mp3|pdf)(\?.*)?$ {
                set $is_static_asset "1";
                expires 1d;
                add_header Cache-Control "public, immutable";

                # valid_referers: blank (no referer) and our server_name are OK.
                # "blocked" covers requests where the Referer header is present
                # but was stripped to just a scheme (e.g. "https://").
                valid_referers none blocked server_names;
                if ($invalid_referer) {
                    # Return 403 Forbidden for hotlink attempts from external sites.
                    return 403;
                }

                proxy_cache static_cache;
                proxy_cache_bypass $http_cache_control;
                proxy_ignore_headers Cache-Control Expires;

                proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
                proxy_next_upstream_tries 3;
                proxy_next_upstream_timeout 15s;

                proxy_pass http://production_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_buffering on;
                proxy_buffer_size 16k;
                proxy_buffers 8 16k;
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }

            # Enable caching for static assets
            proxy_cache static_cache;
            proxy_cache_bypass $http_cache_control;
            proxy_ignore_headers Cache-Control Expires;

            # Retry logic for failed upstream connections
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 15s;

            proxy_pass http://production_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Increased timeouts to prevent 503 on first load
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        
        # Rate limiting for sensitive endpoints - handled by main access_by_lua_block and location /
        # wp-admin/wp-login.php/xmlrpc.php requests will be handled by the main routing logic
        
        # API endpoints with different rate limiting
        location ~* ^\/wp-json\/ {
            proxy_pass http://$backend_upstream;
            include /etc/nginx/proxy_params;
        }

        # Vulnerable plugin endpoints: no dedicated location any more. This
        # used to force 8 hard-coded plugin directories to the honeypot here,
        # bypassing the main pipeline; router.lua's Stage 1c now handles every
        # vulnerable plugin through the server-level access_by_lua_block
        # below, honouring the dashboard's Honeypot Targets page (a target can
        # be disabled, and "score" mode scores a hit instead of diverting it --
        # see lua/edge_policy_rules.lua).

        # admin-ajax.php: only bumps the body-size limit for genuine file
        # uploads through WordPress's AJAX router. Deliberately has NO
        # access_by_lua_block of its own -- it inherits the server-level
        # one (below), the same main pattern_analyzer/router.lua pipeline
        # every other request goes through. This used to define its own
        # access_by_lua_block here, which OVERRIDES rather than merges with
        # the inherited one in nginx/OpenResty -- so admin-ajax.php
        # requests never got session-based accumulation, IP reputation,
        # CVE matching, or any other pipeline signal, only this location's
        # own one-shot upload_handler check with its own disconnected
        # routing decision. pattern_analyzer.lua's Stage 6b now runs
        # upload_handler's analysis as part of the normal pipeline instead.
        location ~* ^\/wp-admin\/admin-ajax\.php$ {
            client_max_body_size 200M;

            proxy_pass http://$backend_upstream;
            include /etc/nginx/proxy_params;
        }

        # Request body guard (PHP2Shell / Node2Shell interim layer, see
        # lua/body_guard.lua). Server level and in the rewrite phase, so it
        # runs for every location -- including those with their own
        # access_by_lua_block, which replaces rather than extends the one
        # below -- and before anything proxies the body.
        rewrite_by_lua_block {
            require("body_guard").check()
        }

        # Main routing logic using Lua
        access_by_lua_block {
            -- Scheduled-maintenance gate (WordPress Update dashboard page).
            --
            -- While a core/WooCommerce upgrade runs, the dashboard SETs
            -- honeypot_maintenance in Redis; init_worker.lua's mirror timer
            -- copies it into the `threat_intel` shared dict as "maintenance"
            -- (no Redis on the hot path). When set we serve a self-contained
            -- 503 page to EVERY request -- production and honeypot, HTML and
            -- static assets alike -- so no client ever sees a half-upgraded
            -- store or a files/DB-schema mismatch mid-update. This runs before
            -- the static-asset skip on purpose: a clean "we'll be right back"
            -- for the whole site beats serving stale CSS over a 503 document.
            -- The flag is TTL-guarded in Redis, so if the dashboard dies the
            -- key expires, mirrors back to "0", and the site self-recovers.
            do
                local threat_intel = ngx.shared.threat_intel
                local maintenance = require "maintenance"
                if threat_intel and maintenance.should_serve_maintenance(threat_intel:get("maintenance")) then
                    ngx.status = 503
                    ngx.header["Content-Type"] = "text/html; charset=utf-8"
                    ngx.header["Retry-After"] = maintenance.RETRY_AFTER
                    ngx.header["Cache-Control"] = "no-store"
                    ngx.say(maintenance.page_html(maintenance.RETRY_AFTER))
                    return ngx.exit(503)
                end
            end

            -- Skip Lua processing for static assets
            if ngx.var.is_static_asset == "1" then
                return
            end

            -- The /__gdpr/* utility endpoints (public key / client config /
            -- client script) are served by their own content handlers below
            -- and must not run the routing pipeline (no session, no scoring).
            if (ngx.var.uri or ""):find("^/__gdpr/") then
                return
            end

            -- WordPress Studio passthrough (dashboard admin panel).
            --
            -- A request that presents the internal-test shared secret AND asks
            -- (X-Studio-Backend: production) is force-routed to production and
            -- skips scoring/routing entirely, so an operator editing content or
            -- settings in the embedded wp-admin is never diverted into a
            -- honeypot mid-edit (the /wp-admin/* count path would otherwise
            -- divert after ~3 hits) and never poisons their own IP reputation.
            -- Fail-closed exactly like the X-Route-Target debug headers: the
            -- secret must be configured AND presented, so no external client
            -- can reach production this way. See router_rules.is_studio_passthrough.
            local router_rules = require "router_rules"
            if router_rules.is_studio_passthrough(
                    _G.config and _G.config.internal_test_secret,
                    ngx.var.http_x_internal_test_auth,
                    ngx.var.http_x_studio_backend) then
                ngx.var.route_decision = "production"
                ngx.var.backend_upstream = "production_backend"
                ngx.log(ngx.WARN, "[STUDIO] force-routed to production (wp-admin studio passthrough)")
                return
            end

            -- Targeted Access passthrough (dashboard admin panel).
            --
            -- Same secret-gated passthrough as the studio one above, but for
            -- jumping straight into ONE honeypot pool's wp-admin
            -- (X-Studio-Backend: honeypot + X-Studio-Pool: <N>) so an
            -- operator can open any pool on demand -- e.g. to verify a
            -- WordPress Studio propagation actually landed -- without
            -- scoring ever diverting or mis-targeting the check. See
            -- router_rules.studio_honeypot_target.
            local studio_pool_upstream = router_rules.studio_honeypot_target(
                    _G.config and _G.config.internal_test_secret,
                    ngx.var.http_x_internal_test_auth,
                    ngx.var.http_x_studio_backend,
                    ngx.var.http_x_studio_pool,
                    require("pool_router_rules").STATIC_POOL_COUNT)
            if studio_pool_upstream then
                ngx.var.route_decision = "honeypot"
                ngx.var.backend_upstream = studio_pool_upstream
                ngx.log(ngx.WARN, "[STUDIO] force-routed to ", studio_pool_upstream,
                        " (wp-admin targeted-access passthrough)")
                return
            end

            -- Untrusted payment/OAuth callback: block outright (hard 403).
            --
            -- A WooCommerce shop legitimately puts absolute http(s):// URLs in
            -- its request URIs only for gateway return/notify callbacks and
            -- OAuth redirect URIs, which must point at a trusted provider (see
            -- _G.config.threat.trusted_callback_domains -- known banks/gateways
            -- plus the shop's own WP_SITE_URL host). An absolute URL to any
            -- other host is the shape of an RFI / open-redirect / SSRF payload.
            --
            -- This is enforced as an OUTRIGHT DENY here, before session
            -- creation, scoring or routing -- deliberately NOT as a threat
            -- score. Such a URL can be planted in a link and sent to an
            -- innocent visitor; scoring it would divert and mislabel THEM as an
            -- attacker and poison their session/IP reputation. A flat 403
            -- blocks the request while leaving the visitor's standing untouched.
            do
                local bad_host = require("pattern_rules").untrusted_callback_host(
                    ngx.var.request_uri, _G.config.threat.trusted_callback_domains)
                if bad_host then
                    ngx.log(ngx.WARN, "[CALLBACK] Blocked untrusted external callback host=",
                            bad_host, " | IP: ", ngx.var.remote_addr)
                    ngx.header["Content-Type"] = "text/plain; charset=utf-8"
                    ngx.status = 403
                    ngx.say("Request blocked: callback to an untrusted destination.")
                    return ngx.exit(403)
                end
            end

            local session_handler = require "session_handler"
            local pattern_analyzer = require "pattern_analyzer"
            local router = require "router"

            -- Log request start
            ngx.log(ngx.INFO, "")
            ngx.log(ngx.INFO, "========================================")
            ngx.log(ngx.INFO, "[REQUEST START] ", ngx.var.request_method, " ", ngx.var.request_uri)
            ngx.log(ngx.INFO, "[REQUEST] IP: ", ngx.var.remote_addr, " | User-Agent: ", (ngx.var.http_user_agent or "none"):sub(1, 80))

            -- Get or create session.
            --
            -- Resolved BEFORE pattern analysis: everything a client does
            -- itself (request rate, timing streaks, admin/brute-force
            -- attempts) is counted per session (ngx.ctx.session_id), not per
            -- address, so users sharing one NAT address with a flagged user
            -- aren't scored for that user's behaviour.
            --
            -- Users are told apart by their session, not their IP (see
            -- lua/session_identity_rules.lua). The SERVERID cookie is
            -- "<session id>.<HMAC>": a cookie that was edited or forged fails
            -- the HMAC and is never looked up. A request without a valid
            -- cookie (cleared cookies/localStorage, private window, curl) is
            -- matched to its existing session by a passive server-side
            -- fingerprint the client never stores (TLS ClientHello, HTTP
            -- version, User-Agent, Accept-Language/-Encoding, and by default
            -- the IP), so clearing browser storage cannot shed a session.
            -- Only a client with no valid cookie AND no fingerprint match gets
            -- a fresh, zero-score session.
            local session_id, cookie_status = session_handler.read_session_cookie()
            local is_new_session = false
            local recovered = false
            local cookie_tampered = false
            if cookie_status == "bad_signature" or cookie_status == "malformed" then
                -- Only a stable signing key makes a bad MAC proof of
                -- tampering; with a per-start key every cookie issued before
                -- the last restart fails too.
                cookie_tampered = _G.config.session.signing_key_stable
                ngx.log(cookie_tampered and ngx.WARN or ngx.INFO,
                        "[SESSION] Session cookie rejected (", cookie_status, ")",
                        cookie_tampered and " -- TAMPERED" or " -- signing key changed since it was issued",
                        " | IP: ", ngx.var.remote_addr)
            end

            if not session_id then
                session_id = session_handler.get_session_id_for_fingerprint()
                if session_id then
                    recovered = true
                    ngx.log(ngx.WARN, "[SESSION] 🔁 No valid session cookie, but this client's fingerprint "
                            .. "matches session ", session_id, " -- recovering it instead of starting fresh",
                            " | IP: ", ngx.var.remote_addr)
                end
            end

            if not session_id then
                session_id = session_handler.generate_session_id()
                is_new_session = true  -- This is a brand new session
                ngx.log(ngx.INFO, "[SESSION DEBUG] Generated new session_id=", session_id)
            end
            -- Store session_id for use in router and update_session
            ngx.ctx.session_id = session_id
            local session_data = session_handler.get_session(session_id)

            if recovered and not session_data then
                -- The fingerprint binding pointed at a session that has since
                -- expired from Redis (TTL race) -- start a genuinely fresh one.
                ngx.log(ngx.WARN, "[SESSION] Fingerprint-bound session ", session_id, " no longer exists -- creating a new one")
                recovered = false
                session_id = session_handler.generate_session_id()
                is_new_session = true
                ngx.ctx.session_id = session_id
            elseif recovered then
                -- Re-issue the cookie so this client is back on the cookie path.
                is_new_session = true
            end
            ngx.var.session_id = session_id

            -- Consent-gated gdpr_signature (runs ALONGSIDE the session above,
            -- never replacing it -- see lua/gdpr_handler.lua / ids/GDPR.md).
            -- Decrypt this request's gdpr_token (if the visitor consented and
            -- the browser sent one), derive its one-way signature, and check
            -- whether that signature is still bound to a honeypot. The match
            -- flag is read by router.decide_route()'s Stage 1a; the signature
            -- itself is stashed so the post-decision block below can (re)bind
            -- it whenever this request ends up routed to the honeypot. Wrapped
            -- in pcall so any crypto/Redis error degrades to "no GDPR signal"
            -- rather than breaking the request.
            local gdpr_ok, gdpr_err = pcall(function()
                local gdpr = require "gdpr_handler"
                local result = gdpr.process_request()
                if result.signature then
                    ngx.ctx.gdpr_signature = result.signature
                    -- Record the derived one-way signature for every request
                    -- that carried a valid, fresh consent token. This is what
                    -- the dashboard's Attack Simulation page surfaces (the raw
                    -- "Pattern analyzer log" tab shows this line directly; the
                    -- "Pattern analyzer" card view parses it -- see
                    -- core/pattern_log_parser.py's _GDPR_SIGNATURE_RE). The
                    -- signature is a salted SHA-256, not the raw characteristics
                    -- (never logged), so this is safe to record -- it's the same
                    -- value already written to Redis as a honeypot binding.
                    ngx.log(ngx.INFO, "[GDPR] Received gdpr_signature=", result.signature,
                            " | Session: ", session_id)
                    if gdpr.is_signature_honeypot_bound(result.signature) then
                        ngx.ctx.gdpr_honeypot_match = true
                        ngx.log(ngx.WARN, "[GDPR] Signature matched an unexpired honeypot "
                                .. "binding -- re-routing | Session: ", session_id,
                                " | IP: ", ngx.var.remote_addr)
                    end
                end
            end)
            if not gdpr_ok then
                ngx.log(ngx.ERR, "[GDPR] process_request failed (ignored): ", tostring(gdpr_err))
            end

            -- Check for honeytoken usage BEFORE risk scoring.
            -- If a previously-injected fake credential appears in this request
            -- it means the adversary exfiltrated it from the honeypot and is now
            -- trying to use it.  This is a confirmed-compromise signal: force
            -- the request to honeypot immediately and flag the session with a
            -- maximum risk score so all subsequent requests also go to honeypot.
            local honeytoken_handler = require "honeytoken_handler"
            local ht_result = honeytoken_handler.analyze_request_for_tokens()
            if ht_result then
                ngx.log(ngx.CRIT,
                    "[HONEYTOKEN] Confirmed token reuse – forcing honeypot | ",
                    "token=", ht_result.token_id,
                    " severity=", ht_result.severity,
                    " ip=", ngx.var.remote_addr)
                -- Inject a synthetic maximum risk score so the routing
                -- pipeline below sends this request straight to honeypot.
                ngx.var.risk_score = "100"
                ngx.var.suspicious_activity = "true"
            end

            -- Analyze current request for threats
            local request_headers = ngx.req.get_headers()
            local pattern_result = pattern_analyzer.analyze_request(
                ngx.var.request_uri,
                request_headers,
                ngx.var.remote_addr
            )

            -- Merge honeytoken signal into threat result if one was detected.
            if ht_result then
                pattern_result.score = 100
                pattern_result.suspicious = true
                table.insert(pattern_result.patterns_matched, "honeytoken_reuse:" .. ht_result.token_id)
            end

            -- Request body guard verdict (rewrite phase, lua/body_guard.lua):
            -- the body is already stripped; this makes the attempt count
            -- toward routing and the session's accumulated score.
            local bg = ngx.ctx.body_guard
            if bg then
                pattern_result.score = math.min(_G.config.threat.max_risk_score,
                                               pattern_result.score + bg.score)
                pattern_result.suspicious = pattern_result.score >= _G.config.threat.honeypot_threshold
                table.insert(pattern_result.patterns_matched, "body_guard:" .. bg.reason)
            end

            -- Admin area logging for wp-admin/wp-login.php/xmlrpc.php
            local admin_uri = ngx.var.request_uri or ""
            if string.match(admin_uri, "^/wp%-admin") or string.match(admin_uri, "^/wp%-login%.php") or string.match(admin_uri, "^/xmlrpc%.php") then
                local admin_handler = require "admin_handler"
                local admin_score, admin_reason = admin_handler.process_admin_request(
                    ngx.var.remote_addr, admin_uri, ngx.ctx.session_id)
                if admin_score and admin_score > 0 then
                    pattern_result.score = math.min(_G.config.threat.max_risk_score,
                                                   pattern_result.score + admin_score)
                    pattern_result.suspicious = pattern_result.score >= _G.config.threat.honeypot_threshold
                    table.insert(pattern_result.patterns_matched, admin_reason or "admin_suspicious")
                end
            end

            -- Set threat variables
            -- (ngx.var.risk_score itself is set AFTER decide_route()
            -- below, not here -- decide_route() mutates pattern_result.score
            -- in place, folding in the session's own decayed/accumulated
            -- history (router.lua's score-accumulation block) before any
            -- stage compares it against a threshold. Setting it here would
            -- capture the raw pre-accumulation value, which is what this
            -- variable feeds into logs and the dashboard's score display --
            -- confirmed live those showed a misleadingly low number even
            -- while route_decision correctly stayed "honeypot".)
            ngx.var.suspicious_activity = tostring(pattern_result.suspicious)


            -- An edited or forged session cookie is an attack on the session
            -- mechanism itself: score it like any other signal.
            if cookie_tampered then
                pattern_result.score = (pattern_result.score or 0) + _G.config.session.tamper_score
                pattern_result.suspicious = true
                table.insert(pattern_result.patterns_matched, "session_cookie_tampered")
                ngx.log(ngx.WARN, "[PATTERN ANALYZER] Signal: session cookie tampered (+",
                        _G.config.session.tamper_score, ") | Session: ", session_id)
            end

            if session_data then
                ngx.log(ngx.INFO, "[SESSION DEBUG] Found existing session: ", session_data.id, " honeypot_bound=", tostring(session_data.honeypot_bound))
            else
                ngx.log(ngx.INFO, "[SESSION DEBUG] No existing session found")
            end

            -- Make routing decision
            local routing_decision = router.decide_route(session_data, pattern_result, ngx.var.remote_addr, ngx.ctx.session_id)

            -- Set routing variables
            ngx.var.route_decision = routing_decision.target
            ngx.var.backend_upstream = routing_decision.upstream
            -- pattern_result.score was mutated in place by decide_route()'s
            -- score-accumulation block -- this is the accumulated/decayed
            -- effective score that actually drove the routing decision
            -- above, not just this one request's isolated score.
            ngx.var.risk_score = tostring(pattern_result.score)

            -- Decision-making fields for the security log / Kibana (see
            -- log_format security and router_rules.decision_trace()).
            local trace = routing_decision.trace
            if trace then
                ngx.var.request_score = trace.request_score
                ngx.var.decayed_score = trace.decayed_score
                ngx.var.offenses = trace.offenses
                ngx.var.decay_state = trace.decay_state
                ngx.var.uri_class = trace.uri_class
                ngx.var.threat_patterns = trace.patterns
            end
            if routing_decision.target == "honeypot" then
                local reason = (routing_decision.session_data
                    and routing_decision.session_data.honeypot_reason) or "unknown"
                ngx.var.route_reason = tostring(reason):gsub('[%s"]', "_")

                -- Remember this (consented) browser's one-way signature against
                -- its honeypot, so a later cookie + localStorage wipe followed
                -- by re-consent lands straight back here (Stage 1a). Fires for
                -- ANY honeypot routing reason, and also refreshes the binding's
                -- TTL when the match itself is what caused the diversion.
                if ngx.ctx.gdpr_signature then
                    local ok, err = pcall(function()
                        require("gdpr_handler").bind_signature_to_honeypot(
                            ngx.ctx.gdpr_signature,
                            routing_decision.session_data and routing_decision.session_data.honeypot_pool,
                            reason)
                    end)
                    if not ok then
                        ngx.log(ngx.ERR, "[GDPR] bind_signature_to_honeypot failed (ignored): ", tostring(err))
                    end
                end
            end

            -- XML-RPC block (production hardening): production has zero
            -- legitimate use for xmlrpc.php (see production-hardening.php's
            -- own reasoning -- Jetpack remote/WP mobile app both moved to
            -- the REST API years ago). The mu-plugin already returns 403
            -- for it at the WordPress layer, but that still costs a full
            -- PHP-FPM round-trip per attempt. Block it here, before
            -- proxy_pass, for any request the routing decision above sent
            -- to production -- deliberately does NOT block it for
            -- honeypot-bound requests, since users actually probing
            -- xmlrpc.php there (brute-force via system.multicall, DDoS
            -- amplification via pingback.extensions.getPingbacks) is
            -- exactly the capture surface this system exists to observe.
            if routing_decision.target == "production" and string.match(ngx.var.request_uri or "", "^/xmlrpc%.php") then
                ngx.log(ngx.WARN, "[XML-RPC] Blocked direct production access | IP: ", ngx.var.remote_addr)
                ngx.header["Content-Type"] = "text/plain; charset=UTF-8"
                ngx.status = 403
                ngx.say("XML-RPC services are disabled on this server.")
                return ngx.exit(403)
            end

            -- Store session info for header_filter phase
            -- Store session_id for header_filter if this is a new session
            if is_new_session then
                ngx.var.new_session_id = session_id
                ngx.log(ngx.INFO, "[SESSION] Setting new_session_id=", session_id)
            end

            -- Log final routing decision. "/", honeypot_threshold on both
            -- branches -- not just a cosmetic match for every OTHER score
            -- line in this pipeline (HIGH RISK SCORE/Final score/Low
            -- threat/Clean request all already show "N/80") -- a bare
            -- "Score: 45" gives a dashboard reader no way to tell how close
            -- that was to actually being diverted without cross-referencing
            -- a different log line entirely.
            if routing_decision.target == "honeypot" then
                ngx.log(ngx.WARN, "[FINAL DECISION] 🍯 ROUTING TO HONEYPOT | Score: ", pattern_result.score,
                       "/", _G.config.threat.honeypot_threshold,
                       " | Reason: ", routing_decision.session_data.honeypot_reason or "unknown")
            else
                ngx.log(ngx.INFO, "[FINAL DECISION] ✅ ROUTING TO PRODUCTION | Score: ", pattern_result.score,
                       "/", _G.config.threat.honeypot_threshold)
            end

            -- No tarpit: requests are never held here. A per-route delay
            -- would let a user tell the honeypot from production by
            -- latency, so both routes get the same proxy latency.

            -- Sophistication classification: distinguishes scripted/automated,
            -- manual, and AI-assisted user behaviour (see
            -- sophistication_analyzer.lua for the full signal breakdown).
            -- Pure computation, no I/O, so it runs on every non-static
            -- request; the result is only persisted to the session -- and
            -- thus only visible in ELK -- for traffic that is already
            -- suspicious or honeypot-bound, to avoid extra Redis writes on
            -- uninteresting clean traffic.
            local sophistication_analyzer = require "sophistication_analyzer"
            local profile_subject = session_data or routing_decision.session_data
            local sophistication = sophistication_analyzer.classify_session(
                profile_subject, pattern_result, request_headers)

            if sophistication.classification ~= "unknown" and
               (pattern_result.suspicious or routing_decision.target == "honeypot") then
                routing_decision.update_session = true
                routing_decision.session_data = routing_decision.session_data or {}
                routing_decision.session_data.client_profile = {
                    classification = sophistication.classification,
                    confidence = sophistication.confidence,
                    scores = sophistication.scores,
                    signals = sophistication.signals,
                    updated = ngx.time()
                }
                routing_decision.session_data.timing_samples = sophistication.timing_samples

                ngx.log(ngx.WARN, "[SOPHISTICATION] Classified as ", sophistication.classification,
                        " (confidence=", sophistication.confidence, ") | IP: ", ngx.var.remote_addr,
                        " | Signals: ", table.concat(sophistication.signals, ", "))

                _G.utils.log_security_event("client_sophistication_classified", {
                    ip = ngx.var.remote_addr,
                    session_id = ngx.ctx.session_id,
                    classification = sophistication.classification,
                    confidence = sophistication.confidence,
                    scores = sophistication.scores,
                    signals = sophistication.signals
                })
            end

            -- Update session if needed
            -- Use the session_id from ngx.ctx to ensure consistency
            if routing_decision.update_session then
                session_handler.update_session(ngx.ctx.session_id, routing_decision.session_data)
            else
                -- update_session() re-binds the fingerprint itself; otherwise
                -- refresh it so recovery stays possible while the session is active.
                session_handler.bind_fingerprint_to_session(ngx.ctx.session_id)
            end

            ngx.log(ngx.INFO, "========================================")
            ngx.log(ngx.INFO, "")
        }

        # Default location for all other requests
        location / {
            header_filter_by_lua_block {
                -- ngx.INFO, not ngx.ERR: this fires on literally EVERY
                -- request through this location (successful ones
                -- included -- it's not conditioned on anything going
                -- wrong), so logging it at error severity mislabeled
                -- routine, correctly-working routing decisions as
                -- failures. Matches the sibling server-level
                -- header_filter_by_lua_block's own [HEADER_FILTER]
                -- version of this exact same message above, which
                -- already correctly uses ngx.INFO -- these two blocks
                -- log near-identical information (see §7's "two
                -- near-identical header_filter_by_lua_blocks" note) and
                -- had just drifted to different severities, not a
                -- deliberate distinction.
                ngx.log(ngx.INFO, "[LOCATION / HEADER] route_decision='", ngx.var.route_decision or "nil", "' risk_score='", ngx.var.risk_score or "nil", "'")
                -- Gated behind a shared secret -- see the matching comment on
                -- the server-level header_filter_by_lua_block above, and
                -- BLIND_PENTEST_PROTOCOL.md §8.2.
                local location_secret = _G.config.internal_test_secret
                if ngx.var.is_static_asset ~= "1" and
                   location_secret and location_secret ~= "" and
                   ngx.var.http_x_internal_test_auth == location_secret then
                    ngx.header["X-Route-Target"] = ngx.var.route_decision
                    ngx.header["X-Risk-Score"] = ngx.var.risk_score
                    ngx.log(ngx.INFO, "[LOCATION / HEADER] Set X-Route-Target=", ngx.var.route_decision or "nil")
                end
                
                if ngx.var.new_session_id and ngx.var.new_session_id ~= "" then
                    local cookie_value = require("session_handler").cookie_value(ngx.var.new_session_id) .. "; Path=/; HttpOnly; SameSite=Lax; Secure"
                    -- Append: assigning the header would drop every Set-Cookie the upstream
                    -- sent in this same response (e.g. WooCommerce's cart session).
                    local sid_cookie = _G.config.session.cookie_name .. "=" .. cookie_value
                    local upstream_cookies = ngx.header["Set-Cookie"]
                    if type(upstream_cookies) == "table" then
                        upstream_cookies[#upstream_cookies + 1] = sid_cookie
                        ngx.header["Set-Cookie"] = upstream_cookies
                    elseif upstream_cookies then
                        ngx.header["Set-Cookie"] = { upstream_cookies, sid_cookie }
                    else
                        ngx.header["Set-Cookie"] = sid_cookie
                    end
                    ngx.log(ngx.INFO, "[SESSION] Setting session cookie in header_filter: ", ngx.var.new_session_id)
                end

                ngx.header["X-Powered-By"]   = nil
                ngx.header["X-Generator"]    = nil
                ngx.header["X-Pingback"]     = nil
                ngx.header["WooCommerce"]    = nil
            }

            # Inject the consent-gated gdpr_signature client script into every
            # HTML page (production AND honeypot alike -- this is the proxy
            # layer, so WordPress is never touched). proxy_params already sends
            # Accept-Encoding "" upstream, so the HTML arrives uncompressed and
            # sub_filter can rewrite it reliably; nginx re-gzips on the way out.
            # Only the first </head> is rewritten (sub_filter_types defaults to
            # text/html, which is what we want). See ids/GDPR.md and
            # reverse_proxy_enhanced/gdpr_client.js.
            sub_filter_once on;
            sub_filter '</head>' '<script src="/__gdpr/gdpr.js" defer></script></head>';

            proxy_pass http://$backend_upstream;
            include /etc/nginx/proxy_params;
        }

        # ---------------------------------------------------------------------
        # Consent-gated gdpr_signature client endpoints.
        #
        # Exact-match locations so they win over the static-asset regex
        # location above (which would otherwise proxy "/__gdpr/gdpr.js" to the
        # production backend because it ends in .js). The access_by_lua_block
        # early-returns for the /__gdpr/ prefix, so these never run the routing
        # pipeline. All three are safe to expose: the public key is public by
        # design, and the script is static client code.
        # ---------------------------------------------------------------------

        # The client script itself (served from the bind-mounted file).
        location = /__gdpr/gdpr.js {
            access_log off;
            default_type application/javascript;
            add_header Cache-Control "no-store";
            alias /etc/nginx/gdpr_client.js;
        }

        # Bootstrap config the script fetches: enabled flag, public key,
        # cookie name and the freshness/refresh windows.
        location = /__gdpr/config {
            access_log off;
            default_type application/json;
            add_header Cache-Control "no-store";
            content_by_lua_block {
                ngx.say(require("gdpr_handler").client_config_json())
            }
        }

        # Raw base64 SPKI public key (handy for debugging / external clients).
        location = /__gdpr/pubkey {
            access_log off;
            default_type text/plain;
            content_by_lua_block {
                ngx.say(require("gdpr_handler").public_key_b64() or "")
            }
        }

        location /nginx-health {
            access_log off;
            return 200 "healthy\\n";
            add_header Content-Type text/plain;
        }

        # ---------------------------------------------------------------------
        # Internal threat-state reset -- gated behind the SAME shared secret
        # (X-Internal-Test-Auth) as the X-Route-Target/X-Risk-Score debug
        # headers above. Flushes the in-process lua_shared_dict zones where a
        # host IP's threat reputation actually accumulates (threat_intel holds
        # threat_ips; sessions holds per-session sticky honeypot bindings;
        # rate_limit holds the per-IP request-rate windows).
        #
        # Why this exists: confirmed live that clearing Redis alone does NOT
        # reset a poisoned score -- admin/CVE detections write threat_ips into
        # the threat_intel shared dict directly (no Redis, no TTL -- see
        # pattern_analyzer.check_ip_reputation / init_worker.lua), so the only
        # way to clear it used to be a full `docker compose restart
        # reverse_proxy` (nginx shared dicts live in the master process and
        # survive a reload, only a fresh master starts them empty). That
        # restart can take over a minute (keepalive_timeout drain), which made
        # "reset before each test scenario" impractical to repeat per-pattern
        # for the dashboard's PDF report export. flush_all() on the shared
        # dicts does the same job in-process, instantly, with no restart.
        #
        # Strictly a testing/admin affordance: unreachable unless
        # INTERNAL_TEST_SECRET is set AND presented, exactly like the debug
        # headers. A real external client never has the secret; a genuine
        # user's own reputation is per-IP and this only ever runs when the
        # operator explicitly resets between their own local test scenarios.
        location = /internal-threat-reset {
            access_log off;
            content_by_lua_block {
                local secret = _G.config.internal_test_secret
                if not secret or secret == "" or
                   ngx.var.http_x_internal_test_auth ~= secret then
                    ngx.status = 403
                    ngx.say("forbidden")
                    return
                end
                for _, name in ipairs({ "threat_intel", "sessions", "rate_limit" }) do
                    local dict = ngx.shared[name]
                    if dict then
                        dict:flush_all()
                        -- flush_all() only marks entries expired; flush_expired
                        -- actually reclaims them so a subsequent read is a real miss.
                        dict:flush_expired()
                    end
                end
                ngx.log(ngx.WARN, "[TEST] Threat-state shared dicts flushed via /internal-threat-reset")
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"reset":true,"flushed":["threat_intel","sessions","rate_limit"]}')
            }
        }

        # Reputation-only reset (test-gated, same secret): flushes JUST the
        # threat_intel shared dict -- the IP-reputation store that
        # pattern_analyzer.check_ip_reputation() reads -- WITHOUT touching
        # sessions/rate_limit. The pattern report's threat-decay scenario calls
        # this before each benign probe so the host IP's Suricata-fed reputation
        # (continuously re-imported from the alert log) can't get re-added to
        # every probe's score and mask the session score's decay. Sessions are
        # left intact so the seeded, decaying score survives.
        location = /internal-threat-reset-reputation {
            access_log off;
            content_by_lua_block {
                local secret = _G.config.internal_test_secret
                if not secret or secret == "" or
                   ngx.var.http_x_internal_test_auth ~= secret then
                    ngx.status = 403
                    ngx.say("forbidden")
                    return
                end
                local dict = ngx.shared["threat_intel"]
                if dict then
                    dict:flush_all()
                    dict:flush_expired()
                end
                ngx.log(ngx.WARN, "[TEST] IP-reputation (threat_intel) flushed via /internal-threat-reset-reputation")
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"reset":true,"flushed":["threat_intel"]}')
            }
        }
    }
}
