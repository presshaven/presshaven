# Vector configuration for shipping logs to ELK SIEM via the Vector aggregator
# This configuration collects Docker container, Suricata, Nginx, and Redis logs

sources:
  # Docker container logs, read over the read-only docker_socket_proxy (NOT the
  # raw socket -- see docker-compose.yml's docker_socket_proxy service). Still
  # gets container metadata natively, unlike tailing the raw json-file logs.
  docker_in:
    type: docker_logs
    docker_host: http://docker_socket_proxy:2375
    include_labels:
      - "com.docker.compose.project=${COMPOSE_PROJECT_NAME:-honeypot-ids-system-v1}"

  # Suricata EVE JSON logs
  suricata_eve_in:
    type: file
    include:
      - /var/log/suricata/eve.json

  # Suricata fast.log
  suricata_fast_in:
    type: file
    include:
      - /var/log/suricata/fast.log

  # Nginx access logs
  nginx_access_in:
    type: file
    include:
      - /var/log/nginx/access.log

  # Nginx security logs
  nginx_security_in:
    type: file
    include:
      - /var/log/nginx/security.log

  # Nginx error logs
  nginx_error_in:
    type: file
    include:
      - /var/log/nginx/error.log

  # Redis logs (if available)
  redis_in:
    type: file
    include:
      - /var/log/redis/*.log
    ignore_older_secs: 86400 # 24h

transforms:
  # reverse_proxy's stdout repeats what it writes to its log files (nginx logs
  # every line to both /var/log/nginx/* and stdout), and those files are
  # already shipped below with their own parsing. Shipping both doubled
  # every proxy line -- ~10 per request at info level -- and was most of
  # this shipper's CPU under steady traffic.
  docker_dedupe:
    type: filter
    inputs:
      - docker_in
    condition: '.label."com.docker.compose.service" != "reverse_proxy"'

  docker_tag:
    type: remap
    inputs:
      - docker_dedupe
    source: |
      .log_type = "docker"
      .environment = "${ENVIRONMENT:-development}"
      .honeypot_system = "containers"
      .compose_project = "${COMPOSE_PROJECT_NAME:-honeypot-ids-system-v1}"
      .tags = ["docker", "container", "honeypot"]

  suricata_eve_tag:
    type: remap
    inputs:
      - suricata_eve_in
    source: |
      parsed, err = parse_json(.message)
      if err == null { . = merge(., object!(parsed)) }
      .log_type = "suricata"
      .environment = "${ENVIRONMENT:-development}"
      .honeypot_system = "ids"
      .tags = ["suricata", "ids", "honeypot"]

  # Backstop for the Suricata anomaly feedback loop (suricata.yaml turns
  # anomaly records off): only alerts and whatever else Suricata is told to
  # log go to the SIEM, never per-packet stream anomalies.
  suricata_eve_filter:
    type: filter
    inputs:
      - suricata_eve_tag
    condition: '.event_type != "anomaly"'

  suricata_fast_tag:
    type: remap
    inputs:
      - suricata_fast_in
    source: |
      .log_type = "suricata_fast"
      .environment = "${ENVIRONMENT:-development}"
      .honeypot_system = "ids"
      .tags = ["suricata", "fast", "honeypot"]

  nginx_access_tag:
    type: remap
    inputs:
      - nginx_access_in
    source: |
      .log_type = "nginx_access"
      .environment = "${ENVIRONMENT:-development}"
      .honeypot_system = "reverse_proxy"
      .tags = ["nginx", "access", "honeypot"]

  nginx_security_tag:
    type: remap
    inputs:
      - nginx_security_in
    source: |
      .log_type = "nginx_security"
      .environment = "${ENVIRONMENT:-development}"
      .honeypot_system = "reverse_proxy"
      .tags = ["nginx", "security", "honeypot", "critical"]

  nginx_error_tag:
    type: remap
    inputs:
      - nginx_error_in
    source: |
      .log_type = "nginx_error"
      .environment = "${ENVIRONMENT:-development}"
      .honeypot_system = "reverse_proxy"
      .tags = ["nginx", "error", "honeypot"]
      # error.log holds every nginx/Lua line at info level and up (the request
      # traces the dashboard parses), not only errors. Carry the line's own
      # level, so the SIEM can tell a routine [info] trace from a real
      # [error]/[crit] without reading the message.
      lvl, err = parse_regex(string!(.message), r'^\S+ \S+ \[(?P<level>[a-z]+)\]')
      .log_level = if err == null { lvl.level } else { "unknown" }

  redis_tag:
    type: remap
    inputs:
      - redis_in
    source: |
      .log_type = "redis"
      .environment = "${ENVIRONMENT:-development}"
      .honeypot_system = "session_store"
      .tags = ["redis", "session", "honeypot"]

sinks:
  # Output to the Vector aggregator on the SIEM VM at 147.175.151.193, over
  # mTLS, replacing Filebeat's output.logstash (beats/lumberjack protocol)
  siem_out:
    type: vector
    version: "2"
    inputs:
      - docker_tag
      - suricata_eve_filter
      - suricata_fast_tag
      - nginx_access_tag
      - nginx_security_tag
      - nginx_error_tag
      - redis_tag
    address: "${VECTOR_HOST:-147.175.151.193}:${VECTOR_PORT:-6000}"
    tls:
      enabled: true
      ca_file: /etc/vector/certs/ca.crt
      crt_file: /etc/vector/certs/vector-agent.crt
      key_file: /etc/vector/certs/vector-agent.key
      verify_certificate: true
    # Buffer locally with backpressure and retry the aggregator generously, so
    # a slow or briefly-unavailable SIEM makes this shipper hold + retry the
    # batch rather than the aggregator cancelling the send and dropping it. The
    # aggregator's own acknowledgements + buffer (siem/vector/vector.yaml) are
    # what actually stop the drop; these keep this side resilient meanwhile.
    # (No acknowledgements here on purpose: the docker_logs source can't honour
    # them, and enabling them would only log a "silent data loss" warning.)
    buffer:
      type: memory
      max_events: 10000
      when_full: block
    request:
      timeout_secs: 60
      retry_attempts: 20

  # Optional: direct Elasticsearch output (for fallback or testing)
  # Uncomment if you want to send directly to Elasticsearch instead of via
  # the aggregator. Note: unlike Filebeat, Vector has no setup.template /
  # setup.kibana equivalent — create index templates and dashboards directly
  # in Kibana / Elasticsearch if you use this path.
  # es_direct:
  #   type: elasticsearch
  #   inputs: [docker_tag, suricata_eve_tag, suricata_fast_tag, nginx_access_tag, nginx_security_tag, nginx_error_tag, redis_tag]
  #   endpoints:
  #     - "${ELASTICSEARCH_PROTOCOL:-https}://${ELASTICSEARCH_HOST:-localhost}:${ELASTICSEARCH_PORT:-9200}"
  #   bulk:
  #     index: "honeypot-ids-%Y.%m.%d"
  #   auth:
  #     strategy: basic
  #     user: "${ELASTICSEARCH_USER:-}"
  #     password: "${ELASTICSEARCH_PASSWORD:-}"
  #   tls:
  #     ca_file: /etc/vector/certs/ca.crt
  #     verify_certificate: true

# Vector's own metrics/health, equivalent to Filebeat's monitoring.enabled
api:
  enabled: true
  address: 0.0.0.0:8686
