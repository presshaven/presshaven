---
services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: es01
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - bootstrap.memory_lock=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      # Pins the JVM heap explicitly rather than relying on ES's default
      # ~50%-of-host-RAM auto-sizing -- see .env's ES_MEM_LIMIT/ES_JAVA_OPTS
      # comment for why (confirmed live: this was sizing to ~8.3GB heap
      # for well under 500MB of actual indexed data).
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    mem_limit: ${ES_MEM_LIMIT}
    # Needs vm.max_map_count >= 262144 on the HOST (Elasticsearch memory-maps
    # its index files). A host-level kernel setting compose can't set; the
    # dashboard checks it on every host that runs this stack and shows the
    # fix (dashboard/core/host_settings.py).
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ../elasticsearch/certs:/usr/share/elasticsearch/config/certs:ro
      - es01_data:/usr/share/elasticsearch/data
    ports:
      #      - "127.0.0.1:9000:${ES_PORT}"
      - "${ES_PORT}:${ES_PORT}"
    networks:
      - elastic
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://es01:9200 | grep -q 'missing authentication credentials'"
        ]
      interval: 30s
      timeout: 10s
      retries: 120
      # Probe every 2s (not every `interval`) until the FIRST success during
      # start_period, then fall back to `interval`. Without this, the first
      # probe only runs a full `interval` after start, so init-password,
      # kibana and vector_inbound each sat idle for up to 10s after
      # Elasticsearch was already answering. Same on kibana below.
      # Needs Docker Engine 25+ (ids/docker-compose.yml already relies on it).
      start_period: 300s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Service used to reset kibana_system password after elasticsearch startup
  init-password:
    image: curlimages/curl:8.23.0  # Use a lightweight image
    depends_on:
      es01:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
        echo "Setting the kibana_system password...";
        # --fail-with-body: without it curl exits 0 on an HTTP error, so a
        # 503 from Elasticsearch (its .security index is often not
        # allocated yet in the first seconds after the healthcheck passes)
        # ended this loop as "success" with the password never set, and
        # kibana then sat unhealthy indefinitely, unable to authenticate.
        until curl -sS --fail-with-body --cacert /certs/ca/ca.crt -X POST -u elastic:${ELASTIC_PASSWORD} -H "Content-Type: application/json" \
          "https://es01:9200/_security/user/kibana_system/_password" -d "{\"password\":\"${KIBANA_PASSWORD}\"}";
          do echo "Waiting for Elasticsearch to be ready...";
          sleep 5;
        done

        # If the loop exits, curl succeeded
        echo "Password set successfully for kibana_system.";

        # This is a single-node cluster -- a replica shard can never be
        # assigned to a second node, so the default number_of_replicas=1
        # on every honeypot-* index leaves the cluster permanently in
        # "yellow" status with unassigned shards for no benefit (no HA is
        # possible with one node anyway). Applies to indices created AFTER
        # this template exists; run once, idempotent (same template body
        # every time this service starts).
        echo "Setting number_of_replicas=0 for future honeypot-* indices...";
        curl --cacert /certs/ca/ca.crt -X PUT -u elastic:${ELASTIC_PASSWORD} -H "Content-Type: application/json" \
          "https://es01:9200/_index_template/honeypot-single-node" -d "{\"index_patterns\":[\"honeypot-*\"],\"template\":{\"settings\":{\"number_of_replicas\":0}},\"priority\":500}";
        echo "Index template applied.";
        exit 0;
      '
    volumes:
      - ../elasticsearch/certs/ca:/certs/ca:ro
    networks:
      - elastic
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: kibana
    environment:
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_KEY=config/certs/kibana/kibana.key
      - SERVER_SSL_CERTIFICATE=config/certs/kibana/kibana.crt
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://es01:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      # This SIEM VM has no outbound internet access by design (see
      # ARCHITECTURE.md -- the only network path in or out is the edge
      # host's Vector shipper on port 6000), so every one of Kibana's
      # attempts to reach the real internet fails, loudly and repeatedly:
      # confirmed live, hours of "[WARN] plugins.securitySolution.
      # telemetry_events.sender Error pinging telemetry services" (every
      # ~5-15 minutes, indefinitely) plus the occasional matching
      # "async_sender Runtime error". telemetry.enabled=false is the
      # documented master opt-out switch for ALL of Kibana's telemetry
      # collection/sending, including Security Solution's own telemetry
      # sender (confirmed by reading @kbn/security-solution-plugin's
      # sender.js in the running container: it checks the core Telemetry
      # plugin's getIsOptedIn() FIRST and returns before ever attempting
      # the network ping that was producing this warning) -- so this is a
      # real fix, not a suppression of a real problem, since there's
      # nothing this VM could ever successfully telemeter to anyway.
      - TELEMETRY_ENABLED=false
      # Kibana encrypts some saved objects at rest (Fleet's Agent
      # binary-source API key, alerting/connector credentials, saved-object
      # session info). Without a persistent xpack.encryptedSavedObjects
      # key Fleet setup aborts with "Agent binary source needs encrypted
      # saved object api key to be set" and retries forever (confirmed live:
      # "Fleet setup attempt N failed ... FleetEncryptedSavedObjectEncryption
      # KeyRequired"). The other two keys (session security + reporting) are
      # otherwise regenerated on every container start, which silently
      # invalidates existing sessions/reports -- pinning all three from the
      # .env makes restarts stable. Each must be >= 32 characters.
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTEDSAVEDOBJECTS_KEY}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_SECURITY_ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_REPORTING_ENCRYPTION_KEY}
    mem_limit: ${KIBANA_MEM_LIMIT:-2147483648}
    ports:
      - "${KIBANA_PORT}:${KIBANA_PORT}"
    healthcheck:
      # Only the real HTTP server counts: it answers an anonymous "/" with a
      # 302 to the login page. While Kibana boots, a short-lived *preboot*
      # server on the same port answers "/" with 200 OK and every API with
      # 503 -- this check used to accept that 200, so (probing every 2 s
      # during start_period) Kibana was marked healthy before it could
      # import anything, and kibana_dashboards_setup ran too early. Matches
      # the status code, not the status line: Kibana 9 speaks HTTP/2 over TLS
      # ("HTTP/2 302", no reason phrase), so the old "HTTP/1.1 302 Found"
      # grep never matched and Kibana stayed "starting" forever.
      test:
        [
          "CMD-SHELL",
          "test \"$$(curl -s -o /dev/null -w '%{http_code}' --cacert config/certs/ca/ca.crt https://kibana:5601)\" = 302"
        ]
      interval: 30s
      timeout: 10s
      retries: 1200
      # See es01's healthcheck comment: gates kibana_dashboards_setup.
      start_period: 300s
      start_interval: 2s
    depends_on:
      es01:
        condition: service_healthy
      init-password:
        condition: service_completed_successfully
    volumes:
      - ../kibana/certs:/usr/share/kibana/config/certs:ro
      - kibana_data:/usr/share/kibana/data
    networks:
      - elastic
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Imports the committed Honeypot dashboards (data view + visualizations +
  # the two dashboards themselves -- siem/kibana/saved_objects/
  # honeypot-dashboards.ndjson, built by siem/kibana/build_dashboards.py)
  # into Kibana on every startup. Without this, the dashboards only ever
  # existed as objects someone built by hand in a prior session -- they
  # live in Elasticsearch's .kibana index, so a purge (docker compose down
  # -v) silently wiped them with no way to get them back short of rebuilding
  # every panel from scratch. overwrite=true makes this idempotent: running
  # it again (e.g. after a genuine dashboard edit was committed) just
  # re-applies the committed version rather than erroring on "already
  # exists".
  #
  # defaultRoute is set separately via the plain settings API, not shipped
  # as part of the NDJSON import: Kibana stores it as a `config` saved
  # object keyed by the exact running version string (e.g. "8.17.3"), so an
  # exported copy silently stops applying the moment STACK_VERSION changes
  # -- confirmed live via `GET _find?type=config`. Setting it explicitly
  # here is version-independent. Kibana 9 made the settings API internal
  # ("exists but is not available with the current configuration" without
  # x-elastic-internal-origin, the header Kibana's own UI sends).
  #
  # Robust against a Kibana that is up but not ready: it waits for
  # /api/status to report "available", retries the import until Kibana
  # accepts it (curl --fail-with-body, so a 503 is a retry, not a silent
  # success), then checks that every dashboard in the NDJSON really exists.
  # Anything else exits non-zero, so a failed import is visible in
  # `docker compose ps -a` / the dashboard's Services page instead of looking
  # like a clean run.
  kibana_dashboards_setup:
    image: curlimages/curl:8.23.0
    depends_on:
      kibana:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
        api() { curl -sS --fail-with-body --cacert /certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "kbn-xsrf: true" "$$@"; };
        echo "Waiting for Kibana to report available...";
        n=0;
        until api https://kibana:5601/api/status 2>/dev/null | grep -q "\"overall\":{\"level\":\"available\"";
        do n=$$((n+1)); [ $$n -ge 120 ] && { echo "Kibana did not become available in 10 min"; exit 1; }; sleep 5; done;
        echo "Importing Honeypot dashboards...";
        n=0;
        until out=$$(api -X POST "https://kibana:5601/api/saved_objects/_import?overwrite=true" -F "file=@/data/honeypot-dashboards.ndjson") && echo "$$out" | grep -q "\"success\":true";
        do echo "$$out" | head -c 400; echo; n=$$((n+1)); [ $$n -ge 24 ] && { echo "Import was never accepted"; exit 1; }; echo "Retrying import in 5 s..."; sleep 5; done;
        echo "$$out" | grep -o "\"successCount\":[0-9]*";
        echo "Setting default landing page to the Web Traffic & Threat Overview dashboard...";
        api -H "Content-Type: application/json" -H "x-elastic-internal-origin: Kibana" -X POST "https://kibana:5601/api/kibana/settings" \
          -d "{\"changes\": {\"defaultRoute\": \"/app/dashboards#/view/dashboard-web-threat-overview\"}}" >/dev/null || echo "WARNING: could not set the default route";
        ids=$$(grep -o "\"id\": *\"dashboard-[^\"]*\"" /data/honeypot-dashboards.ndjson | sed "s/.*\"\\(dashboard-[^\"]*\\)\"/\\1/" | sort -u);
        [ -n "$$ids" ] || { echo "No dashboard ids found in the NDJSON"; exit 1; };
        missing=0;
        for id in $$ids; do
          if api "https://kibana:5601/api/saved_objects/dashboard/$$id" >/dev/null 2>&1; then echo "  ok      $$id"; else echo "  MISSING $$id"; missing=1; fi;
        done;
        [ $$missing -eq 0 ] || { echo "Some dashboards are missing after the import"; exit 1; };
        echo "Dashboards imported.";
      '
    volumes:
      - ../elasticsearch/certs/ca:/certs/ca:ro
      - ../kibana/saved_objects/honeypot-dashboards.ndjson:/data/honeypot-dashboards.ndjson:ro
    networks:
      - elastic
    restart: "no"

  # Seeds the active Kibana alerting rules (Elasticsearch-query rules that
  # fire on honeypot diversions, high-severity Suricata alerts, honeytoken
  # use, session compromise, CVE attempts and offensive scanners). Unlike the
  # dashboards, rules are not importable saved objects, so this posts each one
  # through /api/alerting/rule by its stable id -- delete-then-create so the
  # committed definition in kibana/saved_objects/alert_rules/ always wins,
  # the same "the file is the source of truth on every up" semantics the
  # dashboards' overwrite=true import has. Mirrors kibana_dashboards_setup:
  # waits for Kibana available, retries, then verifies every rule exists.
  kibana_alerts_setup:
    image: curlimages/curl:8.23.0
    depends_on:
      kibana:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
        api() { curl -sS --fail-with-body --cacert /certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "kbn-xsrf: true" "$$@"; };
        echo "Waiting for Kibana to report available...";
        n=0;
        until api https://kibana:5601/api/status 2>/dev/null | grep -q "\"overall\":{\"level\":\"available\"";
        do n=$$((n+1)); [ $$n -ge 120 ] && { echo "Kibana did not become available in 10 min"; exit 1; }; sleep 5; done;
        ls /rules/*.json >/dev/null 2>&1 || { echo "No rule files mounted at /rules"; exit 1; };
        echo "Seeding Honeypot alerting rules...";
        for f in /rules/*.json; do
          id=$$(basename "$$f" .json);
          # Tolerate a 404 here: the rule simply does not exist yet on a fresh stack.
          api -X DELETE "https://kibana:5601/api/alerting/rule/$$id" >/dev/null 2>&1 || true;
          n=0;
          until out=$$(api -X POST "https://kibana:5601/api/alerting/rule/$$id" -H "Content-Type: application/json" --data-binary "@$$f") && echo "$$out" | grep -q "\"id\":\"$$id\"";
          do echo "$$out" | head -c 400; echo; n=$$((n+1)); [ $$n -ge 24 ] && { echo "Rule $$id was never accepted"; exit 1; }; echo "Retrying $$id in 5 s..."; sleep 5; done;
          echo "  created $$id";
        done;
        echo "Verifying every rule exists...";
        missing=0;
        for f in /rules/*.json; do
          id=$$(basename "$$f" .json);
          if api "https://kibana:5601/api/alerting/rule/$$id" >/dev/null 2>&1; then echo "  ok      $$id"; else echo "  MISSING $$id"; missing=1; fi;
        done;
        [ $$missing -eq 0 ] || { echo "Some alerting rules are missing after seeding"; exit 1; };
        echo "Alerting rules seeded.";
      '
    volumes:
      - ../elasticsearch/certs/ca:/certs/ca:ro
      - ../kibana/saved_objects/alert_rules:/rules:ro
    networks:
      - elastic
    restart: "no"

  vector_inbound:
    image: timberio/vector:${VECTOR_VERSION}-debian
    container_name: vector_inbound
    environment:
      # Vector 0.50+ no longer expands ${VAR} in its config unless asked to;
      # vector.yaml's Elasticsearch endpoint and credentials come from here.
      - VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
      - ELASTIC_USERNAME=${ELASTIC_USERNAME}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTIC_HOSTS=https://es01:9200
    ports:
      - "0.0.0.0:${VECTOR_PORT}:${VECTOR_PORT}"
    # Was `wget -q -O - http://localhost:8686/health` -- the
    # timberio/vector:*-debian image has neither wget nor curl installed,
    # only the vector binary itself, so this failed every single run with
    # "exec: wget: executable file not found in PATH" (confirmed live via
    # `docker inspect vector_inbound` health log) despite Vector's own /health
    # endpoint responding correctly the whole time -- confirmed separately
    # by hitting it through bash's /dev/tcp, which IS available in this
    # image. Explicitly invoking `bash -c` (not CMD-SHELL, which runs via
    # /bin/sh -> dash in this image, and dash doesn't support /dev/tcp
    # either -- confirmed that failure too before landing on this).
    healthcheck:
      test:
        [
          "CMD", "bash", "-c",
          "exec 3<>/dev/tcp/localhost/8686 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 2s
    # Only needs Elasticsearch (its sole sink) plus init-password's
    # single-node index template, which must exist before the first
    # honeypot-* index is created. It used to also wait for kibana to be
    # healthy, which Vector never talks to, so log ingestion from the edge
    # host only began after Kibana's own (much slower) startup finished.
    depends_on:
      es01:
        condition: service_healthy
      init-password:
        condition: service_completed_successfully
    volumes:
      - ../vector/certs:/usr/share/vector/certs:ro
      - ../vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ../vector/geoip/dbs/:/geoip
      - vector_data:/var/lib/vector
    networks:
      - elastic
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  es01_data:
    driver: local
  kibana_data:
    driver: local
  vector_data:
    driver: local

networks:
  elastic:
    driver: bridge
