sources:
  agent_in:
    type: vector
    version: "2"
    address: 0.0.0.0:6000
    # End-to-end acknowledgements: don't ack a batch back to the edge shipper
    # until it has been durably handled downstream (Elasticsearch accepted it).
    # Without this, when the enrich->ES pipeline applies backpressure the gRPC
    # PushEvents send into the topology is cancelled and the whole 1000-event
    # batch is DROPPED ("Source send cancelled."); with it, the batch is NACKed
    # instead and the shipper simply retries it, so nothing is lost.
    acknowledgements:
      enabled: true
    tls:
      enabled: true
      crt_file: /usr/share/vector/certs/vector/vector.crt
      key_file: /usr/share/vector/certs/vector/vector.key
      ca_file: /usr/share/vector/certs/ca/ca.crt
      verify_certificate: true # enforces client certificate verification (mTLS)

  # This aggregator's OWN pipeline health -- the ES-writing end of the
  # pipeline, so the receiving side is observable too (the edge shipper
  # ships its own internal_metrics across the wire; this is the other end).
  # Both land in honeypot-vector_metrics-* and are told apart by .vector_role.
  aggregator_metrics_in:
    type: internal_metrics
    scrape_interval_secs: 30

transforms:
  enrich:
    type: remap
    inputs:
      - agent_in
    source: |
      ###################################
      ###### GEOIP DATA ENRICHMENT ######
      ###################################

      # GeoIP enrichment disabled - databases not available
      # To enable: download GeoLite2 databases from MaxMind, mount them under
      # /geoip, register them as "enrichment_tables" in this file, and uncomment below
      # .source.geo = get_enrichment_table_record!("geoip_city", { "ip": .src_ip })
      # .source.asn = get_enrichment_table_record!("geoip_asn", { "ip": .src_ip })

      #####################################################
      ###### PARSE NGINX ACCESS/SECURITY LOG MESSAGES ######
      #####################################################

      # .message for nginx_access/nginx_security is a raw combined-log-format
      # line (see ids/reverse_proxy_enhanced/nginx.conf's
      # log_format main/security) -- previously shipped as one opaque text
      # blob, meaning none of it (status code, route decision, risk score)
      # was actually queryable/aggregatable in Kibana. Added this session
      # specifically so real dashboards (threat overview, session analysis)
      # have real fields to build on instead of just Suricata's already-
      # structured alert.* fields.
      if .log_type == "nginx_access" || .log_type == "nginx_security" {
        common, common_err = parse_regex(.message,
          r'^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<method>\S+) (?P<uri>\S+) (?P<http_version>\S+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<referer>[^"]*)" "(?P<user_agent>[^"]*)" "(?P<xff>[^"]*)"')
        if common_err == null {
          # No object!() here (unlike parse_json's result elsewhere in this
          # pipeline): parse_regex()'s success value is already statically
          # known to be an object of string captures, so VRL's compiler
          # rejects an object!() cast on it as a no-op "abort on a failure
          # that can't happen" -- confirmed live (E620) when this used the
          # same object!() pattern as the parse_json call below.
          . = merge(., common)
          .status = to_int(.status) ?? null
          .body_bytes_sent = to_int(.body_bytes_sent) ?? null
        }
      }

      if .log_type == "nginx_security" {
        # threat_score= is the field's name in lines logged before the
        # rename to risk_score; both land in .risk_score.
        sec, sec_err = parse_regex(.message,
          r'session_id="(?P<session_id>[^"]*)" route="(?P<route>[^"]*)" (?:risk|threat)_score="(?P<risk_score>[^"]*)" suspicious="(?P<suspicious>[^"]*)"')
        if sec_err == null {
          . = merge(., sec)
          .risk_score = to_int(.risk_score) ?? 0
          .suspicious = to_bool(.suspicious) ?? false
          # nginx's "-" placeholder for an unset PHPSESSID cookie isn't a
          # real session id -- normalize it to actually-absent rather than
          # the literal three-character string "-", so a "how many distinct
          # sessions" cardinality aggregation isn't off by one forever.
          if .session_id == "-" {
            del(.session_id)
          }
        }
        # Routing-decision fields (nginx.conf's log_format security, filled
        # from router_rules.lua's decision_trace()): this request's own
        # score, the session's decayed carry-over, offenses, decay state,
        # whether the URI matched an attack pattern (uri_class
        # attack_pattern/safe) and which patterns, and the honeypot reason.
        # A separate parse so lines from an older proxy without them still
        # get the fields above.
        dec, dec_err = parse_regex(.message,
          r'request_score="(?P<request_score>[^"]*)" decayed_score="(?P<decayed_score>[^"]*)" offenses="(?P<offenses>[^"]*)" decay_state="(?P<decay_state>[^"]*)" uri_class="(?P<uri_class>[^"]*)" patterns="(?P<patterns>[^"]*)" reason="(?P<route_reason>[^"]*)"')
        if dec_err == null {
          . = merge(., dec)
          .request_score = to_int(.request_score) ?? 0
          .decayed_score = to_int(.decayed_score) ?? 0
          .offenses = to_int(.offenses) ?? 0
          # Points the effective risk_score gained from history rather
          # than from this request -- how much decay still has to wear off.
          carried = (to_int(.risk_score) ?? 0) - .request_score
          if carried < 0 { carried = 0 }
          .carried_score = carried
          if .patterns == "-" {
            del(.patterns)
          } else {
            .patterns = split(string!(.patterns), "|")
          }
          if .route_reason == "-" {
            del(.route_reason)
          }
        }
        # nginx's upstream_cache_status (nginx.conf's log_format security):
        # HIT / MISS / BYPASS / EXPIRED / STALE / UPDATING / REVALIDATED for a
        # request that consulted proxy_cache (the static-asset locations serve
        # CSS/JS/fonts/images through `proxy_cache static_cache`), or "-" when
        # no cache was involved at all -- the whole point of this field is to
        # make the cache-served ("cache-bound") requests visible and filterable
        # in Kibana, since the URIs were always logged but whether they were
        # answered from cache was not. A separate parse (like the blocks above)
        # so lines from a proxy that predates the field still get everything else.
        cache, cache_err = parse_regex(.message, r'cache_status="(?P<cache_status>[^"]*)"')
        if cache_err == null {
          . = merge(., cache)
          # nginx writes "-" (and could write "") when the request never
          # touched proxy_cache; normalize to an explicit, aggregatable value
          # rather than a stray dash so a "cache status" breakdown reads cleanly.
          if .cache_status == "-" || .cache_status == "" {
            .cache_status = "none"
          }
        }

        # Separate a real user navigation (a page requested directly) from the
        # background sub-resources a browser then fetches automatically --
        # CSS, JS, images, fonts -- and XHR/REST calls, so the Kibana
        # dashboards can count actual page views without every asset request
        # inflating the total. nginx's security log carries no
        # Sec-Fetch-Dest/content-type, so this is derived from the request
        # path AND the Referer: a browser-issued sub-resource always carries a
        # Referer pointing at the page that pulled it in, whereas a direct
        # request -- a navigation, or a curl / scanner / attack hit -- does
        # not. So a static-asset extension or XHR endpoint counts as
        # "background" only when it also has a Referer; every direct request
        # (tools included) stays "navigation", which is why a curl fetch is
        # never miscounted as background.
        .request_kind = "navigation"
        req_path = downcase!(split(string(.uri) ?? "", "?")[0])
        ref = string(.referer) ?? ""
        has_referer = ref != "" && ref != "-"
        is_subresource = match(req_path, r'\.(js|mjs|css|map|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|otf|eot|bmp|cur|mp4|webm)$') || match(req_path, r'(admin-ajax\.php|/wp-json/)')
        if is_subresource && has_referer {
          .request_kind = "asset"
        }
      }

      ##############################################################
      ###### PARSE log_security_event() JSON OUT OF NGINX ERROR ######
      ##############################################################

      # init.lua's _G.utils.log_security_event() (honeytoken hits, session
      # compromise, CVE pattern matches, high-risk requests, honeypot
      # routing decisions, user-sophistication classification) writes a
      # JSON blob via ngx.log(), which lands in nginx's error log with
      # nginx's own request-context suffix appended after it, e.g.:
      #   ... [lua] init.lua:523: log_security_event(): SECURITY_EVENT:
      #   {"event_type":"...","details":{...},...}, client: 1.2.3.4,
      #   server: localhost, request: "GET /x HTTP/2.0", host: "localhost"
      # This was previously shipped as nginx_error's opaque `message` text
      # like nginx_access/nginx_security used to be (see above) -- meaning
      # none of session_id/classification/risk scores/CVEs was queryable,
      # which is exactly the session-level and attack-pattern data the
      # "session analysis" and "attack patterns" Kibana dashboards need
      # (README §6/§8 listed both as blocked on this). Fixed by parsing the
      # JSON out here, same as the access/security regex parse above.
      if .log_type == "nginx_error" {
        # `\{.*\}` is greedy, so it matches up to the LAST `}` immediately
        # followed by the literal ", client: " nginx always appends in
        # request context -- correct as long as no field value inside the
        # JSON itself contains that exact substring (true for every event
        # type currently logged; same class of assumption the access/
        # security regex above already makes about its own delimiters).
        evt, evt_err = parse_regex(.message,
          r'SECURITY_EVENT: (?P<security_json>\{.*\}), client: (?P<remote_addr>[^,]*), server: (?P<server_name>[^,]*), request: "(?P<request_line>[^"]*)"')
        if evt_err == null {
          body, body_err = parse_json(evt.security_json)
          if body_err == null {
            body = object!(body)
            .remote_addr = evt.remote_addr
            .request_line = evt.request_line
            .security_event_type = body.event_type
            if exists(body.details) {
              .security_event = object!(body.details)
              # Hoisted to the SAME field name nginx_security's own regex
              # parse above uses, so a session_id terms aggregation in
              # Kibana can group both log types together on one field.
              if exists(.security_event.session_id) {
                .session_id = .security_event.session_id
              }
              # Some events log an empty array for these when nothing
              # matched (e.g. high_risk_request's cves when the score
              # came from patterns alone) -- confirmed live that whichever
              # doc reaches ES FIRST for a given day's index locks that
              # field's mapping from its own shape, and an empty array []
              # locks it as `object`, not `keyword`. Every later doc in the
              # same index that has a REAL (non-empty) array for the same
              # field then fails Elasticsearch's mapping check and gets
              # silently dropped by the bulk API (same class of issue the
              # docker-label dot-flattening fix above already deals with).
              # Deleting the field when empty means only ever a real
              # populated array defines the mapping, so the field is never
              # dropped for having the wrong shape.
              if exists(.security_event.cves) && is_array(.security_event.cves) && (length(.security_event.cves) ?? 1) == 0 {
                del(.security_event.cves)
              }
              if exists(.security_event.patterns) && is_array(.security_event.patterns) && (length(.security_event.patterns) ?? 1) == 0 {
                del(.security_event.patterns)
              }
              if exists(.security_event.signals) && is_array(.security_event.signals) && (length(.security_event.signals) ?? 1) == 0 {
                del(.security_event.signals)
              }
            }
          }
        }
      }

      ###########################################################
      ###### THREAT INTELLIGENCE: USER, TOOL, ATT&CK, CVE ######
      ###########################################################

      # Gives every user-facing event (proxy-scored requests, the
      # proxy's own security events, Suricata alerts) the same indicator
      # fields, so the "Threat Intelligence" Kibana dashboard can pivot on
      # one user across both sensors and say WHAT they did in MITRE
      # ATT&CK terms rather than in this project's internal pattern names:
      #   client_ip            the client (nginx remote_addr / Suricata src_ip)
      #   sensor                 reverse_proxy | suricata
      #   client_tool          tool fingerprinted from the User-Agent
      #   client_tool_class    offensive_scanner | scripted_client |
      #                          search_crawler | browser | unknown
      #   risk_verdict         flagged | suspicious | benign
      #   threat.technique.id/.name, threat.tactic.name   (ECS field names)
      #   attack_technique       "T1190 Exploit Public-Facing Application"
      #   attack_tactic          "03 Initial Access" (sorts in kill-chain order)
      #   threat.stage           furthest ATT&CK tactic as its column number
      #                          in the Enterprise matrix (1 Reconnaissance ..
      #                          14 Impact), so max() per user says how
      #                          far along the kill chain they got
      #   vulnerability.id       CVE ids named by any sensor
      # Only the request-level events are mapped to techniques: the proxy's
      # cve_pattern_detected / high_risk_request / routing_to_honeypot
      # events restate a request nginx_security already logged, so mapping
      # them too would count each technique twice. honeytoken_used and
      # session_compromised add something the request log can't show.
      ti_ind = ""
      ti_ua = ""
      ti_ip = ""
      ti_map = false
      if .log_type == "nginx_security" {
        ti_ip = to_string(.remote_addr) ?? ""
        ti_ua = to_string(.user_agent) ?? ""
        if is_array(.patterns) { ti_ind = join(.patterns, " ") ?? "" }
        ti_map = true
        .sensor = "reverse_proxy"
      } else if .log_type == "nginx_error" && exists(.security_event_type) {
        ti_ip = to_string(.remote_addr) ?? ""
        ti_ua = to_string(.security_event.user_agent) ?? ""
        ti_ind = to_string(.security_event_type) ?? ""
        ti_map = ti_ind == "honeytoken_used" || ti_ind == "session_compromised"
        if exists(.security_event.cve) { ti_ind = ti_ind + " " + (to_string(.security_event.cve) ?? "") }
        if is_array(.security_event.cves) { ti_ind = ti_ind + " " + (join(.security_event.cves, " ") ?? "") }
        .sensor = "reverse_proxy"
      } else if .log_type == "suricata" && .event_type == "alert" {
        # Suricata sees the proxy's hop to the backends too, where src_ip is
        # the proxy; the xff field (suricata.yaml, eve-log xff extra-data:
        # http.xff on HTTP alerts, alert.xff on stream-level ones) names the
        # real client. The proxy's own backend health probes
        # (lua-resty-http, no X-Forwarded-For) are nobody's attack. A rare
        # alert on that hop with neither stays on src_ip.
        xff = to_string(.http.xff) ?? ""
        if xff == "" { xff = to_string(.alert.xff) ?? "" }
        if xff == "" { xff = to_string(.xff) ?? "" }
        ti_ip = if xff != "" { xff } else { to_string(.src_ip) ?? "" }
        ti_ua = to_string(.http.http_user_agent) ?? ""
        if starts_with(ti_ua, "lua-resty-http") && xff == "" { ti_ip = "" }
        ti_ind = to_string(.alert.signature) ?? ""
        ti_map = true
        .sensor = "suricata"
      }

      if ti_ip != "" {
        .client_ip = ti_ip
        ti_ind = downcase(ti_ind)
        ua = downcase(ti_ua)

        # -- Tool fingerprint (User-Agent) ------------------------------
        # Offensive tools first: several of them also say "Mozilla" or
        # "python" in their default User-Agent.
        tool = "none"
        tool_class = "none"
        if ua == "" && .log_type != "nginx_security" {
          # Not every alert or security event records the User-Agent; only
          # the access log's "-" means the client really sent none.
          tool = "unknown"
          tool_class = "unknown"
        } else if ua == "" || ua == "-" {
          tool = "no user-agent"
          tool_class = "scripted_client"
        } else if match(ua, r'sqlmap') { tool = "sqlmap"; tool_class = "offensive_scanner"
        } else if match(ua, r'nikto') { tool = "nikto"; tool_class = "offensive_scanner"
        } else if match(ua, r'wpscan') { tool = "wpscan"; tool_class = "offensive_scanner"
        } else if match(ua, r'nuclei') { tool = "nuclei"; tool_class = "offensive_scanner"
        } else if match(ua, r'nmap') { tool = "nmap"; tool_class = "offensive_scanner"
        } else if match(ua, r'masscan|zgrab') { tool = "masscan/zgrab"; tool_class = "offensive_scanner"
        } else if match(ua, r'gobuster|dirbuster|\bdirb\b|ffuf|feroxbuster|wfuzz') { tool = "directory brute-forcer"; tool_class = "offensive_scanner"
        } else if match(ua, r'hydra|medusa') { tool = "hydra"; tool_class = "offensive_scanner"
        } else if match(ua, r'acunetix|nessus|openvas|qualys|netsparker|zap|burp') { tool = "commercial scanner"; tool_class = "offensive_scanner"
        } else if match(ua, r'whatweb|wappalyzer') { tool = "whatweb"; tool_class = "offensive_scanner"
        } else if match(ua, r'havij|pangolin|metasploit|msf') { tool = "exploit framework"; tool_class = "offensive_scanner"
        } else if match(ua, r'^curl/') { tool = "curl"; tool_class = "scripted_client"
        } else if match(ua, r'^wget/') { tool = "wget"; tool_class = "scripted_client"
        } else if match(ua, r'python-requests|python-urllib|aiohttp|httpx|scrapy') { tool = "python"; tool_class = "scripted_client"
        } else if match(ua, r'go-http-client') { tool = "go"; tool_class = "scripted_client"
        } else if match(ua, r'okhttp|apache-httpclient|java/') { tool = "java"; tool_class = "scripted_client"
        } else if match(ua, r'libwww-perl|powershell|node-fetch|axios') { tool = "other script"; tool_class = "scripted_client"
        } else if match(ua, r'headlesschrome|phantomjs|selenium|playwright|puppeteer') { tool = "headless browser"; tool_class = "scripted_client"
        } else if match(ua, r'googlebot|bingbot|yandex|baiduspider|duckduckbot|ahrefs|semrush') { tool = "search crawler"; tool_class = "search_crawler"
        } else if match(ua, r'bot|crawler|spider|scanner') { tool = "other bot"; tool_class = "scripted_client"
        } else if match(ua, r'^mozilla/') { tool = "browser"; tool_class = "browser"
        } else { tool = "other"; tool_class = "scripted_client" }
        .client_tool = tool
        .client_tool_class = tool_class

        # -- MITRE ATT&CK techniques -------------------------------------
        # Matched against this project's pattern names (pattern_rules.lua),
        # the proxy's security event types and Suricata signature text
        # (ids/suricata_rules/local.rules). "id|name|tactic|stage".
        techs = []
        if ti_map {
          if match(ti_ind, r'sql_|sql injection|cve-|wp_install_access|install_php|admin_post|directory_traversal|directory traversal|_wrapper|wrapper usage|uri scheme|exploit|unauthorized|options update') {
            techs = push(techs, "T1190|Exploit Public-Facing Application|Initial Access|3")
          }
          if match(ti_ind, r'cmd_|command injection') {
            techs = push(techs, "T1059.004|Command and Scripting Interpreter: Unix Shell|Execution|4")
          }
          if match(ti_ind, r'xss|enc_script') {
            techs = push(techs, "T1059.007|Command and Scripting Interpreter: JavaScript|Execution|4")
          }
          if match(ti_ind, r'upload|rce') {
            techs = push(techs, "T1505.003|Server Software Component: Web Shell|Persistence|5")
          }
          if match(ti_ind, r'wp_user_creation|user creation|role assignment') {
            techs = push(techs, "T1136|Create Account|Persistence|5")
          }
          if match(ti_ind, r'session_compromised') {
            techs = push(techs, "T1550.004|Use Alternate Authentication Material: Web Session Cookie|Defense Evasion|7")
          }
          if match(ti_ind, r'honeytoken_used') {
            techs = push(techs, "T1078|Valid Accounts|Defense Evasion|7")
          }
          if match(ti_ind, r'wp_config|env_file|htaccess|config file|encryption key') {
            techs = push(techs, "T1552.001|Unsecured Credentials: Credentials In Files|Credential Access|8")
          }
          if match(ti_ind, r'etc_passwd|system file') {
            techs = push(techs, "T1003.008|OS Credential Dumping: /etc/passwd and /etc/shadow|Credential Access|8")
          }
          if match(ti_ind, r'brute force|xmlrpc_multicall') || tool == "hydra" {
            techs = push(techs, "T1110|Brute Force|Credential Access|8")
          }
          if match(ti_ind, r'bak_file|old_file|backup_zip|wp_backup|backup file|sensitive file') {
            techs = push(techs, "T1005|Data from Local System|Collection|11")
          }
          if match(ti_ind, r'author_enum|user_enumeration|user enumeration') {
            techs = push(techs, "T1589|Gather Victim Identity Information|Reconnaissance|1")
          }
          if match(ti_ind, r'phpinfo|version detection|theme detection|plugin enumeration|plugin access|xmlrpc|whatweb') {
            techs = push(techs, "T1592.002|Gather Victim Host Information: Software|Reconnaissance|1")
          }
          if match(ti_ind, r'admin_scan|administrator_scan|phpmyadmin_scan|backup_scan|direct_admin_access|admin panel discovery|dirb|gobuster') || tool == "directory brute-forcer" {
            techs = push(techs, "T1595.003|Active Scanning: Wordlist Scanning|Reconnaissance|1")
          }
          if match(ti_ind, r'high_request_frequency|high rate|rapid vulnerability|multiple vulnerability|automated tool|malicious user agent') || (tool_class == "offensive_scanner" && tool != "directory brute-forcer" && tool != "hydra") {
            techs = push(techs, "T1595.002|Active Scanning: Vulnerability Scanning|Reconnaissance|1")
          }
        }

        if length(techs) > 0 {
          ids = []
          names = []
          tactics = []
          tech_labels = []
          tactic_labels = []
          stage = 0
          for_each(techs) -> |_i, t| {
            parts = split(string!(t), "|")
            ids = push(ids, parts[0])
            names = push(names, parts[1])
            tactics = push(tactics, parts[2])
            tech_labels = push(tech_labels, string!(parts[0]) + " " + string!(parts[1]))
            s = to_int(parts[3]) ?? 0
            # Zero-padded so a Kibana terms agg sorted by key lists the
            # tactics in kill-chain order ("01 Reconnaissance" first).
            pad = if s < 10 { "0" } else { "" }
            tactic_labels = push(tactic_labels, pad + to_string(s) + " " + string!(parts[2]))
            if s > stage { stage = s }
          }
          .threat.framework = "MITRE ATT&CK"
          .threat.technique.id = unique(ids)
          .threat.technique.name = unique(names)
          .threat.tactic.name = unique(tactics)
          .threat.stage = stage
          # One field each holding id+name / stage+tactic together: the
          # ECS fields above are parallel arrays, and a terms agg on one
          # with a sub-agg on the other would pair every id with every name.
          .attack_technique = unique(tech_labels)
          .attack_tactic = unique(tactic_labels)
        }

        # -- CVEs named by any sensor -------------------------------------
        cves = []
        for_each(parse_regex_all(ti_ind, r'cve[-_](?P<y>\d{4})[-_](?P<n>\d{4,7})') ?? []) -> |_i, m| {
          cves = push(cves, "CVE-" + string!(m.y) + "-" + string!(m.n))
        }
        if length(cves) > 0 {
          .vulnerability.id = unique(cves)
        }

        # -- Verdict --------------------------------------------------------
        if .sensor == "suricata" {
          .risk_verdict = if (to_int(.alert.severity) ?? 3) <= 2 { "flagged" } else { "suspicious" }
        } else if .log_type == "nginx_error" {
          .risk_verdict = "flagged"
        } else if .route == "honeypot" || .uri_class == "attack_pattern" || length(techs) > 0 || tool_class == "offensive_scanner" {
          .risk_verdict = "flagged"
        } else if (to_int(.risk_score) ?? 0) > 0 {
          .risk_verdict = "suspicious"
        } else {
          .risk_verdict = "benign"
        }
      }

      ###############################################
      ###### FLATTEN DOCKER LABEL KEYS (DOTTED) ######
      ###############################################

      # Docker Compose v2 sets BOTH "com.docker.compose.project" (a plain
      # string, the project name) AND "com.docker.compose.project.config_hash"
      # / ".working_dir" (also plain strings) as real labels on every
      # container -- confirmed live via `docker inspect`. Elasticsearch
      # dot-expands field names into nested objects, so
      # "label.com.docker.compose.project" ends up needing to be BOTH a leaf
      # string AND a parent object at once -- every docker-sourced event hit
      # "can't merge a non object mapping [label.com.docker.compose.project]
      # with an object mapping" and got silently dropped (bulk API rejects
      # that one item with status 400; other events in the same batch, e.g.
      # suricata alerts, still indexed fine, which is why this went
      # unnoticed as a total pipeline failure). Fixed by replacing "." with
      # "_" in every label key before it reaches Elasticsearch, so ES only
      # ever sees flat field names -- no information lost, just unambiguous
      # paths. This also sidesteps whatever bad mapping is already locked in
      # for today's index (honeypot-docker-YYYY.MM.DD), since the
      # underscored keys are new field paths ES has never mapped before.
      if exists(.label) {
        label_map, label_err = object(.label)
        if label_err == null {
          .label = map_keys(label_map) -> |key| { replace(key, ".", "_") }
        }
      }

      #######################################
      ###### REMOVE UNNECESSARY FIELDS ######
      #######################################

      del(.tags)
      del(.ecs.version)
      del(.input.type)
      del(.dst_ip)
      del(.dst_port)
      del(.log.file.path)
      del(.log.offset)
      del(.source.ip)

  # The Elasticsearch sink only accepts LOG events, so the aggregator's own
  # metrics are flattened to logs and tagged the same way the edge shipper
  # tags its metrics, so they route into honeypot-vector_metrics-DATE too.
  # (A separate path from `enrich`: metrics need none of its log parsing.)
  aggregator_metrics_log:
    type: metric_to_log
    inputs:
      - aggregator_metrics_in
  aggregator_metrics_tag:
    type: remap
    inputs:
      - aggregator_metrics_log
    source: |
      .log_type = "vector_metrics"
      .vector_role = "siem_aggregator"
      .tags = ["vector", "metrics", "siem"]

sinks:
  elasticsearch_out:
    type: elasticsearch
    inputs:
      - enrich
      - aggregator_metrics_tag
    endpoints:
      - "${ELASTIC_HOSTS}" # Replace with your Elasticsearch URL
    bulk:
      # Was the literal placeholder "hello-world-index" -- every shipped
      # event (nginx access/error/security, suricata, docker, redis) landed
      # in the same untyped bucket, with no date rotation. The edge
      # shipper's vector.yaml already tags every event with .log_type
      # (docker/suricata/suricata_fast/nginx_access/nginx_security/
      # nginx_error/redis) specifically so the aggregator could split on
      # it -- this just actually uses that field. Daily rotation matches
      # standard ELK/Kibana index-pattern conventions (index per day,
      # e.g. for retention/ILM policies).
      index: "honeypot-{{ log_type }}-%Y.%m.%d"
    auth:
      strategy: basic
      user: "${ELASTIC_USERNAME}"
      password: "${ELASTIC_PASSWORD}"
    tls:
      ca_file: /usr/share/vector/certs/ca/ca.crt
    # Absorb Elasticsearch slowdowns/bursts in a larger in-memory buffer that
    # applies backpressure (block) rather than dropping, so a transient ES
    # slowdown doesn't cascade into cancelled source sends upstream.
    buffer:
      type: memory
      max_events: 10000
      when_full: block
    # Keep retrying rejected bulk requests instead of giving up on the batch.
    request:
      retry_attempts: 20

api:
  enabled: true
  address: 0.0.0.0:8686
